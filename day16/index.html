:root{--ink:#111;--red:#e0473a;--g:#8c8c8c;--line:#d8d8d8}
html,body{margin:0;background:#fff;color:var(--ink)}
body{font-family:"Noto Sans KR","Apple SD Gothic Neo",sans-serif;min-height:100vh;
 background:radial-gradient(260px 220px at 85% 18%,rgba(0,0,0,.055),transparent 70%),radial-gradient(300px 260px at 10% 62%,rgba(0,0,0,.045),transparent 70%),radial-gradient(240px 240px at 80% 88%,rgba(0,0,0,.05),transparent 70%),#fff}
.m{font-family:"Share Tech Mono",ui-monospace,Menlo,monospace;letter-spacing:.02em}
.wrap{max-width:520px;margin:0 auto;padding:22px 20px 28px;box-sizing:border-box;min-height:100vh;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:baseline;font-size:15px}
.scr{display:none;flex:1;flex-direction:column}.scr.on{display:flex;animation:in .45s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1{font-size:26px;font-weight:700;margin:16px 0 2px;letter-spacing:-.02em}
.sub{font-size:13px;color:#555}
.red{color:var(--red)}
svg{display:block;width:100%;height:auto}
.btn{display:block;width:100%;height:48px;background:var(--ink);color:#fff;border:0;font-size:17px;letter-spacing:.14em;cursor:pointer;margin-top:10px}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--ink)}
.btn:disabled{opacity:.3;cursor:default}

function presetPlan(){const c=S.city,st=S.style,days=S.days,ppl=S.ppl,R=rng(Date.now()%100000);

  // nearest neighbour from the hub
  const order=[];let cur=c.ll,rest=[...pick];while(rest.length){rest.sort((a,b)=>km(cur,a.ll)-km(cur,b.ll));const n=rest.shift();order.push(n);cur=n.ll}
  const chunks=[];const sizes=Array.from({length:days},(_,i)=>Math.floor(order.length/days)+(i<order.length%days?1:0));let p=0;sizes.forEach(z=>{chunks.push(order.slice(p,p+z));p+=z});
  const pathLen=(l,a,z)=>{let d=0,p=a;l.forEach(s=>{d+=km(p,s.ll);p=s.ll});return d+(z?km(p,z):0)};
  chunks.forEach((l,i)=>{const a=i===0?c.ll:chunks[i-1][chunks[i-1].length-1]?.ll||c.ll,z=i===days-1?c.ll:null;if(pathLen([...l].reverse(),a,z)<pathLen(l,a,z))l.reverse()});
  chunks.forEach((l,i)=>{if(i===days-1||l.length<2)return;const fi=l.findIndex(s=>s.tg.includes('F'));if(fi>=0&&fi<l.length-1){const [f]=l.splice(fi,1);l.push(f)}});
  const B={transport:c.go.f*2,stay:days>1?c.stay.p*(days-1)*Math.ceil(ppl/2)/ppl:0,food:(days-1)*9000,cafe:6000*days,ticket:0};
  const out=[];
  chunks.forEach((list,di)=>{const items=[];let t,at;
    if(di===0){t=8*60;items.push({t:clock(t),k:`${c.go.from} 출발`,en:null,ll:null,d:`${c.go.m} 타고 ${c.go.to}까지`,mv:`${c.go.m} ${hm(c.go.t)}`,hub:1});t+=c.go.t+10;at=c.ll}
    else{t=9*60+30;at=list[0]?list[0].ll:c.ll;items.push({t:clock(t-30),k:'숙소에서 아침',en:null,ll:null,d:`${c.stay.a}에서 출발`,mv:'',hub:1,first:1})}
    list.forEach((s,i)=>{const mv=moveOf(at,s.ll,ppl);if(i>0||di===0){B.transport+=mv.c}t+=i===0&&di>0?0:mv.t;
      if(items.length)items[items.length-1].mv=items[items.length-1].mv||mv.l;
      items.push({t:clock(t),k:s.k,en:s.en,ll:s.ll,d:s.d,mv:''});t+=s.dur+10;at=s.ll;
      const cat=s.tg.includes('F')?'food':s.tg.includes('B')?'cafe':'ticket';B[cat]+=s.cost});
    if(di===days-1){const mv=moveOf(at,c.ll,ppl);B.transport+=mv.c;items[items.length-1].mv=mv.l;t=Math.max(t+mv.t,15*60);items.push({t:clock(t),k:`${c.go.to}에서 귀가`,en:null,ll:null,d:`${c.go.m} ${hm(c.go.t)} · 서울 도착 ${clock(t+c.go.t)}`,mv:'',hub:1})}
    else{items[items.length-1].mv='TAXI 15';B.transport+=12000/Math.min(ppl,4);items.push({t:clock(Math.max(t+15,18*60)),k:'숙소 체크인',en:null,ll:null,d:c.stay.a,mv:'',hub:1})}
    out.push({items})});
  const tips=[`${c.go.m}는 주말에 빨리 매진돼요. 2주 전쯤 예매해 두세요.`,`이동이 많은 날은 택시보다 묶음으로 움직이면 시간을 아낄 수 있어요.`,STYLE_TIP[st]];
  return {src:'PRESET',days:out,budget:B,tips,summary:`${c.k}의 ${STYLES.find(x=>x[0]===st)[2]} 코스를 동선이 짧은 순서로 묶었어요.`}}
const STYLE_TIP={N:'걷는 일정이 많아요. 편한 신발과 얇은 겉옷을 챙기세요.',H:'일정 사이 여유 시간을 넉넉히 두었어요. 마음에 드는 곳에서 더 머물러도 좋아요.',F:'유명한 곳은 오픈 시간에 맞춰 가면 줄이 짧아요.',B:'인기 빵은 오전에 품절되기 쉬워요. 빵집을 먼저 들르세요.'};

/* ---------- AI (claude.ai only) ---------- */
const sampleP=(window.claude&&claude.use)?claude.use('sample').catch(()=>null):Promise.resolve(null);
async function aiPlan(onProg){const sample=await Promise.race([sampleP,new Promise(r=>setTimeout(()=>r(null),4000))]);if(!sample)return null;
  const c=S.city,stl=STYLES.find(x=>x[0]===S.style),dl=DAYS.find(x=>x[0]===S.days)[2];
  const cand=c.spots.map(s=>`${s[0]} (${s[1]}, ${s[3]},${s[2]}, ${s[7]})`).join('\n');
  const prompt=`너는 국내 여행 플래너야. 아래 조건으로 실제 존재하는 장소만 써서 여행 코스를 짜 줘.
- 여행지: ${c.k} (${c.id})
- 출발: 서울 ${c.go.from}, 교통 ${c.go.m} 편도 약 ${c.go.t}분, 편도 요금 약 ${c.go.f}원
- 여행 스타일: ${stl[2]} (${stl[1]})
- 기간: ${dl} (${S.days}일), 인원 ${S.ppl}명
- 참고 후보지(이름, 영문, 위도, 경도, 설명). 가능하면 이 중에서 고르고, 다른 곳을 넣을 땐 잘 알려진 실제 장소만:
${cand}
규칙: 첫째 날은 서울 출발 항목으로 시작하고 마지막 날은 서울로 돌아가는 항목으로 끝내. 동선이 짧게 순서를 정해. 하루 4~5곳. 장소에는 위도(lat)·경도(lon)를 소수점 3자리로 넣고, 출발·숙소·귀가 같은 이동 항목은 lat, lon을 null로. 예산은 1인 기준 원화 정수.
JSON 하나만 출력해. 다른 말, 코드블록 없이:
{"summary":"코스 한 줄 소개","days":[{"items":[{"time":"08:00","place":"한국어 장소명","en":"ENGLISH NAME (UPPERCASE, 20자 이내)","lat":37.0,"lon":128.0,"desc":"한 줄 설명","move":"다음 장소까지 이동 (예: TAXI 15, WALK 10, BUS 20, KTX 1H 50M)"}]}],"budget":{"transport":0,"stay":0,"food":0,"cafe":0,"ticket":0},"tips":["팁 한 줄","팁 한 줄","팁 한 줄"]}`;
  const ac=new AbortController();let to=setTimeout(()=>ac.abort(),240000),started=false;S.aiTried=true;
  try{const r=await sample(prompt,{modelTier:'default',signal:ac.signal,onText:({text})=>{if(!started){started=true;clearTimeout(to);to=setTimeout(()=>ac.abort(),90000)}onProg&&onProg(text.length)}});clearTimeout(to);
    const txt=r.text.replace(/^[^{]*/,'').replace(/[^}]*$/,'');const j=JSON.parse(txt);return normAI(j)}catch(e){clearTimeout(to);console.warn('AI plan failed',e);return null}}
function normAI(j){const c=S.city;if(!j||!Array.isArray(j.days)||!j.days.length)return null;
  const ok=(la,lo)=>typeof la==='number'&&typeof lo==='number'&&Math.abs(la-c.ll[1])<.8&&Math.abs(lo-c.ll[0])<.9;
  const days=j.days.map(d=>({items:(d.items||[]).map(it=>({t:String(it.time||'').slice(0,5),k:it.place||'',en:it.en?String(it.en).toUpperCase().slice(0,22):null,ll:ok(it.lat,it.lon)?[it.lon,it.lat]:null,d:it.desc||'',mv:it.move||'',hub:ok(it.lat,it.lon)?0:1}))})).filter(d=>d.items.length);
  const b=j.budget||{},B={};['transport','stay','food','cafe','ticket'].forEach(k=>B[k]=Math.max(0,+b[k]||0));
  if(!days.length)return null;return {src:'AI',days,budget:B,tips:(j.tips||[]).slice(0,4).map(String),summary:j.summary||''}}

async function makePlan(){S.aiTried=false;show(3);$('out').innerHTML=`<div class="load"><div class="m">PLANNING ${esc(S.city.id)} …</div><div class="bar">${'<i></i>'.repeat(7).replace(/<i><\/i>/g,(m,i)=>m)}</div><div id="prog" class="m" style="font-size:11px;color:#8c8c8c">AI가 코스와 예산을 짜고 있어요</div></div>`;
  document.querySelectorAll('.load .bar i').forEach((x,i)=>x.style.animationDelay=(i*.12)+'s');
  let plan=await aiPlan(n=>{const p=$('prog');if(p)p.textContent=`AI가 코스와 예산을 짜고 있어요 · ${n} CHARS`});
  if(!plan){await new Promise(r=>setTimeout(r,900));plan=presetPlan()}
  render(plan)}
$('plan').onclick=makePlan;

/* ---------- 3. render ---------- */
function localMap(plan){const pts=[];plan.days.forEach(d=>d.items.forEach(it=>{if(it.ll&&!it.hub)pts.push(it)}));
  const W=480,H=270;let s=MGx('mg3');if(!pts.length)return '';
  let lo0=Math.min(...pts.map(p=>p.ll[0])),lo1=Math.max(...pts.map(p=>p.ll[0])),la0=Math.min(...pts.map(p=>p.ll[1])),la1=Math.max(...pts.map(p=>p.ll[1]));
  let cx=(lo0+lo1)/2,cy=(la0+la1)/2,sx=Math.max(.05,(lo1-lo0)*1.35),sy=Math.max(.04,(la1-la0)*1.35);
  // keep aspect (lat stretched 1.25)
  if(sx/(sy*1.25)<W/H)sx=sy*1.25*W/H;else sy=sx*H/W/1.25;
  const P=([lo,la])=>[(lo-(cx-sx/2))/sx*W,((cy+sy/2)-la)/sy*H],st=10,R=rng(S.city.id.length*31+pts.length);
  let dots='',sea=[],landC=[];for(let y=6;y<H;y+=st)for(let x=5;x<W;x+=st){const lo=cx-sx/2+x/W*sx,la=cy+sy/2-y/H*sy;let land=onLand(lo,la);if(!land)for(const p of pts){if(Math.abs(p.ll[0]-lo)<sx*.05&&Math.abs(p.ll[1]-la)<sy*.06){land=true;break}}
    if(land){dots+=`M${x} ${y}h1.6v1.6h-1.6z`;landC.push([x,y])}else if(R()<.014&&!sea.some(q=>Math.abs(q[0]-x)<40&&Math.abs(q[1]-y)<22))sea.push([x,y])}
  s+=`<path d="${dots}" fill="${INK}"/>`+sea.map(([x,y])=>wave(x,y)+wave(x+12,y)).join('');
  const xy0=pts.map(p=>P(p.ll));let nPk=0;PEAKS.forEach(([lo,la,z],i)=>{const [x,y]=P([lo,la]);if(x<15||x>W-15||y<30||y>H)return;nPk++;const w=Math.min(60,28*z*Math.max(1,.5/sx)),h=w*1.05;s+=`<rect x="${x-w/2-3}" y="${y-h-3}" width="${w+6}" height="${h+6}" fill="#fff"/>`+mountain(x,y,w,h,40+i,'mg3')});
  if(!nPk&&landC.length){const far=landC.filter(([x,y])=>y>40&&x>20&&x<W-20).map(c=>[c,Math.min(...xy0.map(q=>Math.hypot(q[0]-c[0],q[1]-c[1])))]).sort((a,b)=>b[1]-a[1]);const used=[];for(const [[x,y],d] of far){if(d<70||used.length>=3)break;if(used.some(u=>Math.hypot(u[0]-x,u[1]-y)<60))continue;used.push([x,y]);const w=30-used.length*6+12,h=w*1.05;s+=`<rect x="${x-w/2-3}" y="${y-h-3}" width="${w+6}" height="${h+6}" fill="#fff"/>`+mountain(x,y,w,h,70+used.length,'mg3')}}
  const xy=pts.map(p=>P(p.ll));let d='';xy.forEach((p,i)=>d+=(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1));
  s+=`<path d="${d}" fill="none" stroke="${RED}" stroke-width="1.5" stroke-dasharray="1 5" stroke-linecap="round"/>`;
  const boxes=xy.map(([x,y])=>[x-9,y-9,18,18]),hit=(b)=>boxes.some(o=>b[0]<o[0]+o[2]&&b[0]+b[2]>o[0]&&b[1]<o[1]+o[3]&&b[1]+b[3]>o[1]);let lbls='';
  pts.forEach((p,i)=>{const [x,y]=xy[i],en=p.en||'',w=en.length*6.1+8;let best=null;
    for(const dy of [0,-14,14,-28,28]){for(const side of [1,-1]){const lx=side>0?x+12:x-12-w,b=[lx-3,y-8+dy,w,15];if(lx<0||lx+w>W||b[1]<0||b[1]+15>H)continue;if(!hit(b)){best=[lx,dy,b];break}}if(best)break}
    if(!best){const lx=x+12+w>W?x-12-w:x+12;best=[lx,0,[lx-3,y-8,w,15]]}
    boxes.push(best[2]);const [lx,dy]=best;
    lbls+=(dy?`<line x1="${x}" y1="${y}" x2="${lx>x?lx-3:lx+w-3}" y2="${y+dy}" stroke="${RED}" stroke-width=".7"/>`:'')+`<rect x="${lx-3}" y="${y-8+dy}" width="${w}" height="15" fill="#fff"/>`+T(lx,y+4+dy,en,RED,10.5)});
  s+=lbls;pts.forEach((p,i)=>{const [x,y]=xy[i];s+=`<circle cx="${x}" cy="${y}" r="8" fill="${RED}" stroke="#fff" stroke-width="1.5"/>`+T(x,y+3.8,p.no,'#fff',10.5,'middle')});
  return `<svg viewBox="0 0 ${W} ${H}" style="margin:10px 0 4px">${s}</svg>`}
function render(plan){const c=S.city,stl=STYLES.find(x=>x[0]===S.style),dl=DAYS.find(x=>x[0]===S.days);let no=0;
  plan.days.forEach(d=>d.items.forEach(it=>{if(it.ll&&!it.hub)it.no=++no}));
  let h=`<h1>${esc(c.k)} ${esc(dl[2])} · ${esc(stl[2])}<span class="badge m">${plan.src==='AI'?'AI PLANNED':'PRESET'}</span></h1>
   <div class="m red" style="font-size:12px">${esc(c.id)} · ${S.ppl} TRAVELER${S.ppl>1?'S':''} · ${esc(stl[1])}</div>
   ${plan.summary?`<div class="sub" style="margin-top:6px">${esc(plan.summary)}</div>`:''}${localMap(plan)}`;
  plan.days.forEach((d,i)=>{h+=`<div class="day m">DAY ${i+1}</div>`;d.items.forEach(it=>{h+=`<div class="it"><span class="t m">${esc(it.t)}</span><span>${it.no?`<span class="n m">${it.no}</span>`:`<span class="n s m"></span>`}</span><span>${esc(it.k)}</span><span class="mv m">${esc(it.mv)}</span>${it.d?`<span></span><span></span><span class="d">${esc(it.d)}</span>`:''}</div>`})});
  const B=plan.budget,tot=Object.values(B).reduce((a,b)=>a+b,0),rows=[['TRANSPORT','교통','transport'],['STAY','숙박','stay'],['FOOD','식비','food'],['CAFE · SNACK','카페·간식','cafe'],['TICKETS','입장·체험','ticket']];
  const unit=tot>600000?10000:5000;
  h+=`<div class="bud"><div class="tot"><span class="m">BUDGET / PERSON</span><b class="m">≈ ${fmt(tot)} KRW</b></div>`;
  rows.forEach(([e,k,key])=>{const v=B[key],n=Math.round(v/unit);h+=`<div class="brow"><span><span class="m">${e}</span></span><span class="dots${key==='food'?' r':''}">${'<i></i>'.repeat(Math.min(n,60))}${v>0&&n===0?'<i style="opacity:.35"></i>':''}</span><span class="m" style="text-align:right">${fmt(v)}</span></div>`});
  h+=`<div class="note m">● = ${fmt(unit)} KRW · ${S.ppl}명 기준 1인 추정 금액이에요. 실제 요금·영업 정보는 떠나기 전에 꼭 확인하세요.</div></div>`;
  if(plan.tips&&plan.tips.length)h+=`<ul class="tips">${plan.tips.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`;
  if(plan.src!=='AI')h+=S.aiTried?`<div class="note">AI 응답을 받지 못해서 미리 준비한 코스로 짰어요. <a href="#" id="retry" style="color:${RED}">AI로 다시 짜기</a></div>`:`<div class="note">이 화면에서는 AI를 쓸 수 없어서 미리 준비한 코스로 짰어요. claude.ai 페이지에서 열면 AI가 직접 코스를 짜요.</div>`;
  h+=`<div class="bottom" style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button class="btn ghost m" id="again" style="margin:0">SPIN AGAIN</button><button class="btn m" id="other" style="margin:0">OTHER STYLE</button></div>`;
  $('out').innerHTML=h;if($('retry'))$('retry').onclick=e=>{e.preventDefault();makePlan()};$('again').onclick=()=>{show(1);drawWheel()};$('other').onclick=()=>{show(2);drawKorea()}}

drawWheel();
// test hooks: #city=ID&style=F&days=2&run
const H=new URLSearchParams(location.hash.slice(1));
if(H.get('city')){S.city=CITIES.find(c=>c.id===H.get('city'))||CITIES[0];openCity();if(H.get('style')){S.style=H.get('style');S.days=+H.get('days')||2;document.querySelector(`[data-s="${S.style}"]`).classList.add('on');[...$('days').children].forEach(x=>x.classList.toggle('on',+x.dataset.d===S.days));$('plan').disabled=false;if(H.has('run'))makePlan()}}
</script></body></html>
