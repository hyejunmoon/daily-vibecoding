    g.strokeStyle = `rgba(175,178,182,${(.6 * alpha).toFixed(3)})`;
    g.beginPath(); for (let i = -3; i <= 3; i++) { const b = a + i * .26; g.moveTo(ex, ey); g.lineTo(ex + Math.cos(b) * .17 * U, ey + Math.sin(b) * .17 * U); } g.stroke();
  }
  function drawFlyingSeeds(g, tt) {
    const hd = dandeHead(tt);
    SEEDS.forEach(s => { if (tt < s.tr) return; const f = (tt - s.tr) / (.22 * s.sp); if (f > 1.2) return;
      const ex = hd[0] + Math.cos(s.a) * s.l * U, ey = hd[1] + Math.sin(s.a) * s.l * U;
      const px = ex - f * 9 * U + Math.sin(f * 5 + s.ph) * .5 * U, py = ey - f * 3.2 * U - f * f * 1.5 * U + Math.cos(f * 4 + s.ph) * .3 * U;
      drawSeed(g, px - Math.cos(s.a - f * 2) * s.l * U * .35, py - Math.sin(s.a - f * 2) * s.l * U * .35, -Math.PI / 2 + Math.sin(f * 6 + s.ph) * .5, s.l * U * .35, 1 - sm(.8, 1.2, f)); });
  }

  // ---------- letter: it burns from a corner; rewound, the ash gathers into paper again ----------
  const LNX = 28, LNY = 18, T_BURN = .62, T_BURNT = .9;
  const LTH = (() => { seed = 99; const a = []; for (let j = 0; j < LNY; j++) for (let i = 0; i < LNX; i++) {
    const d = Math.hypot((LNX - 1 - i) / LNX, (j) / LNY * .7); a.push(clamp(d / 1.1 + (rnd() - .5) * .14 + Math.sin(i * .7) * .03, 0, 1)); } return a; })();
  function makeLetter() {
    const lw = 2.6 * U, lh = 1.8 * U, s = DPR; letC.width = Math.ceil(lw * s); letC.height = Math.ceil(lh * s);
    const g = letX; g.setTransform(s, 0, 0, s, 0, 0);
    g.fillStyle = '#f8f3e4'; g.fillRect(0, 0, lw, lh);
    g.strokeStyle = 'rgba(170,150,110,.5)'; g.lineWidth = 1; g.strokeRect(.5, .5, lw - 1, lh - 1);
    seed = 123; g.strokeStyle = 'rgba(40,45,80,.72)'; g.lineWidth = Math.max(1, U / 55); g.lineCap = 'round';
    for (let r = 0; r < 8; r++) { const y = .3 * U + r * .17 * U, x1 = .3 * U + (r === 0 ? 0 : .0), x2 = lw - .3 * U - rnd() * (r === 7 ? 1.2 : .5) * U;
      g.beginPath(); for (let x = x1; x <= x2; x += U / 40) { const yy = y + Math.sin(x * 1.7 / U * 6 + r) * .025 * U + Math.sin(x * 4.3 / U * 6) * .012 * U; x === x1 ? g.moveTo(x, yy) : g.lineTo(x, yy); } g.stroke(); }
    g.fillStyle = '#a3262f'; g.beginPath(); g.arc(lw - .45 * U, lh - .35 * U, .14 * U, 0, 7); g.fill();
    g.fillStyle = 'rgba(255,200,200,.35)'; g.beginPath(); g.arc(lw - .49 * U, lh - .39 * U, .05 * U, 0, 7); g.fill();
  }
  function drawLetter(g, tt) {
    const x = cx - .1 * U, y = Gy + .62 * U, lw = 2.6 * U, lh = 1.8 * U, bt = sm(T_BURN, T_BURNT, tt) * 1.06, cw = lw / LNX, ch = lh / LNY;
    const A = -.07, ca = Math.cos(A), sa = Math.sin(A), SQ = .42;
    const toScreen = (u, v) => { const px = u - lw / 2, py = (v - lh / 2) * SQ; return [x + px * ca - py * sa, y + px * sa + py * ca]; };
    g.save(); g.setTransform(DPR * ca, DPR * sa, -DPR * sa * SQ, DPR * ca * SQ, DPR * x, DPR * y); g.translate(-lw / 2, -lh / 2);
    // soft shadow under the sheet
    const flakes = [];
    for (let j = 0; j < LNY; j++) for (let i = 0; i < LNX; i++) {
      const th = LTH[j * LNX + i], z = bt - th;
      if (z > .05) { if ((i + j) % 3 === 0) flakes.push([i, j, z]); continue; }
      g.drawImage(letC, i * cw * DPR, j * ch * DPR, cw * DPR, ch * DPR, i * cw - .3, j * ch - .3, cw + .6, ch + .6);
      if (z > -.05) {
        const k = sm(-.05, .05, z);
        g.fillStyle = `rgba(${lerp(150, 30, k) | 0},${lerp(100, 20, k) | 0},${lerp(50, 12, k) | 0},${(k * .92 + .12).toFixed(3)})`; g.fillRect(i * cw - .3, j * ch - .3, cw + .6, ch + .6);
        if (z > .02 && tt < T_BURNT + .03) { g.fillStyle = `rgba(255,${(140 + 80 * Math.random()) | 0},60,.75)`; g.fillRect(i * cw, j * ch, cw, ch * .5); }
      }
    }
    g.restore();
    // ash lifts off the burnt edge
    g.fillStyle = 'rgba(70,65,60,.7)';
    flakes.forEach(([i, j, z]) => { const a = z - .05; if (a > .12) return; const p = toScreen((i + .5) * cw, (j + .5) * ch), k = a / .12;
      g.globalAlpha = 1 - k; g.save(); g.translate(p[0] + Math.sin(i * 3 + k * 6) * .3 * U * k, p[1] - k * 2.2 * U); g.rotate(k * 6 + i); g.fillRect(-.03 * U, -.02 * U, .06 * U, .04 * U); g.restore(); });
    g.globalAlpha = 1;
  }

  // ---------- the whole still life ----------
  function renderScene(tt, now) {
    const g = fx; g.setTransform(DPR, 0, 0, DPR, 0, 0); g.clearRect(0, 0, W, H);
    const L = { head: [], back: [], front: [], falling: [] }, heads = [];
    const st = PLANTS.map(pl => { const Lp = { head: [], back: L.back, front: L.front, falling: L.falling }; const r = plantLists(pl, tt, Lp); heads.push(Lp.head); return r; });
    const paint = list => list.sort((a, b) => a.z - b.z).forEach(it => drawItem(g, it));
    paint(L.back);
    PLANTS.forEach((pl, i) => drawStem(g, st[i].P, sm(.35, 1, Math.max(0, st[i].tau))));
    PLANTS.forEach((pl, i) => drawVase(g, cx + pl.off * U, st[i].tau));
    PLANTS.forEach((pl, i) => LEAF.forEach(lf => drawLeaf(g, pl, lf, st[i].P, st[i].tau)));
    heads.forEach(paint);
    paint(L.front);
    paint(L.falling);
  }

  function render(now) {
    renderScene(t, now);
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    // cast shadow: short to the right in the morning, long to the left at dusk
    sx.globalCompositeOperation = 'source-over'; sx.clearRect(0, 0, sh.width, sh.height); sx.drawImage(fl, 0, 0, sh.width, sh.height);
    sx.globalCompositeOperation = 'source-in'; sx.fillStyle = 'rgb(70,50,34)'; sx.fillRect(0, 0, sh.width, sh.height);
    const k = lerp(.32, -.95, t), oxf = lerp(.25, -.2, t) * U;
    ctx.save(); ctx.setTransform(DPR, 0, -k * DPR, DPR, (k * Gy + oxf) * DPR, .05 * U * DPR); ctx.globalAlpha = lerp(.07, .16, t); ctx.drawImage(sh, 0, 0, W, H); ctx.restore();
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(fl, 0, 0);
  }

  function resize() {
    W = innerWidth; H = innerHeight; DPR = Math.min(2, devicePixelRatio || 1);
    for (const c of [cv, fl]) { c.width = Math.round(W * DPR); c.height = Math.round(H * DPR); }
    sh.width = Math.ceil(W / 5); sh.height = Math.ceil(H / 5);
    U = Math.min(H / 11.2, W / 9.8); cx = W / 2; Gy = Math.min(H - 1.7 * U, H / 2 + 4.6 * U);
    Rw = .95 * U; wxc = cx - 4.3 * U; wyc = Gy - Rw - .02 * U;
    makeCup(); makeLetter();
  }

  // ---------- sound: everything has a forward voice and a reversed one ----------
  let AC, BUF = {};
  function mkBuf(len, fn) { const b = AC.createBuffer(1, Math.round(AC.sampleRate * len), AC.sampleRate), d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = fn(i / AC.sampleRate, i / d.length); return b; }
  function reversed(b) { const r = AC.createBuffer(1, b.length, b.sampleRate), s = b.getChannelData(0), d = r.getChannelData(0); for (let i = 0; i < s.length; i++) d[i] = s[s.length - 1 - i]; return r; }
  function ensureAudio() {
    try {
      if (!AC) {
        AC = new (window.AudioContext || window.webkitAudioContext)();
        const N = () => Math.random() * 2 - 1;
        BUF.tick = mkBuf(.05, (s, p) => N() * Math.pow(1 - p, 6));
        // porcelain: a bright crack and ringing pieces
        BUF.crash = mkBuf(.9, (s, p) => { let v = N() * Math.exp(-s * 18) * .9; [2400, 3700, 5100, 6600].forEach((f, i) => { v += Math.sin(2 * Math.PI * f * s * (1 + i * .01)) * Math.exp(-s * (5 + i * 3)) * .22 * (s > i * .05 ? 1 : 0); }); return v * .8; });
        BUF.strike = mkBuf(.45, (s, p) => N() * sm(0, .04, s) * Math.exp(-s * 6) * .6 + Math.sin(2 * Math.PI * 120 * s) * Math.exp(-s * 8) * .2);
        BUF.puff = mkBuf(.35, (s, p) => N() * Math.sin(Math.PI * p) * .35);
        BUF.crackle = mkBuf(1.6, (s, p) => (Math.random() < .004 ? N() * 3 : N() * .05) * Math.sin(Math.PI * p));
        BUF.tok = mkBuf(.14, (s, p) => Math.sin(2 * Math.PI * (300 + 700 * Math.exp(-s * 40)) * s) * Math.exp(-s * 30) * .6);
        Object.keys(BUF).forEach(k => { BUF[k + 'R'] = reversed(BUF[k]); });
      }
      if (AC.state === 'suspended') AC.resume();
    } catch (e) { AC = null; }
  }
  function play(name, vol, freq) {
    if (!AC || AC.state !== 'running' || !BUF[name]) return;
    const s = AC.createBufferSource(), g = AC.createGain(); s.buffer = BUF[name]; g.gain.value = vol;
    if (freq) { const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 4; s.connect(f).connect(g); } else s.connect(g);
    g.connect(AC.destination); s.start();
  }
  // events on the timeline: forward plays the sound, rewinding plays it backwards
  const EVENTS = [
  ];
  PLANTS[0].pet.forEach(p => EVENTS.push({ at: p.td + FD, snd: 'tok', vol: .35 }));
  // Benjamin's petals leave the table as time runs forward, so his landings sound backwards
  PLANTS[1].pet.forEach(p => EVENTS.push({ at: (1 - (p.td + FD)) * MEET / (1 - MEET), snd: 'tok', vol: .35, flip: true }));
  function events(a, b) {
    if (a === b) return;
    EVENTS.forEach(e => {
      if (a < e.at && b >= e.at) play(e.snd + (e.flip ? 'R' : ''), e.vol);
      else if (b < e.at && a >= e.at) play(e.snd + (e.flip ? '' : 'R'), e.vol);
    });
  }

  // ---------- winding the crown ----------
  let dragging = false, lastX = 0, lastY = 0, clickAcc = 0, wound = 0, tickAcc = 0;
  const onCrown = () => true; // the whole page is the crown now
  function setT(v) { const a = t; t = clamp(v, 0, 1); events(a, t); if (t >= 1 && a < 1 && !rang) { rang = true; chime(); } if (t < .999) rang = false; }
  function wind(amt, dir) {
    if (amt <= 0) return;
    crownPh += dir * amt * .06; clickAcc += amt; wound += amt;
    while (clickAcc > 9) { clickAcc -= 9; play('tick', .05, t > 0 ? 3000 : 1600); }
    if (t <= 0) return;
    const dt = amt / (U * 15); setT(t - dt); secA -= amt * .05;
    // the watch's own tick, played backwards, once per rewound second
    tickAcc += dt; while (tickAcc > TICK) { tickAcc -= TICK; play('tickR', .09, 5200); }
  }
  cv.addEventListener('pointerdown', e => {
    ensureAudio();
    if (!onCrown(e.clientX, e.clientY)) return;
    dragging = true; lastX = e.clientX; lastY = e.clientY; cv.setPointerCapture(e.pointerId); document.body.className = 'grabbing';
  });
  cv.addEventListener('pointermove', e => {
    if (!dragging) { document.body.className = onCrown(e.clientX, e.clientY) ? 'grab' : ''; return; }
    const dx = e.clientX - lastX, dy = e.clientY - lastY; lastX = e.clientX; lastY = e.clientY;
    wind(Math.hypot(dx, dy), Math.abs(dx) >= Math.abs(dy) ? Math.sign(dx) || 1 : Math.sign(dy));
  });
  const end = () => { dragging = false; document.body.className = ''; };
  cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
  cv.addEventListener('wheel', e => { e.preventDefault(); const d = e.deltaY + e.deltaX; wind(Math.min(60, Math.abs(d) * .5), Math.sign(d) || 1); }, { passive: false });

  // ---------- timer: pick how long the flower takes to fall; a small bell when it has ----------
  function chime() {
    if (!AC || AC.state !== 'running') return;
    [[1568, 0], [1976, .22], [2349, .44], [1568, 1.1], [1976, 1.32], [2349, 1.54]].forEach(([f, d]) => {
      const now = AC.currentTime + d, g = AC.createGain(); g.gain.setValueAtTime(0, now); g.gain.linearRampToValueAtTime(.16, now + .01); g.gain.exponentialRampToValueAtTime(.0001, now + 1.6); g.connect(AC.destination);
      [1, 2.76, 5.4].forEach((h, i) => { const o = AC.createOscillator(), og = AC.createGain(); o.type = 'sine'; o.frequency.value = f * h; og.gain.value = [1, .35, .12][i]; o.connect(og).connect(g); o.start(now); o.stop(now + 1.7); });
    });
  }
  const timerEl = document.getElementById('timer');
  function drawTimer() { timerEl.innerHTML = TIMERS.map(m => `<button type="button" data-m="${m}" aria-label="${m}분" aria-pressed="${m === minutes}">${m}</button>`).join(''); }
  timerEl.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    ensureAudio(); minutes = +b.dataset.m; rate = 1 / (minutes * 60); try { localStorage.setItem('cc-minutes', String(minutes)); } catch (er) {}
    t = 0; rang = false; drawTimer();
  });
  drawTimer();

  // ---------- run ----------
  resize(); addEventListener('resize', resize);
  let last = performance.now(), secAcc = 0;
  (function loop(now) {
    const dt = Math.min(.1, (now - last) / 1000); last = now;
    if (!dragging && !hold && t < 1) {
      setT(t + dt * rate); secAcc += dt;
      if (secAcc >= 1) { secAcc -= 1; secA += 6 * RAD; play('tick', .03, 5200); }
    }
    render(now); requestAnimationFrame(loop);
  })(last);

  // for checking by hand: __bb.set(.7), __bb.hold = true, or open with #t=0.5
  window.__bb = { set: v => { t = clamp(v, 0, 1); }, get: () => t, set hold(v) { hold = v; } };
  const ht = /[#&]t=([\d.]+)/.exec(location.hash); if (ht) { t = clamp(+ht[1], 0, 1); hold = true; }
})();
</script>
