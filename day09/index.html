<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Curious Case</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Gowun+Batang&display=swap" rel="stylesheet">
<style>
  :root { --paper: #efe6d2; }
  html, body { margin: 0; height: 100%; background: var(--paper); overflow: hidden; }
  canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; }
  body.grab canvas { cursor: grab; }
  body.grabbing canvas { cursor: grabbing; }
</style>


<canvas id="c" aria-label="시들어가는 튤립과 회중시계. 용두를 돌리면 시간이 거꾸로 흐릅니다."></canvas>
<script>
(() => {
  // ---------- helpers ----------
  const RAD = Math.PI / 180;
  const sm = (a, b, x) => { x = Math.min(1, Math.max(0, (x - a) / (b - a))); return x * x * (3 - 2 * x); };
  const lerp = (a, b, k) => a + (b - a) * k, clamp = (x, a, b) => Math.min(b, Math.max(a, x));
  const mix = (p, q, k) => [lerp(p[0], q[0], k), lerp(p[1], q[1], k), lerp(p[2], q[2], k)];
  const mul = (c, s) => [c[0] * s, c[1] * s, c[2] * s];
  const rgb = (c, a) => a == null ? `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})` : `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
  const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
  const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const norm = a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
  let seed = 1918;
  const rnd = () => { seed = seed + 0x6D2B79F5 | 0; let q = Math.imul(seed ^ seed >>> 15, 1 | seed); q = q + Math.imul(q ^ q >>> 7, 61 | q) ^ q; return ((q ^ q >>> 14) >>> 0) / 4294967296; };

  // ---------- canvases ----------
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const fl = document.createElement('canvas'), fx = fl.getContext('2d');   // flower, vase, watch
  const sh = document.createElement('canvas'), sx = sh.getContext('2d');   // its soft shadow
  const lp = document.createElement('canvas'), lx = lp.getContext('2d');   // window light
  const bg = document.createElement('canvas'), bx = bg.getContext('2d');   // paper
  const fox = document.createElement('canvas'), ox = fox.getContext('2d'); // age spots
  let W, H, DPR, U, cx, Gy, wxc, wyc, Rw, frame, grainPat;

  // ---------- the story clock: t = 0 fresh spring morning, t = 1 withered autumn dusk ----------
  let t = 0, hold = false;
  const RATE = 1 / 85;                       // seconds to wilt fully: 85
  const START = Date.UTC(1918, 2, 21), SPAN = 245; // 21 March → 21 November 1918

  // ---------- flower model ----------
  const PET = [0, 1, 2, 3, 4, 5].map(i => ({
    outer: i % 2 === 0, phi: (i * 60 + 18) * RAD, j: (rnd() - .5) * .06, tw: (rnd() - .5) * .7, rf: rnd() * 6,
    td: [.60, .81, .68, .87, .75, .92][i],
    land: [[2.5, .22], [-1.45, .3], [1.55, -.14], [2.05, .4], [3.2, .06], [.95, .34]][i],
    spin: [1.7, -2.2, 2.4, -1.4, 1.9, -2.6][i],
  }));
  const FD = .045, NU = 12, NV = 6;
  const E = .32, cE = Math.cos(E), sE = Math.sin(E), VIEW = [0, sE, cE], LIGHT = norm([-.45, .75, .5]);
  const COL = {
    inB: hex('#f3dc8e'), inBody: hex('#e5596c'), outB: hex('#c8cf84'), outBody: hex('#c22f49'),
    edge: hex('#f09aa2'), aged: hex('#9f625a'), dry: hex('#6d4a3b'),
  };

  function stemCtl(tt) {
    const d = sm(.36, .95, tt) * .85;
    return [[cx, Gy - .45 * U], [cx - .02 * U, Gy - 4.3 * U],
      [cx + lerp(.12, 1.25, d) * U, Gy - lerp(6.5, 7.55, d) * U],
      [cx + lerp(.05, 2.15, d) * U, Gy - lerp(7.65, 7.0, d) * U]];
  }
  const bz = (P, s) => { const a = (1 - s) ** 3, b = 3 * (1 - s) ** 2 * s, c = 3 * (1 - s) * s * s, d = s ** 3;
    return [a * P[0][0] + b * P[1][0] + c * P[2][0] + d * P[3][0], a * P[0][1] + b * P[1][1] + c * P[2][1] + d * P[3][1]]; };
  function headT(tt) {
    const P = stemCtl(tt), dx = P[3][0] - P[2][0], dy = P[3][1] - P[2][1];
    return { x: P[3][0], y: P[3][1], rho: Math.atan2(dx, -dy), L: 1.85 * U };
  }
  function proj(p, Hd) {
    const su = p[1] * cE - p[2] * sE, dp = p[2] * cE + p[1] * sE, c = Math.cos(Hd.rho), s = Math.sin(Hd.rho);
    return [Hd.x + (p[0] * c + su * s) * Hd.L, Hd.y - (su * c - p[0] * s) * Hd.L, dp];
  }

  // one petal as a 3D grid; it opens, droops, curls back and shrivels as tau grows
  function petalGrid(p, tau) {
    const lag = p.outer ? 0 : .06, x = tau + p.j;
    const o = sm(lag, .62 + lag, x), w = sm(.3 + lag, .96, x);
    const th = ((p.outer ? 16 : 9) + o * (p.outer ? 60 : 50) + w * 22) * RAD;
    const bend = ((p.outer ? -14 : -22) + o * 18 + w * (p.outer ? 78 : 62)) * RAD;
    const cup = .62 - o * .45 - w * .5, ws = 1 - w * .32, ls = 1 - w * .1, phi = p.phi + w * p.tw;
    const R = [Math.sin(phi), 0, Math.cos(phi)], T = [Math.cos(phi), 0, -Math.sin(phi)];
    const Wd = p.outer ? .44 : .4, G = [];
    let r = p.outer ? .08 : .05, h = 0;
    for (let k = 0; k <= NU; k++) {
      const u = k / NU;
      if (k > 0) { const a = th + bend * Math.pow((k - .5) / NU, 1.5); r += Math.sin(a) / NU * ls; h += Math.cos(a) / NU * ls; }
      const a = th + bend * Math.pow(u, 1.5), Nr = -Math.cos(a), Ny = Math.sin(a);
      const wu = Wd * ws * Math.pow(Math.sin(Math.PI * Math.pow(u, .72)), .75), row = [];
      for (let jv = 0; jv <= NV; jv++) {
        const v = jv / NV * 2 - 1, c = cup * v * v * wu + wu * .12 * w * Math.sin(v * 5 + u * 7 + p.rf);
        const rr = r + Nr * c;
        row.push([R[0] * rr + T[0] * v * wu, h + Ny * c, R[2] * rr + T[2] * v * wu]);
      }
      G.push(row);
    }
    return { G, age: sm(.22, .95, x) };
  }
  function petalColor(u, v, inner, age) {
    let c = inner ? mix(COL.inB, COL.inBody, sm(.05, .32, u)) : mix(COL.outB, COL.outBody, sm(.04, .36, u));
    c = mix(c, COL.edge, sm(.7, 1, Math.abs(v)) * .35 * (1 - age));
    const a = clamp(age * 1.35 + (u - .65) * .5 + (Math.abs(v) - .6) * .45 - .15, 0, 1);
    return a < .6 ? mix(c, COL.aged, a / .6) : mix(COL.aged, COL.dry, (a - .6) / .4);
  }
  // turn a projected petal into depth-sortable quads (fill + ink edge + veins)
  function petalQuads(G, S, age, out, xf) {
    const ink = rgb(mix([112, 28, 46], [74, 50, 36], age), .55);
    for (let k = 0; k < NU; k++) for (let j = 0; j < NV; j++) {
      const a = G[k][j], b = G[k + 1][j], c = G[k + 1][j + 1], d = G[k][j + 1];
      let n = norm(cross(add(sub(b, a), sub(c, d)), add(sub(d, a), sub(c, b))));
      const inner = dot(n, VIEW) > 0; if (!inner) n = [-n[0], -n[1], -n[2]];
      const shade = .66 + .42 * Math.max(0, dot(n, LIGHT)) - (inner ? 0 : .05);
      const col = mul(petalColor((k + .5) / NU, (j + .5) / NV * 2 - 1, inner, age), Math.min(1.08, shade));
      let q = [S[k][j], S[k + 1][j], S[k + 1][j + 1], S[k][j + 1]];
      if (xf) q = q.map(xf);
      out.push({ z: (q[0][2] + q[1][2] + q[2][2] + q[3][2]) / 4, q, col: rgb(col), ink, eL: j === 0, eR: j === NV - 1, vein: j >= 2 && j <= 4 });
    }
  }
  function drawItem(g, it) {
    if (it.f) return it.f(g);
    const q = it.q;
    g.beginPath(); g.moveTo(q[0][0], q[0][1]); g.lineTo(q[1][0], q[1][1]); g.lineTo(q[2][0], q[2][1]); g.lineTo(q[3][0], q[3][1]); g.closePath();
    g.fillStyle = it.col; g.fill(); g.strokeStyle = it.col; g.lineWidth = .9; g.stroke();
    if (it.vein) { g.strokeStyle = 'rgba(120,40,55,.16)'; g.lineWidth = U / 110; g.beginPath(); g.moveTo(q[0][0], q[0][1]); g.lineTo(q[1][0], q[1][1]); g.stroke(); }
    if (it.eL || it.eR) {
      g.strokeStyle = it.ink; g.lineWidth = U / 75; g.beginPath();
      if (it.eL) { g.moveTo(q[0][0], q[0][1]); g.lineTo(q[1][0], q[1][1]); }
      if (it.eR) { g.moveTo(q[3][0], q[3][1]); g.lineTo(q[2][0], q[2][1]); }
      g.stroke();
    }
  }
  function stamenItems(tt, Hd, out) {
    const age = sm(.45, 1, tt);
    const pist = rgb(mix(hex('#c9c66c'), hex('#7d6a3c'), age)), anth = rgb(mix(hex('#3a2233'), hex('#4a3426'), age));
    const recep = proj([0, -.02, 0], Hd);
    out.push({ z: recep[2] - .06, f: g => { g.fillStyle = rgb(mix(hex('#6d9a50'), hex('#8a7e45'), age)); g.beginPath(); g.ellipse(recep[0], recep[1], .09 * U, .07 * U, Hd.rho, 0, 7); g.fill(); } });
    const b0 = proj([0, .02, 0], Hd), b1 = proj([0, .4, 0], Hd);
    out.push({ z: proj([0, .2, 0], Hd)[2], f: g => {
      g.lineCap = 'round'; g.strokeStyle = pist; g.lineWidth = .085 * Hd.L; g.beginPath(); g.moveTo(b0[0], b0[1]); g.lineTo(b1[0], b1[1]); g.stroke();
      g.fillStyle = pist; for (let i = 0; i < 3; i++) { const a = i * 120 * RAD, s = proj([Math.sin(a) * .04, .43, Math.cos(a) * .04], Hd); g.beginPath(); g.arc(s[0], s[1], .03 * Hd.L, 0, 7); g.fill(); }
    } });
    for (let i = 0; i < 6; i++) {
      const a = (i * 60 + 48) * RAD, sa = Math.sin(a), ca = Math.cos(a);
      const p0 = proj([sa * .07, .04, ca * .07], Hd), p1 = proj([sa * .15, .27, ca * .15], Hd), p2 = proj([sa * .17, .37, ca * .17], Hd);
      out.push({ z: p1[2], f: g => {
        g.lineCap = 'round'; g.strokeStyle = 'rgba(210,205,170,.9)'; g.lineWidth = .022 * Hd.L; g.beginPath(); g.moveTo(p0[0], p0[1]); g.lineTo(p1[0], p1[1]); g.stroke();
        g.strokeStyle = anth; g.lineWidth = .05 * Hd.L; g.beginPath(); g.moveTo(p1[0], p1[1]); g.lineTo(p2[0], p2[1]); g.stroke();
      } });
    }
  }

  // ---------- stem, leaves, vase ----------
  function strokeBz(g, P) { g.beginPath(); g.moveTo(P[0][0], P[0][1]); g.bezierCurveTo(P[1][0], P[1][1], P[2][0], P[2][1], P[3][0], P[3][1]); g.stroke(); }
  function drawStem(g, tt) {
    const P = stemCtl(tt), age = sm(.35, 1, tt);
    g.lineCap = 'round';
    g.strokeStyle = rgb(mix(hex('#2f4d2a'), hex('#4d4126'), age)); g.lineWidth = .15 * U; strokeBz(g, P);
    g.strokeStyle = rgb(mix(hex('#68964f'), hex('#8f8746'), age)); g.lineWidth = .11 * U; strokeBz(g, P);
    g.strokeStyle = 'rgba(255,255,225,.28)'; g.lineWidth = .025 * U;
    strokeBz(g, P.map(p => [p[0] - .025 * U, p[1]]));
  }
  const LEAF = [
    { s: .30, b0: -26, b1: -74, k0: -16, k1: -102, len: 2.7, w: .6, lag: 0, spots: [[.45, .3], [.62, -.4], [.78, .2]] },
    { s: .47, b0: 24, b1: 68, k0: 14, k1: 114, len: 2.3, w: .52, lag: .05, spots: [[.5, -.3], [.7, .35]] },
  ];
  function drawLeaf(g, lf, tt) {
    const A = bz(stemCtl(tt), lf.s), wv = sm(.3 + lf.lag, .98, tt), age = sm(.28 + lf.lag, 1, tt);
    const b0 = lerp(lf.b0, lf.b1, wv) * RAD, k = lerp(lf.k0, lf.k1, wv) * RAD, n = 18, len = lf.len * U * (1 - wv * .06);
    const C = [], Lf = [], Rt = [];
    let x = A[0], y = A[1];
    for (let i = 0; i <= n; i++) {
      const u = i / n;
      if (i > 0) { const am = b0 + k * Math.pow((i - .5) / n, 1.3); x += Math.sin(am) * len / n; y -= Math.cos(am) * len / n; }
      const a = b0 + k * Math.pow(u, 1.3), nx = Math.cos(a), ny = Math.sin(a);
      const wu = lf.w * U * Math.pow(Math.sin(Math.PI * Math.pow(u, .55)), .9) * (1 - wv * .25);
      C.push([x, y]); Lf.push([x - nx * wu * (1 - wv * .55), y - ny * wu * (1 - wv * .55)]); Rt.push([x + nx * wu * (1 - wv * .12), y + ny * wu * (1 - wv * .12)]);
    }
    const up = mix(mix(hex('#76a25b'), hex('#b8a656'), sm(0, .55, age)), hex('#8a6a3f'), sm(.5, 1, age));
    const un = mix(mix(hex('#527c43'), hex('#8f8440'), sm(0, .55, age)), hex('#6e5233'), sm(.5, 1, age));
    const half = (edge, col) => { g.beginPath(); g.moveTo(C[0][0], C[0][1]); edge.forEach(p => g.lineTo(p[0], p[1])); for (let i = n; i >= 0; i--) g.lineTo(C[i][0], C[i][1]); g.closePath(); g.fillStyle = rgb(col); g.fill(); };
    half(Lf, mul(un, .95)); half(Rt, up);
    // browning edges, parallel veins, midrib, ink
    g.lineJoin = 'round';
    if (age > .05) { g.strokeStyle = rgb(hex('#7a5530'), sm(.05, .8, age) * .55); g.lineWidth = U * .05; [Lf, Rt].forEach(E2 => { g.beginPath(); E2.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.stroke(); }); }
    g.strokeStyle = 'rgba(240,250,215,.22)'; g.lineWidth = U / 120;
    [.35, .7].forEach(f => [Lf, Rt].forEach(E2 => { g.beginPath(); C.forEach((c, i) => { const px = lerp(c[0], E2[i][0], f), py = lerp(c[1], E2[i][1], f); i ? g.lineTo(px, py) : g.moveTo(px, py); }); g.stroke(); }));
    g.strokeStyle = 'rgba(235,245,205,.5)'; g.lineWidth = U / 55; g.beginPath(); C.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.stroke();
    g.strokeStyle = rgb(mix(hex('#2c4626'), hex('#4b3a22'), age), .7); g.lineWidth = U / 70;
    g.beginPath(); Lf.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); for (let i = n; i >= 0; i--) g.lineTo(Rt[i][0], Rt[i][1]); g.stroke();
    if (age > .45) lf.spots.forEach(([u, sd]) => { const i = Math.round(u * n), c = C[i], e2 = sd < 0 ? Lf[i] : Rt[i];
      const px = lerp(c[0], e2[0], Math.abs(sd)), py = lerp(c[1], e2[1], Math.abs(sd));
      g.fillStyle = rgb(hex('#5e3f24'), sm(.45, 1, age) * .45); g.beginPath(); g.ellipse(px, py, U * .07, U * .045, 0, 0, 7); g.fill(); });
  }
  const VPROF = [[0, .52], [.06, .7], [.3, .8], [.52, .66], [.72, .3], [.86, .22], [.96, .27], [1, .33]];
  function vr(f) {
    for (let i = 1; i < VPROF.length; i++) if (f <= VPROF[i][0]) { const a = VPROF[i - 1], b = VPROF[i], k = (f - a[0]) / (b[0] - a[0]); return lerp(a[1], b[1], (1 - Math.cos(k * Math.PI)) / 2); }
    return VPROF[VPROF.length - 1][1];
  }
  function vasePath(g, f0, f1) {
    const Hv = 3.1 * U; g.beginPath();
    for (let f = f0; f <= f1 + 1e-6; f += .02) g.lineTo(cx - vr(f) * U, Gy - f * Hv);
    for (let f = f1; f >= f0 - 1e-6; f -= .02) g.lineTo(cx + vr(f) * U, Gy - f * Hv);
    g.closePath();
  }
  function drawVase(g, tt) {
    const Hv = 3.1 * U, fw = lerp(.62, .22, tt), lw = Math.max(1, U / 55);
    // table shadow
    const gr = g.createRadialGradient(cx, Gy, 0, cx, Gy, U * 1.2); gr.addColorStop(0, 'rgba(70,60,40,.25)'); gr.addColorStop(1, 'rgba(70,60,40,0)');
    g.save(); g.translate(cx, Gy); g.scale(1, .13); g.fillStyle = gr; g.beginPath(); g.arc(0, 0, U * 1.2, 0, 7); g.fill(); g.restore();
    vasePath(g, 0, 1); g.fillStyle = 'rgba(205,222,220,.2)'; g.fill();
    vasePath(g, .02, fw); g.fillStyle = 'rgba(150,190,178,.22)'; g.fill();
    const rx = vr(fw) * U; g.beginPath(); g.ellipse(cx, Gy - fw * Hv, rx, rx * .16, 0, 0, 7); g.fillStyle = 'rgba(225,240,232,.35)'; g.fill(); g.strokeStyle = 'rgba(90,120,115,.45)'; g.lineWidth = lw * .8; g.stroke();
    vasePath(g, 0, 1); g.strokeStyle = 'rgba(58,70,68,.6)'; g.lineWidth = lw; g.stroke();
    g.beginPath(); g.ellipse(cx, Gy - .04 * U, .5 * U, .09 * U, 0, 0, 7); g.strokeStyle = 'rgba(58,70,68,.35)'; g.stroke();
    g.beginPath(); g.ellipse(cx, Gy - Hv, .33 * U, .06 * U, 0, 0, 7); g.strokeStyle = 'rgba(58,70,68,.55)'; g.stroke();
    g.strokeStyle = 'rgba(255,255,255,.65)'; g.lineWidth = U / 26; g.lineCap = 'round';
    g.beginPath(); for (let f = .1; f <= .46; f += .02) g.lineTo(cx - vr(f) * U * .62, Gy - f * Hv); g.stroke();
    g.lineWidth = U / 45; g.beginPath(); for (let f = .76; f <= .93; f += .02) g.lineTo(cx - vr(f) * U * .5, Gy - f * Hv); g.stroke();
  }

  // ---------- pocket watch ----------
  let crownPh = 0, secA = 0;
  const crownY = () => wyc - Rw * 1.2;
  function drawWatch(g, tt) {
    const X = wxc, Y = wyc, R = Rw, cy = crownY(), lw = Math.max(1, U / 60), ink = 'rgba(72,48,20,.75)';
    const gr0 = g.createRadialGradient(X, Gy, 0, X, Gy, R * 1.15); gr0.addColorStop(0, 'rgba(60,40,20,.3)'); gr0.addColorStop(1, 'rgba(60,40,20,0)');
    g.save(); g.translate(X, Gy); g.scale(1, .14); g.fillStyle = gr0; g.beginPath(); g.arc(0, 0, R * 1.15, 0, 7); g.fill(); g.restore();
    const brass = (x0, y0, x1, y1) => { const q = g.createLinearGradient(x0, y0, x1, y1); q.addColorStop(0, '#f2dd9c'); q.addColorStop(.45, '#c99f50'); q.addColorStop(1, '#7c5b25'); return q; };
    // bow
    g.lineCap = 'round';
    g.strokeStyle = ink; g.lineWidth = R * .14; g.beginPath(); g.ellipse(X, cy - .34 * R, .3 * R, .27 * R, 0, Math.PI * .9, Math.PI * 2.1); g.stroke();
    g.strokeStyle = brass(X - .3 * R, cy - .6 * R, X + .3 * R, cy); g.lineWidth = R * .1; g.stroke();
    // pendant + crown (knurls roll as you wind)
    g.fillStyle = brass(X - .1 * R, 0, X + .1 * R, 0); g.fillRect(X - .1 * R, Y - R - .14 * R, .2 * R, .16 * R);
    g.strokeStyle = ink; g.lineWidth = lw * .8; g.strokeRect(X - .1 * R, Y - R - .14 * R, .2 * R, .16 * R);
    g.beginPath(); g.roundRect(X - .24 * R, cy - .13 * R, .48 * R, .26 * R, .07 * R); g.fillStyle = brass(X, cy - .13 * R, X, cy + .13 * R); g.fill(); g.lineWidth = lw; g.stroke();
    for (let k = 0; k < 18; k++) { const a = crownPh + k * Math.PI / 9, c = Math.cos(a); if (c <= 0) continue;
      const x = X + Math.sin(a) * .22 * R; g.strokeStyle = `rgba(85,58,22,${(.2 + .5 * c).toFixed(2)})`; g.lineWidth = lw * (.5 + .6 * c);
      g.beginPath(); g.moveTo(x, cy - .1 * R); g.lineTo(x, cy + .1 * R); g.stroke(); }
    // case
    const cg = g.createRadialGradient(X - .35 * R, Y - .4 * R, .1 * R, X, Y, R * 1.05);
    cg.addColorStop(0, '#f7e5ab'); cg.addColorStop(.45, '#d2aa58'); cg.addColorStop(.8, '#93702e'); cg.addColorStop(1, '#5f451a');
    g.beginPath(); g.arc(X, Y, R, 0, 7); g.fillStyle = cg; g.fill(); g.strokeStyle = ink; g.lineWidth = lw; g.stroke();
    g.beginPath(); g.arc(X, Y, R * .92, 0, 7); g.strokeStyle = 'rgba(90,60,20,.5)'; g.stroke();
    // dial
    const fg = g.createRadialGradient(X - .2 * R, Y - .25 * R, .05 * R, X, Y, .86 * R); fg.addColorStop(0, '#fcf8ec'); fg.addColorStop(1, '#e8dcc0');
    g.beginPath(); g.arc(X, Y, R * .85, 0, 7); g.fillStyle = fg; g.fill(); g.strokeStyle = 'rgba(90,70,40,.55)'; g.lineWidth = lw * .8; g.stroke();
    g.strokeStyle = '#2d2820';
    for (let i = 0; i < 60; i++) { const a = i / 60 * Math.PI * 2, r2 = i % 5 ? .76 : .72; g.lineWidth = i % 5 ? lw * .5 : lw * 1.1;
      g.beginPath(); g.moveTo(X + Math.sin(a) * .8 * R, Y - Math.cos(a) * .8 * R); g.lineTo(X + Math.sin(a) * r2 * R, Y - Math.cos(a) * r2 * R); g.stroke(); }
    g.fillStyle = '#2a241c'; g.font = `${(.15 * R).toFixed(1)}px "IM Fell English", serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
    ['XII', 'I', 'II', '', 'IIII', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI'].forEach((s, i) => { if (!s || i === 6) return; const a = i / 12 * Math.PI * 2; g.fillText(s, X + Math.sin(a) * .61 * R, Y - Math.cos(a) * .61 * R); });
    // date window at three o'clock
    const day = new Date(START + Math.round(tt * SPAN) * 864e5).getUTCDate();
    g.fillStyle = '#fffdf6'; g.fillRect(X + .47 * R, Y - .08 * R, .2 * R, .16 * R); g.strokeStyle = '#3a3226'; g.lineWidth = lw * .6; g.strokeRect(X + .47 * R, Y - .08 * R, .2 * R, .16 * R);
    g.fillStyle = '#2a241c'; g.font = `${(.12 * R).toFixed(1)}px "IM Fell English", serif`; g.fillText(String(day), X + .57 * R, Y + .005 * R);
    // small seconds at six
    const sy = Y + .42 * R; g.beginPath(); g.arc(X, sy, .17 * R, 0, 7); g.strokeStyle = 'rgba(45,40,32,.6)'; g.lineWidth = lw * .6; g.stroke();
    for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2; g.beginPath(); g.moveTo(X + Math.sin(a) * .17 * R, sy - Math.cos(a) * .17 * R); g.lineTo(X + Math.sin(a) * .14 * R, sy - Math.cos(a) * .14 * R); g.stroke(); }
    const hand = (cxh, cyh, a, len, w, tail, col) => { g.save(); g.translate(cxh, cyh); g.rotate(a); g.fillStyle = col; g.beginPath(); g.moveTo(-w / 2, tail); g.lineTo(-w * .3, -len); g.lineTo(0, -len - w * 1.2); g.lineTo(w * .3, -len); g.lineTo(w / 2, tail); g.closePath(); g.fill(); g.restore(); };
    hand(X, sy, secA, .15 * R, .018 * R, .04 * R, '#2b2a2a');
    const hrs = 6 + 13 * tt, hA = (hrs % 12) / 12 * Math.PI * 2, mA = (hrs % 1) * Math.PI * 2, blue = '#263150';
    hand(X, Y, hA, .42 * R, .05 * R, .1 * R, blue);
    g.save(); g.translate(X, Y); g.rotate(hA); g.beginPath(); g.arc(0, -.3 * R, .055 * R, 0, 7); g.strokeStyle = blue; g.lineWidth = .025 * R; g.stroke(); g.restore();
    hand(X, Y, mA, .7 * R, .032 * R, .12 * R, blue);
    g.beginPath(); g.arc(X, Y, .04 * R, 0, 7); g.fillStyle = blue; g.fill();
    // glass glint
    g.strokeStyle = 'rgba(255,255,255,.45)'; g.lineWidth = .05 * R; g.beginPath(); g.arc(X, Y, .74 * R, 200 * RAD, 255 * RAD); g.stroke();
  }

  // ---------- the whole still life, a pure function of t ----------
  function renderScene(tt) {
    const g = fx; g.setTransform(DPR, 0, 0, DPR, 0, 0); g.clearRect(0, 0, W, H);
    const head = [], back = [], front = [], falling = [];
    const Hd = headT(tt);
    PET.forEach(p => {
      if (tt < p.td) { const { G, age } = petalGrid(p, tt); petalQuads(G, G.map(r => r.map(q => proj(q, Hd))), age, head); return; }
      // detached: the petal keeps the shape it had at td and falls to the table (rewind flies it back)
      const f = clamp((tt - p.td) / FD, 0, 1), { G } = petalGrid(p, p.td), Ht = headT(p.td), S = G.map(r => r.map(q => proj(q, Ht)));
      let mx = 0, my = 0, n = 0; S.forEach(r => r.forEach(q => { mx += q[0]; my += q[1]; n++; })); mx /= n; my /= n;
      const Lx = cx + p.land[0] * U, Ly = Gy + p.land[1] * U, e = sm(0, 1, f), age = sm(.22, 1.05, tt);
      const px = lerp(mx, Lx, e) + Math.sin(f * Math.PI * 2.2 + p.rf) * .45 * U * Math.sin(Math.PI * f);
      const py = my + (Ly - my) * (f * f * .35 + f * .65);
      const rot = p.spin * e, cr = Math.cos(rot), sr = Math.sin(rot), sc = 1 - .12 * age * e;
      const syc = lerp(1, .62, e) * (1 - .4 * Math.sin(f * Math.PI * 3) ** 2);
      const xf = q => { const dx = (q[0] - mx) * sc, dy = (q[1] - my) * sc; return [px + dx * cr - dy * sr, py + (dx * sr + dy * cr) * syc, q[2]]; };
      petalQuads(G, S, age, f >= 1 ? (p.land[1] < 0 ? back : front) : falling, xf);
    });
    stamenItems(tt, Hd, head);
    const paint = list => list.sort((a, b) => a.z - b.z).forEach(it => drawItem(g, it));
    paint(back);
    drawStem(g, tt); drawVase(g, tt);
    LEAF.forEach(lf => drawLeaf(g, lf, tt));
    paint(head); paint(front); paint(falling);
    drawWatch(g, tt);
  }

  // ---------- paper, light and seasons ----------
  function makePaper() {
    bg.width = fl.width; bg.height = fl.height; bx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const pg = bx.createRadialGradient(W / 2, H * .45, 0, W / 2, H * .45, Math.hypot(W, H) * .6);
    pg.addColorStop(0, '#f5eedd'); pg.addColorStop(1, '#e3d4b4'); bx.fillStyle = pg; bx.fillRect(0, 0, W, H);
    seed = 77;
    for (let i = 0; i < 40; i++) { const x = rnd() * W, y = rnd() * H, r = 40 + rnd() * 220, q = bx.createRadialGradient(x, y, 0, x, y, r);
      const c = rnd() < .5 ? '170,140,95' : '255,252,240'; q.addColorStop(0, `rgba(${c},.05)`); q.addColorStop(1, `rgba(${c},0)`); bx.fillStyle = q; bx.fillRect(x - r, y - r, r * 2, r * 2); }
    bx.strokeStyle = 'rgba(120,95,60,.07)'; bx.lineWidth = .6;
    for (let i = 0; i < 160; i++) { const x = rnd() * W, y = rnd() * H, a = rnd() * 7, l = 6 + rnd() * 18; bx.beginPath(); bx.moveTo(x, y); bx.quadraticCurveTo(x + Math.cos(a) * l * .5 + 3, y + Math.sin(a) * l * .5, x + Math.cos(a) * l, y + Math.sin(a) * l); bx.stroke(); }
    // plate frame
    const fr = frame; bx.strokeStyle = 'rgba(92,66,40,.55)'; bx.lineWidth = 1.2; bx.strokeRect(fr.l, fr.t, fr.r - fr.l, fr.b - fr.t);
    bx.lineWidth = .6; bx.strokeRect(fr.l + 5, fr.t + 5, fr.r - fr.l - 10, fr.b - fr.t - 10);
    // foxing that creeps in with age
    fox.width = Math.ceil(W / 2); fox.height = Math.ceil(H / 2); ox.setTransform(.5, 0, 0, .5, 0, 0);
    const eg = ox.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .35, W / 2, H / 2, Math.hypot(W, H) * .62);
    eg.addColorStop(0, 'rgba(255,255,255,0)'); eg.addColorStop(1, 'rgba(176,122,62,.6)'); ox.fillStyle = eg; ox.fillRect(0, 0, W, H);
    for (let i = 0; i < 14; i++) { const ex = rnd() < .5, x = ex ? (rnd() < .5 ? rnd() * .18 : 1 - rnd() * .18) * W : rnd() * W, y = ex ? rnd() * H : (rnd() < .5 ? rnd() * .2 : 1 - rnd() * .2) * H;
      const r = 2 + rnd() * 6, q = ox.createRadialGradient(x, y, 0, x, y, r); q.addColorStop(0, 'rgba(150,95,45,.3)'); q.addColorStop(1, 'rgba(150,95,45,0)'); ox.fillStyle = q; ox.fillRect(x - r, y - r, r * 2, r * 2); }
    // grain tile
    const gt = document.createElement('canvas'); gt.width = gt.height = 256; const gx = gt.getContext('2d'), id = gx.createImageData(256, 256);
    for (let i = 0; i < 65536; i++) { const v = 243 + Math.random() * 12 - (Math.random() < .015 ? 26 : 0); id.data[i * 4] = v; id.data[i * 4 + 1] = v - 2; id.data[i * 4 + 2] = v - 7; id.data[i * 4 + 3] = 255; }
    gx.putImageData(id, 0, 0); grainPat = ctx.createPattern(gt, 'repeat');
  }
  const TINT = [[0, [248, 251, 242]], [.45, [255, 247, 228]], [.75, [243, 213, 168]], [1, [224, 176, 136]]];
  const tintAt = tt => { for (let i = 1; i < TINT.length; i++) if (tt <= TINT[i][0]) return mix(TINT[i - 1][1], TINT[i][1], (tt - TINT[i - 1][0]) / (TINT[i][0] - TINT[i - 1][0])); return TINT[3][1]; };

  const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  function labels(g, tt) {
    const fr = frame, fs = Math.max(11, .24 * U), d = new Date(START + Math.round(tt * SPAN) * 864e5);
    g.fillStyle = 'rgba(72,52,34,.82)'; g.textBaseline = 'alphabetic';
    g.font = `${fs.toFixed(1)}px "IM Fell English SC", serif`; g.textAlign = 'left'; g.fillText('Pl. IX.', fr.l + 16, fr.t + 16 + fs);
    g.textAlign = 'right'; g.fillText('The Curious Case', fr.r - 16, fr.t + 16 + fs);
    const by = fr.b - 18;
    g.font = `italic ${(fs * 1.15).toFixed(1)}px "IM Fell English", serif`; g.textAlign = 'left'; g.fillText('Tulipa gesneriana L.', fr.l + 16, by);
    g.font = `${fs.toFixed(1)}px "IM Fell English SC", serif`; g.textAlign = 'right'; g.fillText(`${MONTHS[d.getUTCMonth()]} ${d.getUTCDate()}, 1918`, fr.r - 16, by);
  }
  let hintA = 1, wound = 0;
  function hint(g) {
    const want = (wound < 2.5 * U && !dragging) || (t > .985 && !dragging) ? 1 : 0;
    hintA += (want - hintA) * .05; if (hintA < .01) return;
    const fs = Math.max(12, .2 * U), y = crownY() - Rw * .85;
    g.fillStyle = `rgba(72,52,34,${(.75 * hintA * (.75 + .25 * Math.sin(performance.now() / 500))).toFixed(3)})`;
    g.font = `${fs.toFixed(1)}px "Gowun Batang", serif`; g.textAlign = 'center'; g.textBaseline = 'alphabetic';
    g.fillText('용두를 돌려', wxc, y - fs * 1.35); g.fillText('시간을 되감아 보세요', wxc, y);
  }

  function render() {
    renderScene(t);
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
    ctx.drawImage(bg, 0, 0);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0); labels(ctx, t);
    // cast shadow: morning light from the upper left, a long low shadow at dusk
    sx.globalCompositeOperation = 'source-over'; sx.clearRect(0, 0, sh.width, sh.height); sx.drawImage(fl, 0, 0, sh.width, sh.height);
    sx.globalCompositeOperation = 'source-in'; sx.fillStyle = 'rgb(70,50,34)'; sx.fillRect(0, 0, sh.width, sh.height);
    const k = lerp(.32, -.95, sm(0, 1, t)), oxf = lerp(.25, -.2, t) * U;
    ctx.save(); ctx.setTransform(DPR, 0, -k * DPR, DPR, (k * Gy + oxf) * DPR, .05 * U * DPR); ctx.globalAlpha = lerp(.07, .16, t); ctx.drawImage(sh, 0, 0, W, H); ctx.restore();
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(fl, 0, 0);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    // season and hour: spring morning → summer noon → autumn dusk
    ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = rgb(tintAt(t)); ctx.fillRect(0, 0, W, H);
    const vg = ctx.createRadialGradient(W / 2, H * .45, Math.min(W, H) * .3, W / 2, H * .45, Math.hypot(W, H) * .6);
    vg.addColorStop(0, 'rgba(255,255,255,0)'); vg.addColorStop(1, `rgba(120,80,45,${(.12 + .38 * t).toFixed(3)})`); ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = sm(.15, 1, t) * .85; ctx.drawImage(fox, 0, 0, W, H); ctx.globalAlpha = 1;
    // window light wandering across the wall
    const s = lp.width / W; lx.setTransform(1, 0, 0, 1, 0, 0); lx.clearRect(0, 0, lp.width, lp.height);
    const lxp = lerp(cx - 3.3 * U, cx + 2.9 * U, t), lyp = lerp(Gy - 6.6 * U, Gy - 2.5 * U, t) - Math.sin(Math.PI * t) * .8 * U;
    const lw2 = lerp(3.2, 4.9, t) * U, lh = lerp(2.6, 1.8, t) * U, sk = lerp(.25, -.6, t);
    lx.filter = 'blur(2px)'; lx.setTransform(s, 0, sk * s, s, lxp * s, lyp * s);
    lx.fillStyle = rgb(mix([255, 251, 236], [255, 166, 88], sm(.45, 1, t)));
    const gp = .08 * U; [[0, 0], [1, 0], [0, 1], [1, 1]].forEach(([a, b]) => lx.fillRect(-lw2 / 2 + a * lw2 / 2 + gp / 2, -lh / 2 + b * lh / 2 + gp / 2, lw2 / 2 - gp, lh / 2 - gp));
    lx.filter = 'none';
    ctx.globalCompositeOperation = 'screen'; ctx.globalAlpha = lerp(.16, .4, t); ctx.drawImage(lp, 0, 0, W, H); ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over'; hint(ctx);
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = grainPat; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.globalCompositeOperation = 'source-over';
  }

  function resize() {
    W = innerWidth; H = innerHeight; DPR = Math.min(2, devicePixelRatio || 1);
    for (const c of [cv, fl]) { c.width = Math.round(W * DPR); c.height = Math.round(H * DPR); }
    sh.width = Math.ceil(W / 5); sh.height = Math.ceil(H / 5); lp.width = Math.ceil(W / 8); lp.height = Math.ceil(H / 8);
    U = Math.min(H / 11.2, W / 9.2); cx = W / 2 + .3 * U; Gy = Math.min(H - 1.5 * U, H / 2 + 4.6 * U);
    Rw = .95 * U; wxc = cx - 3.1 * U; wyc = Gy - Rw - .02 * U;
    const l = Math.max(14, W / 2 - 4.6 * U); frame = { l, r: W - l, t: Math.max(14, Gy - 9.4 * U), b: Math.min(H - 14, Gy + 1.15 * U) };
    makePaper();
  }

  // ---------- sound: a quiet tick, a ratchet while winding ----------
  let AC, noise;
  function ensureAudio() {
    try {
      if (!AC) { AC = new (window.AudioContext || window.webkitAudioContext)(); noise = AC.createBuffer(1, AC.sampleRate * .05, AC.sampleRate); const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 6); }
      if (AC.state === 'suspended') AC.resume();
    } catch (e) { AC = null; }
  }
  function click(freq, vol) {
    if (!AC || AC.state !== 'running') return;
    const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
    s.buffer = noise; f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 4; g.gain.value = vol;
    s.connect(f).connect(g).connect(AC.destination); s.start();
  }

  // ---------- winding the crown ----------
  let dragging = false, lastX = 0, lastY = 0, clickAcc = 0;
  const onCrown = (x, y) => Math.abs(x - wxc) < Math.max(.6 * Rw, 36) && Math.abs(y - crownY()) < Math.max(.45 * Rw, 30);
  function wind(amt, dir) {
    if (amt <= 0) return;
    crownPh += dir * amt * .06; clickAcc += amt; wound += amt;
    while (clickAcc > 7) { clickAcc -= 7; click(t > 0 ? 3400 : 1800, .12); }
    if (t <= 0) return;
    t = Math.max(0, t - amt / (U * 15)); secA -= amt * .05;
  }
  cv.addEventListener('pointerdown', e => {
    ensureAudio();
    if (!onCrown(e.clientX, e.clientY)) return;
    dragging = true; lastX = e.clientX; lastY = e.clientY; cv.setPointerCapture(e.pointerId); document.body.className = 'grabbing';
  });
  cv.addEventListener('pointermove', e => {
    if (!dragging) { document.body.className = onCrown(e.clientX, e.clientY) ? 'grab' : ''; return; }
    const dx = e.clientX - lastX, dy = e.clientY - lastY; lastX = e.clientX; lastY = e.clientY;
    wind(Math.hypot(dx, dy), Math.abs(dx) >= Math.abs(dy) ? Math.sign(dx) || 1 : Math.sign(dy));
  });
  const end = () => { dragging = false; document.body.className = ''; };
  cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
  cv.addEventListener('wheel', e => { e.preventDefault(); const d = e.deltaY + e.deltaX; wind(Math.min(60, Math.abs(d) * .5), Math.sign(d) || 1); }, { passive: false });

  // ---------- run ----------
  resize(); addEventListener('resize', resize);
  let last = performance.now(), secAcc = 0;
  (function loop(now) {
    const dt = Math.min(.1, (now - last) / 1000); last = now;
    if (!dragging && !hold && t < 1) {
      t = Math.min(1, t + dt * RATE); secAcc += dt;
      if (secAcc >= 1) { secAcc -= 1; secA += 6 * RAD; click(5200, .025); }
    }
    render(); requestAnimationFrame(loop);
  })(last);
  if (document.fonts) document.fonts.ready.then(() => render());

  // for checking by hand: __bb.set(.7), __bb.hold = true
  window.__bb = { set: v => { t = clamp(v, 0, 1); }, get: () => t, set hold(v) { hold = v; } };
  const ht = /[#&]t=([\d.]+)/.exec(location.hash); if (ht) { t = clamp(+ht[1], 0, 1); hold = true; }
})();
</script>
