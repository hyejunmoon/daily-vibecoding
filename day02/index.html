<style>

    color-scheme: dark;

  body {
    background: var(--backing);
    overflow: hidden;

    gain.gain.linearRampToValueAtTime(0.25 + strength * 0.45, t + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
    gain.connect(a.destination);
    voice(a, gain).stop(t + dur + 0.05);
  }

  /* ---------- the blade ---------- */
  let stroke = null;   // { id, pts: [[x,y,time]], line: ragged points, state }
  const trail = [];    // fading points of the live drag, for the glint at the tip
  let shake = 0;
  let speed = 0;

  function finishCut(s) {
    const pts = s.pts;
    if (pts.length < 2) return;
    let length = 0;
    for (let i = 1; i < pts.length; i++) length += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
    if (length < 14 || s.line.length < 2) return;
    const ms = Math.max(16, pts[pts.length - 1][2] - pts[0][2]);
    const v = length / ms; // px per ms
    const push = Math.min(10, 2 + v * 2.5); // each side moves this far, so the gap is twice it

    // Carry the tear straight on past both ends so every stroke goes clean through the sheet.
    const line = s.line;
    const far = 3 * Math.max(W, H);
    const dirFrom = (list) => {
      const a = list[0];
      for (let i = 1; i < list.length; i++) {
        const dx = list[i][0] - a[0], dy = list[i][1] - a[1], l = Math.hypot(dx, dy);
        if (l > 12 || i === list.length - 1) return [dx / (l || 1), dy / (l || 1)];
      }
      return [1, 0];
    };
    const d0 = dirFrom(line), d1 = dirFrom(line.slice().reverse());
    const onSheet = ([x, y]) => x > -20 && y > -20 && x < W + 20 && y < H + 20;
    // The extensions are ragged too, but only where they cross the paper.
    const head = [];
    tearTo(head, { at: line[0], drift: 0 }, [line[0][0] - d0[0] * far, line[0][1] - d0[1] * far]);
    const tail = [];
    tearTo(tail, { at: line[line.length - 1], drift: 0 }, [line[line.length - 1][0] - d1[0] * far, line[line.length - 1][1] - d1[1] * far]);
    const keep = (list, end) => [...list.filter(onSheet), end];
    const path = [
      ...keep(head, [line[0][0] - d0[0] * far, line[0][1] - d0[1] * far]).reverse(),
      ...line,
      ...keep(tail, [line[line.length - 1][0] - d1[0] * far, line[line.length - 1][1] - d1[1] * far]),
    ];

    const before = pieces.length;
    pieces = pieces.flatMap((p) => cutPiece(p, path, push));
    if (pieces.length > before) {
      if (!reduceMotion) shake = Math.min(8, push * 0.45);
      rip(Math.min(1, v / 3));
    }
    dirty = true;
  }

  cv.addEventListener('pointerdown', (e) => {
    if (mending) return;
    const p = [e.clientX, e.clientY];
    stroke = { id: e.pointerId, pts: [[p[0], p[1], performance.now()]], line: [p], state: { at: p, drift: 0 } };
    speed = 0;
    try { cv.setPointerCapture(e.pointerId); } catch (_) {}
    startTear();
  });
  cv.addEventListener('pointermove', (e) => {
    if (!stroke || e.pointerId !== stroke.id) return;
    const events = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    events.forEach((ev) => {
      const last = stroke.pts[stroke.pts.length - 1];
      const now = performance.now();
      const dist = Math.hypot(ev.clientX - last[0], ev.clientY - last[1]);
      if (dist < 2) return;
      speed = speed * 0.7 + (dist / Math.max(4, now - last[2])) * 0.3;
      const p = [ev.clientX, ev.clientY, now];
      stroke.pts.push(p);
      trail.push(p);
      tearTo(stroke.line, stroke.state, [p[0], p[1]]);
    });
    tearLevel(speed);
    dirty = true;
  });
  const end = (e) => {
    if (!stroke || e.pointerId !== stroke.id) return;
    const s = stroke;
    stroke = null;
    stopTear();
    finishCut(s);
  };
  cv.addEventListener('pointerup', end);
  cv.addEventListener('pointercancel', (e) => {
    if (stroke && e.pointerId === stroke.id) { stroke = null; stopTear(); dirty = true; }
  });
  // Silence the tear if the pointer stops moving mid-drag.
  setInterval(() => {
    if (!stroke) return;
    const last = stroke.pts[stroke.pts.length - 1];
    if (performance.now() - last[2] > 80) { speed *= 0.5; tearLevel(speed); }
  }, 60);

  // Mending slides every piece home; once they meet, they fuse back into one sheet.
  function mend() {
    if (pieces.length < 2) return;
    mending = true;
    pieces.forEach((p) => { p.tx = 0; p.ty = 0; });
  }
  cv.addEventListener('dblclick', mend);
  document.addEventListener('keydown', (e) => { if (e.key === 'r' || e.key === 'R') mend(); });

  /* ---------- size ---------- */
  function resize() {
    const oldW = W, oldH = H;
    dpr = Math.min(2, window.devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    buildTexture();
    if (!oldW || !oldH || pieces.length < 2) { pieces = [newPiece(sheetPoly())]; return; }
    const sx = W / oldW, sy = H / oldH;
    const scale = (list) => list.map(([x, y]) => [x * sx, y * sy]);
    const done = new Map();
    pieces.forEach((p) => {
      p.poly = scale(p.poly);
      // pieces share tears, so rebuild each tear once
      p.seams = p.seams.map((s) => { if (!done.has(s)) done.set(s, makeSeam(scale(s.pts))); return done.get(s); });
      p.x *= sx; p.y *= sy; p.tx *= sx; p.ty *= sy;
    });
  }
  addEventListener('resize', resize);
  resize();

  /* ---------- draw ---------- */
  const tracePoly = (c, poly, ox, oy) => {
    c.beginPath();
    poly.forEach(([x, y], i) => (i ? c.lineTo(x + ox, y + oy) : c.moveTo(x + ox, y + oy)));
    c.closePath();
  };
  const traceLine = (c, line, ox = 0, oy = 0) => {
    c.beginPath();
    line.forEach(([x, y], i) => (i ? c.lineTo(x + ox, y + oy) : c.moveTo(x + ox, y + oy)));
  };

  let prev = performance.now();
  function frame(now) {
    const dt = Math.min(0.04, (now - prev) / 1000);
    prev = now;

    // Pieces ride a slightly bouncy spring toward where the tear sent them.
    let moving = false;
    pieces.forEach((p) => {
      const k = mending ? 70 : 140, c = mending ? 15 : 13;
      p.vx += (k * (p.tx - p.x) - c * p.vx) * dt;
      p.vy += (k * (p.ty - p.y) - c * p.vy) * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (Math.abs(p.tx - p.x) + Math.abs(p.ty - p.y) + Math.abs(p.vx) + Math.abs(p.vy) > 0.2) moving = true;
    });
    if (mending && !moving) {
      pieces = [newPiece(sheetPoly())];
      mending = false;
      dirty = true;
    }
    while (trail.length && now - trail[0][2] > 200) trail.shift();
    const busy = moving || dirty || trail.length || shake > 0.05;
    if (busy) draw(now, dt);
    dirty = false;
    requestAnimationFrame(frame);
  }

  function draw(now, dt) {
    ctx.save();
    ctx.drawImage(back, 0, 0, W, H);
    if (shake > 0.05) {
      ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
      shake *= Math.pow(0.0008, dt);
    } else shake = 0;

    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    pieces.forEach((p) => {
      ctx.save();
      tracePoly(ctx, p.poly, p.x, p.y);
      if (pieces.length > 1) {
        // a faint shadow so each torn piece sits on top of the red sheet
        ctx.shadowColor = 'rgba(60, 6, 0, 0.45)';
        ctx.shadowBlur = 7; ctx.shadowOffsetY = 2;
        ctx.fillStyle = COLOR.backing;
        ctx.fill();
        ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
      }
      ctx.clip();
      ctx.drawImage(tex, p.x, p.y, W, H);
      // Torn edges show the paper's core. Each tear draws both of its bands; the clip keeps only the one on this piece.
      if (p.seams.length) {
        ctx.translate(p.x, p.y);
        p.seams.forEach((s) => {
          ctx.fillStyle = COLOR.core;
          s.core.forEach((b) => ctx.fill(b));
          ctx.fillStyle = COLOR.coreHi;
          s.hi.forEach((b) => ctx.fill(b));
          ctx.strokeStyle = COLOR.fibre; ctx.lineWidth = 0.6;
          ctx.stroke(s.fibres);
          ctx.strokeStyle = COLOR.lip; ctx.lineWidth = 1;
          ctx.stroke(s.lips);
          ctx.strokeStyle = COLOR.coreHi; ctx.lineWidth = 1.2;
          ctx.stroke(s.rim);
        });
      }
      ctx.restore();
    });

    // While dragging: the blade's line through the paper, still closed.
    if (stroke && stroke.line.length > 1) {
      ctx.strokeStyle = COLOR.crease;
      ctx.globalAlpha = 0.7;
      ctx.lineWidth = 1.3;
      traceLine(ctx, stroke.line);
      ctx.stroke();
      ctx.strokeStyle = COLOR.torn;
      ctx.globalAlpha = 0.55;
      ctx.lineWidth = 0.8;
      traceLine(ctx, stroke.line, 0.9, 0.9);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    // A glint of steel at the tip, thinning out behind the pointer.
    for (let i = 1; i < trail.length; i++) {
      const a = trail[i - 1], b = trail[i];
      if (b[2] - a[2] > 120) continue;
      const life = 1 - (now - b[2]) / 200;
      ctx.globalAlpha = Math.max(0, life) * 0.9;
      ctx.strokeStyle = COLOR.blade;
      ctx.lineWidth = 0.5 + life * 2;
      ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }
  requestAnimationFrame(frame);

  // for checks from the console
  window.__kb = {
    get pieces() { return pieces; },
    cut(points) {
      const s = { pts: points.map(([x, y], i) => [x, y, i * 8]), line: [points[0]], state: { at: points[0], drift: 0 } };
      points.slice(1).forEach((p) => tearTo(s.line, s.state, p));
      finishCut(s);
    },
    mend,
  };
})();
</script>
</body></html>
