<style>
  /* Layout: black table. Each week is a row of five plain white cards; a finished day gets a picture in its window. */
  :root {
    color-scheme: dark;
    --table: #000000;
    --mount: #ffffff;
    --mount-ink: #111111;
    --mount-soft: #8a8a8a;
    --window-empty: #e6e6e6;
    --ink: #f2f2f0;
    --ink-soft: #8c8c8c;
    --rule: #2b2b2b;

    --thumb-night: #050506;
    --thumb-fog: rgba(170, 174, 180, 0.35);
    --thumb-petal: #f5f5f2;
    --thumb-heart: #f2b840;
    --thumb-stem: #6f8a69;
    --thumb-sheet: #fce527;
    --thumb-ink: #0a0a0a;
    --thumb-red: #ff1e00;
    --thumb-stage: #f3f3f1;
    --thumb-line: #b5b5b5;
    --thumb-note: #c4161c;
    --thumb-card: #f3f3f1;
    --o: #be8c6b; --v: #4ea530; --e: #fd5c28; --r: #b3ab01; --l: #426c9e; --a: #fc6ca9; --p: #f93571;

    /* one face for everything, Hangul and Latin alike */
    --font-display: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --font-body: var(--font-display);
    --font-hand: var(--font-display);
    --font-mono: var(--font-display);
  }

  * { font-synthesis: none; }
  body {
    background: var(--table);
    color: var(--ink);
    font: 400 15px/1.6 var(--font-body);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: clamp(28px, 6vw, 72px) 56px;
  }
  .wrap { max-width: 1160px; margin: 0 auto; display: flex; flex-direction: column; gap: clamp(36px, 6vw, 64px); }

  /* ---------- weeks ---------- */
  #weeks { display: flex; flex-direction: column; gap: clamp(40px, 6vw, 64px); }
  .week { display: flex; flex-direction: column; gap: 18px; }
  .week-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; padding-bottom: 12px; border-bottom: 1px solid var(--rule); }
  .week-no { font: 400 13px/1 var(--font-mono); letter-spacing: 0.1em; text-transform: uppercase; }
  .week-range { font: 400 13px/1 var(--font-mono); color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .week-theme { margin: 0; font-weight: 400; }

  .sheet { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: clamp(12px, 2vw, 22px); }
  .slot { display: flex; flex-direction: column; gap: 12px; min-width: 0; color: inherit; text-decoration: none; }

  .mount {
    position: relative; aspect-ratio: 1 / 1; max-width: 100%;
    background: var(--mount); color: var(--mount-ink);
    display: grid; grid-template-rows: auto 1fr; padding: 10% 11% 8%; gap: 8%;
    transition: transform 0.25s ease;
  }
  .window {
    aspect-ratio: 3 / 2; overflow: hidden; background: var(--window-empty);
    display: grid; place-items: center;
  }
  .window svg { width: 100%; height: 100%; display: block; }
  .label { display: flex; align-items: center; justify-content: space-between; gap: 6px; min-width: 0; }
  .label-title { font: 400 clamp(12px, 1.3vw, 16px)/1.5 var(--font-hand); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .code { font: 400 10px/1 var(--font-mono); letter-spacing: 0.08em; color: var(--mount-soft); flex: none; }


  a.slot:hover .mount, a.slot:focus-visible .mount { transform: translateY(-4px); }
  a.slot:focus-visible { outline: none; }
  a.slot:focus-visible .mount { outline: 2px solid var(--ink); outline-offset: 4px; }

  .slot.empty .label-title { color: var(--mount-soft); }
  /* unfilled days keep the window's space so every card stays the same size, but show nothing in it */
  .slot.empty .window { background: none; }


  @media (max-width: 900px) {
    .sheet {
      grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: minmax(170px, 42%);
      overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 10px;
      margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))) calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
      padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
      scroll-padding-inline: max(16px, env(safe-area-inset-left, 0px));
    }
    .slot { scroll-snap-align: start; }
    .label-title { font-size: 14px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .mount { transition: none; }
  }
</style>

    life() {
      // a shelf of LIFE spines against a mountain dusk, one issue turned to its cover
      let spines = '';
      const ws = [9, 7, 10, 8, 9, 7, 8, 10, 7, 9, 8];
      let x = 6;
      ws.forEach((w, i) => {
        if (i === 6) { spines += `<rect x="${x}" y="30" width="34" height="56" fill="#2b2b2e"/><rect x="${x}" y="30" width="14" height="8" fill="#d7262c"/><ellipse cx="${x + 17}" cy="58" rx="8" ry="11" fill="#8a8a8a"/><rect x="${x + 6}" y="66" width="22" height="20" fill="#5a5a5a"/><rect x="${x}" y="82" width="34" height="4" fill="#d7262c"/>`; x += 36; }
        spines += `<rect x="${x}" y="32" width="${w}" height="54" fill="${i % 4 === 1 ? '#e9e3d6' : '#f3efe6'}"/><rect x="${x + 1}" y="34" width="${w - 2}" height="4" fill="#d7262c"/>`;
        x += w + 1.5;
      });
      return `<svg viewBox="0 0 150 100" role="img" aria-label="산 노을을 배경으로 LIFE 책등이 늘어선 책장, 한 권은 표지가 보임">
        <defs><linearGradient id="th-dusk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3f6273"/><stop offset="0.7" stop-color="#c9a27a"/><stop offset="1" stop-color="#e9b46a"/></linearGradient></defs>
        <rect width="150" height="100" fill="url(#th-dusk)"/>
        <path d="M0 70 L40 40 L62 58 L98 18 L150 66 L150 100 L0 100 Z" fill="#8a5a40" opacity="0.8"/>
        <rect y="86" width="150" height="14" fill="#2c2a33"/>
        ${spines}
      </svg>`;
    },
    wordblob() {
      // the sports car from the picture book: white body, black pen line
      return `<svg viewBox="9 52 1000 667" role="img" aria-label="흰 바탕에 검은 선으로 그린 스포츠카 한 대">
        <rect x="0" y="0" width="1100" height="800" style="fill:var(--thumb-card)"/>
        <g fill="#fff" stroke="#000" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
          <circle cx="250" cy="468" r="72"/><circle cx="790" cy="468" r="72"/>
          <path d="M60 420 C60 372 102 348 172 338 L330 322 C392 272 470 236 560 233 C642 230 702 252 762 302 L882 322 C932 332 958 362 958 402 L958 440 C958 460 942 470 922 470 L82 470 C66 470 60 456 60 440 Z"/>
          <path d="M382 320 C432 282 492 264 556 264 C602 264 642 277 682 307 L672 320 Z"/>
          <circle cx="250" cy="468" r="30"/><circle cx="790" cy="468" r="30"/>
          <ellipse cx="915" cy="372" rx="18" ry="11"/>
          <path d="M560 330 L560 425 M360 424 L700 424" fill="none"/>
        </g>
      </svg>`;
    },
  };

  /* ---------- build the sheet ---------- */
  const pad = (n) => String(n).padStart(2, '0');
  const slots = [];
  WEEKS.forEach((w) => {
    for (let i = 0; i < 5; i++) {
      const d = new Date(Date.UTC(w.monday[0], w.monday[1] - 1, w.monday[2] + i));
      const key = `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`;
      slots.push({ week: w.n, i, key, mmdd: `${pad(d.getUTCMonth() + 1)}.${pad(d.getUTCDate())}`, work: WORKS[key] || null });
    }
  });

  const $ = (id) => document.getElementById(id);

  const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const slotHtml = (s, n) => {
    const code = `D${pad(n + 1)}`;
    if (s.work) {
      const w = s.work;
      const pic = THUMBS[w.thumb] ? THUMBS[w.thumb]() : '';
      return `<a class="slot" href="${esc(w.url)}">
        <div class="mount"><div class="window">${pic}</div>
          <div class="label"><span class="label-title">${esc(w.title)}</span><span class="code">${code}</span></div></div>
      </a>`;
    }
    return `<div class="slot empty">
      <div class="mount"><div class="window"></div>
        <div class="label"><span class="label-title">untitled</span><span class="code">${code}</span></div></div>
    </div>`;
  };

  $('weeks').innerHTML = WEEKS.map((w) => {
    const items = slots.filter((s) => s.week === w.n);
    const range = `${items[0].mmdd} – ${items[4].mmdd}`;
    const theme = w.theme ? `<p class="week-theme">${esc(w.theme)}</p>` : '';
    return `<section class="week" aria-label="${w.n}주차">
      <div class="week-head"><span class="week-no">Week ${w.n}</span><span class="week-range">${range}</span>${theme}</div>
      <div class="sheet">${items.map((s) => slotHtml(s, slots.indexOf(s))).join('')}</div>
    </section>`;
  }).join('');
})();
</script>

</body></html>
