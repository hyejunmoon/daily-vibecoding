<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Everything Everywhere All at Once</title>
<style>
:root{--bg:#ffffff;--soft:#efece7;--ink:#2b2724}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#111110;--soft:#232220;--ink:#ece8e2}}
:root[data-theme="dark"]{--bg:#111110;--soft:#232220;--ink:#ece8e2}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;-webkit-user-select:none;user-select:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
video{position:fixed;width:1px;height:1px;opacity:0;pointer-events:none}
.start{position:fixed;left:50%;top:50%;width:92px;height:92px;margin:-46px 0 0 -46px;border:0;border-radius:50%;background:var(--soft);color:var(--ink);cursor:pointer;display:grid;place-items:center;transition:transform .2s;padding:0}
.start:hover{transform:scale(1.06)}
.start svg{width:40px;height:40px}
.start.loading{pointer-events:none}
.start.loading::after{content:'';position:absolute;inset:-7px;border-radius:50%;border:2px solid transparent;border-top-color:var(--ink);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.shutter{position:fixed;left:50%;bottom:26px;width:64px;height:64px;margin-left:-32px;border-radius:50%;border:4px solid #fff;background:rgba(255,255,255,.25);box-shadow:0 2px 14px rgba(0,0,0,.28);cursor:pointer;padding:0}
.shutter::after{content:'';position:absolute;inset:5px;border-radius:50%;background:#fff;transition:inset .08s}
.shutter:active::after{inset:9px}
.flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .4s}
[hidden]{display:none!important}
</style>

<canvas id="cv"></canvas>
<video id="vid" playsinline muted></video>
<button class="start" id="start" aria-label="카메라 켜기">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8.5A1.5 1.5 0 0 1 5.5 7h2.2l1.4-2h5.8l1.4 2h2.2A1.5 1.5 0 0 1 20 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 17.5z"/><circle cx="12" cy="13" r="3.6"/></svg>
</button>
<button class="shutter" id="shutter" aria-label="사진 찍기" hidden></button>
<div class="flash" id="flash"></div>

<script>
(() => {
'use strict';
const MB_URL = 'https://mockingbird.betawoowa.in/artifacts/everything-everywhere-day10/';
const MP = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
const FACE_MODEL = 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task';
const HAND_MODEL = 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';

const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const video = document.getElementById('vid');
const startBtn = document.getElementById('start'), shutter = document.getElementById('shutter'), flash = document.getElementById('flash');

let W = 0, H = 0, DPR = 1;
function resize() { DPR = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; cv.width = W * DPR; cv.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0); }
addEventListener('resize', resize); resize();

// ---------- math ----------
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const P = (x, y) => ({ x, y });
const sub = (a, b) => P(a.x - b.x, a.y - b.y), add = (a, b) => P(a.x + b.x, a.y + b.y), mul = (a, s) => P(a.x * s, a.y * s);
const len = a => Math.hypot(a.x, a.y), dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const norm = a => { const l = len(a) || 1; return P(a.x / l, a.y / l); };
const lp = (a, b, t) => P(lerp(a.x, b.x, t), lerp(a.y, b.y, t));
const rnd = (a, b) => a + Math.random() * (b - a);
function hash(n) { const s = Math.sin(n * 127.1) * 43758.5453; return s - Math.floor(s); }
function noise(x) { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(hash(i), hash(i + 1), u) * 2 - 1; }
const easeOutBack = t => { const c = 1.6; t = clamp(t, 0, 1) - 1; return 1 + (c + 1) * t * t * t + c * t * t; };

// ---------- video → screen (mirrored, cover) ----------
let view = { s: 1, ox: 0, oy: 0, vw: 1280, vh: 720 };
function fitView(vw, vh) { const s = Math.max(W / vw, H / vh); view = { s, vw, vh, ox: (W - vw * s) / 2, oy: (H - vh * s) / 2 }; }
const toScreen = p => P(view.ox + (1 - p.x) * view.vw * view.s, view.oy + p.y * view.vh * view.s);

// light smoothing per point set; faster motion → less smoothing
const smooth = new Map();
function smoothPts(key, pts, size) {
  const prev = smooth.get(key);
  if (!prev || prev.length !== pts.length) { smooth.set(key, pts); return pts; }
  const out = pts.map((p, i) => { const q = prev[i]; const a = clamp(.38 + dist(p, q) / (size * .35), .38, 1); return lp(q, p, a); });
  smooth.set(key, out); return out;
}

// ---------- state ----------
const THEMES = ['sausage', 'flower', 'candle'];
const FLOWERS = ['daisy', 'tulip', 'rose', 'cosmos'];
let theme = THEMES[Math.floor(Math.random() * 3)];
let handsGoneAt = null, needShuffle = false;
const fingers = new Map(); // key → per-finger state
function pickTheme() { const o = THEMES.filter(t => t !== theme); theme = o[Math.floor(Math.random() * o.length)]; fingers.clear(); }
function fingerState(key, now) {
  let f = fingers.get(key);
  if (!f) {
    f = { born: now, kind: FLOWERS[Math.floor(Math.random() * FLOWERS.length)], hue: Math.random(), seed: Math.random() * 100,
      lit: true, outAt: 0, litAt: now - 2000, smoke: [] };
    fingers.set(key, f);
  }
  return f;
}

// ---------- googly eye ----------
const eye = { px: 0, py: 0, vx: 0, vy: 0, c: null, v: P(0, 0), neutral: P(0, 0), seen: false };
function gazeOf(L) {
  // per eye: corners, iris (screen coords, already mirrored)
  const one = (a, b, iris) => {
    const ctr = lp(a, b, .5), ax = sub(b, a), half = len(ax) / 2 || 1, u = norm(ax), n = P(-u.y, u.x);
    const d = sub(iris, ctr);
    const gx = (d.x * u.x + d.y * u.y) / half, gy = (d.x * n.x + d.y * n.y) / half;
    // u points from a to b; we want screen-right positive
    return u.x >= 0 ? P(gx, gy) : P(-gx, -gy);
  };
  const g1 = one(L[33], L[133], L[468]), g2 = one(L[362], L[263], L[473]);
  return P((g1.x + g2.x) / 2, (g1.y + g2.y) / 2);
}
function newEye(k, damp) { return { px: 0, py: .1, vx: 0, vy: 0, c: null, v: P(0, 0), k, damp }; }
const rockEyes = [newEye(62, 6), newEye(78, 7.5)];
function stepEye(e, c, R, roll, tx, ty, dt) {
  const m = .3; // max pupil offset (in units of R)
  const cr = Math.cos(-roll), sr = Math.sin(-roll);
  const lx = (tx * cr - ty * sr) * m, ly = (tx * sr + ty * cr) * m;
  let acc = P(0, 0);
  if (e.c && dt > 0) { const v = mul(sub(c, e.c), 1 / dt); acc = mul(sub(v, e.v), 1 / dt); e.v = lp(e.v, v, .6); }
  e.c = c;
  const aL = P((acc.x * cr - acc.y * sr) / R, (acc.x * sr + acc.y * cr) / R);
  e.vx += ((lx - e.px) * e.k - e.vx * e.damp - clamp(aL.x, -900, 900) * .06) * dt;
  e.vy += ((ly - e.py) * e.k - e.vy * e.damp - clamp(aL.y, -900, 900) * .06) * dt;
  e.px += e.vx * dt; e.py += e.vy * dt;
  const pl = Math.hypot(e.px, e.py);
  if (pl > m) { const nx = e.px / pl, ny = e.py / pl; e.px = nx * m; e.py = ny * m; const vn = e.vx * nx + e.vy * ny; if (vn > 0) { e.vx -= 1.55 * vn * nx; e.vy -= 1.55 * vn * ny; } }
}
function updateEye(L, dt) {
  const fw = dist(L[234], L[454]);
  const c = lp(L[9], L[168], .3);
  const R = fw * .055;
  const a = sub(L[33], L[263]); const roll = Math.atan2(a.y, a.x); // mirrored: 33 lands on screen right
  const g = gazeOf(L);
  if (!eye.seen) { eye.neutral = g; eye.seen = true; }
  eye.neutral = lp(eye.neutral, g, .004);
  let tx = (g.x - eye.neutral.x) * 2.6, ty = (g.y - eye.neutral.y) * 4.2;
  const tl = Math.hypot(tx, ty); if (tl > 1) { tx /= tl; ty /= tl; }
  eye.k = 70; eye.damp = 7;
  stepEye(eye, c, R, roll, tx, ty, dt);
  // rock on top of the head
  const up = norm(sub(L[10], L[152])), fh = dist(L[10], L[152]);
  const rw = fw * .95, rh = rw * .68;
  const seat = add(L[10], mul(up, fh * .2));
  const rock = { seat, rw, rh, roll, eyes: [] };
  const rr = Math.cos(roll), rs = Math.sin(roll);
  [[-.19, -.46], [.19, -.46]].forEach(([x, y], i) => {
    const lx = x * rw, ly = y * rh;
    const ec = P(seat.x + lx * rr - ly * rs, seat.y + lx * rs + ly * rr);
    const eR = rw * .085;
    stepEye(rockEyes[i], ec, eR, roll, tx, ty, dt);
    rock.eyes.push({ c: ec, R: eR, roll, e: rockEyes[i] });
  });
  return { c, R, roll, e: eye, rock };
}

// flowers — drawn in a local frame: origin at fingertip, -y = along the finger
const PALETTE = {

const WAX = [['#f6d2de', '#d78aa4'], ['#cfe3f5', '#7fa6cc'], ['#fbe7a6', '#d7ab3d'], ['#d6efd8', '#79b483'], ['#e4d8f3', '#9f86c8']];

// ---------- blowing ----------
const mic = { an: null, td: null, fd: null, floor: .01, level: 0, flat: 0, blowFor: 0, budget: 0, s: 0, fake: 0 };
function readMic(dt) {
  let intensity = 0;

    mic.an.getFloatTimeDomainData(mic.td); mic.an.getFloatFrequencyData(mic.fd);
    let s = 0; for (const v of mic.td) s += v * v; const rms = Math.sqrt(s / mic.td.length);
    // spectral flatness 100Hz–5kHz: breath is noise (flat), voice is tonal
    const hz = mic.an.context.sampleRate / mic.an.fftSize; let lg = 0, ar = 0, n = 0;
    for (let i = Math.max(1, Math.round(100 / hz)); i < Math.round(5000 / hz); i++) { const p = Math.pow(10, mic.fd[i] / 10) + 1e-12; lg += Math.log(p); ar += p; n++; }

  if (mic.fake > 0) { intensity = Math.max(intensity, mic.fake); }

  if (mic.blowFor > .08) mic.budget += intensity * dt * 90; else mic.budget = Math.max(0, mic.budget - dt * 2);

// ---------- frame ----------
let faceRes = null, handRes = null, demo = null, lastT = performance.now(), running = false;
function render(now) {
  const dt = Math.min(.05, (now - lastT) / 1000); lastT = now;
  ctx.clearRect(0, 0, W, H);
  if (demo) { fitView(1280, 720); drawDemoBg(now); }
  else if (video.videoWidth) {
    fitView(video.videoWidth, video.videoHeight);
    ctx.save(); ctx.translate(W, 0); ctx.scale(-1, 1);
    ctx.drawImage(video, W - view.ox - view.vw * view.s, view.oy, view.vw * view.s, view.vh * view.s);
    ctx.restore();
  } else return;

  const faces = demo ? demo.faces(now) : (faceRes?.faceLandmarks || []);
  const hands = demo ? demo.hands(now) : (handRes?.landmarks || []).map((l, i) => ({ l, label: handRes.handedness?.[i]?.[0]?.categoryName || ('h' + i) }));

  let mouth = P(W / 2, H * .38), eyeG = null;
  if (faces.length) {
    let L = faces[0].map(toScreen);
    L = smoothPts('face', L, dist(L[234], L[454]));
    mouth = L[13];
    eyeG = updateEye(L, dt);
  } else { eye.c = null; rockEyes.forEach(e => e.c = null); }

  // shuffle when both hands have left the frame
  if (!hands.length) { if (handsGoneAt == null) handsGoneAt = now; if (now - handsGoneAt > 600) needShuffle = true; }
  else { if (needShuffle) { pickTheme(); needShuffle = false; } handsGoneAt = null; }

  readMic(dt);
  if (eyeG) { drawGooglyEye(eyeG); drawRock(eyeG.rock); for (const re of eyeG.rock.eyes) drawGooglyEye(re); }

  const candles = [];
  for (const h of hands) {
    let L = h.l.map(toScreen);
    const palm = dist(L[5], L[17]) || 1;
    L = smoothPts('hand' + h.label, L, palm);
    for (let fi = 0; fi < 5; fi++) {
      const axis = fingerAxis(L, fi), w = palm * WIDTH[fi] * 1.25;
      const f = fingerState(h.label + fi, now);
      if (theme === 'sausage') drawSausage(axis, w);
      else if (theme === 'flower') drawFlower(axis, w, f, now);
      else candles.push({ cg: candleGeom(axis, w, fi), f });
    }
  }
  if (theme === 'candle') {
    // blow out nearest lit candles first
    while (mic.budget >= 1) {
      let best = null, bd = Infinity;
      for (const c of candles) if (c.f.lit && now - c.f.litAt > 400) { const d = dist(c.cg.wick, mouth); if (d < bd) { bd = d; best = c; } }
      if (!best) { mic.budget = 0; break; }

    }

    for (const c of candles) {
      const d = norm(sub(c.cg.wick, mouth));
      drawFlame(c.cg, c.f, now, { x: d.x * mic.s, y: d.y * mic.s, s: mic.s });
      drawSmoke(c.f, now);

let lastVT = -1, face = null, hand = null;
function loop() {
  requestAnimationFrame(loop);
  const now = performance.now();
  if (!demo && face && video.readyState >= 2 && video.currentTime !== lastVT) {
    lastVT = video.currentTime;
    try { faceRes = face.detectForVideo(video, now); handRes = hand.detectForVideo(video, now); } catch (e) {}
  }
  if (running) render(now);
}

// ---------- start ----------
async function start() {
  if (/claude(usercontent)?\.(ai|com)$/.test(location.hostname) || !navigator.mediaDevices?.getUserMedia) { window.open(MB_URL, '_blank', 'noopener'); return; }
  startBtn.classList.add('loading');
  let stream;
  const audio = { echoCancellation: false, noiseSuppression: false, autoGainControl: false };
  const vid = { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: 'user' };
  try { stream = await navigator.mediaDevices.getUserMedia({ video: vid, audio }); }
  catch (e) { try { stream = await navigator.mediaDevices.getUserMedia({ video: vid }); } catch (e2) { startBtn.classList.remove('loading'); window.open(MB_URL, '_blank', 'noopener'); return; } }
  video.srcObject = stream; await video.play();
  if (stream.getAudioTracks().length) {
    try {
      const ac = new (window.AudioContext || window.webkitAudioContext)();
      const src = ac.createMediaStreamSource(stream); const an = ac.createAnalyser(); an.fftSize = 2048; an.smoothingTimeConstant = .3;
      src.connect(an); mic.an = an; mic.td = new Float32Array(an.fftSize); mic.fd = new Float32Array(an.frequencyBinCount);
      ac.resume();
    } catch (e) {}
  }
  const { FilesetResolver, FaceLandmarker, HandLandmarker } = await import(MP + '/vision_bundle.mjs');
  const fs = await FilesetResolver.forVisionTasks(MP + '/wasm');
  const mk = (C, model, extra) => C.createFromOptions(fs, { baseOptions: { modelAssetPath: model, delegate: 'GPU' }, runningMode: 'VIDEO', ...extra })
    .catch(() => C.createFromOptions(fs, { baseOptions: { modelAssetPath: model, delegate: 'CPU' }, runningMode: 'VIDEO', ...extra }));
  [face, hand] = await Promise.all([mk(FaceLandmarker, FACE_MODEL, { numFaces: 1 }), mk(HandLandmarker, HAND_MODEL, { numHands: 2 })]);
  startBtn.hidden = true; shutter.hidden = false; running = true;
}
startBtn.addEventListener('click', start);

shutter.addEventListener('click', () => {
  flash.style.transition = 'none'; flash.style.opacity = '.9';
  requestAnimationFrame(() => { flash.style.transition = 'opacity .4s'; flash.style.opacity = '0'; });
  cv.toBlob(b => {
    if (!b) return;
    const a = document.createElement('a'); const d = new Date();
    a.download = `everything-everywhere-${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}-${String(d.getHours()).padStart(2, '0')}${String(d.getMinutes()).padStart(2, '0')}${String(d.getSeconds()).padStart(2, '0')}.png`;
    a.href = URL.createObjectURL(b); document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }, 'image/png');
});

// ---------- demo (no camera; for checking the drawing) ----------
