<script>
const PW=1060,PH=1400,INK='#5b8a4e',PAPER='#f1f0e2';
const SERIF='"NR", Georgia, serif',SANS='"IT", Helvetica, Arial, sans-serif';
const TXT={
 hl:['Credit Cards,','The Record','Balance'],
 hr:['Notes on the New York','Fed’s Household Debt','Report, Q3 2026'],
 s1:['Americans are carrying more on their credit cards than ever before. According to the Federal Reserve Bank of New York’s quarterly report on household debt and credit, released on November 10, card balances reached a record $1.29 trillion in the third quarter of 2026, after growing by $22 billion between July and September. That is 4.2 percent more than a year earlier. Across every kind of borrowing, from mortgages and car loans to student debt, households now owe a combined $19.1 trillion, also a record, after a quarterly rise of $334 billion.',
     'The researchers did not frame the numbers as a sign of confidence. Instead they pointed to strain: new card accounts have increasingly gone to borrowers with lower incomes and weaker credit scores, and it is precisely those accounts that now show the most signs of distress.'],
 s2:['Part of the story begins in the pandemic years, when issuers loosened their lending standards and delinquencies climbed in the years that followed. Part of it is the cost of living. Inflation has proved stubborn, and for lower-income households it has outpaced wage growth, leaving essentials such as groceries and fuel harder to cover from a paycheck alone. Cards are often the easiest credit to reach for, and among the most expensive: LendingTree data cited by CNBC put the average rate on a new card offer at roughly 24 percent.'],
 en:['Separate figures from TransUnion tell a similar story at the level of the individual. In its third-quarter report, the credit bureau found that the average card balance per consumer had risen 2.4 percent from a year earlier to $6,678, while the number of people holding at least one card grew by about 2 percent, to 178 million.',
     'Analysts quoted in the coverage stressed two points at once. Balance growth appears to be slowing, yet the damage done by years of higher prices and higher interest rates is already considerable, and the people least able to absorb it are the ones leaning hardest on revolving credit.',
     'For anyone holding a card right now, the arithmetic is simple and unforgiving: a balance that is not paid in full keeps compounding at rates few other loans can match. The record is not only a headline about the economy. It is also the sum of millions of small swipes.'],
 foot:'Source: CNBC, “Credit card debt climbs to a record $1.29 trillion, New York Fed research finds,” Jessica Dickler, November 10, 2026. Text above is an original summary.'
};
const cv=document.getElementById('c'),cx=cv.getContext('2d');
let scale=1,dpr=1,dirty=true;
const meas=(t,f)=>{cx.font=f;return cx.measureText(t).width};
function rng(s){s=s%2147483647||7;return()=>(s=(s*16807)%2147483647)/2147483647}
/* ---------- paths ---------- */
// a lane is a polyline the text runs along; glyphs sit at arc length s on it
function mkLane(P){const C=[0];for(let i=1;i<P.length;i++)C.push(C[i-1]+Math.hypot(P[i][0]-P[i-1][0],P[i][1]-P[i-1][1]));
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;P.forEach(([x,y])=>{x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y)});return{P,C,len:C[C.length-1],g:[],bb:[x0,y0,x1,y1]}}
function at(L,s){const C=L.C,P=L.P;s=Math.max(0,Math.min(L.len,s));let lo=0,hi=C.length-1;while(hi-lo>1){const m=(lo+hi)>>1;if(C[m]<=s)lo=m;else hi=m}
  const seg=C[hi]-C[lo]||1,t=(s-C[lo])/seg,x=P[lo][0]+(P[hi][0]-P[lo][0])*t,y=P[lo][1]+(P[hi][1]-P[lo][1])*t;return[x,y,Math.atan2(P[hi][1]-P[lo][1],P[hi][0]-P[lo][0])]}
const BOX=[44,40,PW-44,PH-96];
const inBox=([x,y])=>x>=BOX[0]&&x<=BOX[2]&&y>=BOX[1]&&y<=BOX[3];
// cut a densely sampled curve into the pieces that lie on the page
function clip(pts,minLen=70){const out=[];let cur=[];for(const p of pts){if(inBox(p))cur.push(p);else{if(cur.length>1)out.push(cur);cur=[]}}if(cur.length>1)out.push(cur);
  return out.map(mkLane).filter(l=>l.len>=minLen)}
function sampleLine(x0,y0,x1,y1,st=5){const n=Math.max(2,Math.ceil(Math.hypot(x1-x0,y1-y0)/st)),o=[];for(let i=0;i<=n;i++)o.push([x0+(x1-x0)*i/n,y0+(y1-y0)*i/n]);return o}
function sampleArc(cx0,cy0,r,a0,a1){const n=Math.max(8,Math.ceil(Math.abs(a1-a0)*r/5)),o=[];for(let i=0;i<=n;i++){const a=a0+(a1-a0)*i/n;o.push([cx0+r*Math.cos(a),cy0+r*Math.sin(a)])}return o}
/* ---------- filling lanes with the article ---------- */
const STREAM=[TXT.hl.join(' ')+' —',TXT.hr.join(' ')+'.',...TXT.s1,...TXT.s2,...TXT.en].join('   ');
function fill(lanes,fontOf,text,pad=0){const words=text.split(' ');let wi=0;
  for(let li=0;li<lanes.length&&wi<words.length;li++){const L=lanes[li],f=fontOf(li,L),sz=parseFloat(f);cx.font=f;const sp=cx.measureText(' ').width;let s=pad;const line=[];
    while(wi<words.length){const w=words[wi],ww=cx.measureText(w).width;if(s+ww>L.len-pad&&line.length)break;if(s+ww>L.len-pad&&!line.length){wi++;continue}line.push([w,s]);s+=ww+sp;wi++}
    line.forEach(([w,s0],k)=>{let px=s0;for(const ch of w){const cw=cx.measureText(ch).width;L.g.push({ch,w:cw,s:px,hs:px,f,sz});px+=cw}if(k<line.length-1)L.g.push({ch:' ',w:sp,s:px,hs:px,f,sz,sp:1})})}
  return wi>=words.length}
/* ---------- layouts ---------- */
let LANES=[],LNAME='Book';
const SER=sz=>`${sz}px ${SERIF}`,SAN=sz=>`${sz}px ${SANS}`;
function footer(lanes){const ff=SAN(12.5);let y=PH-62,line='';const rows=[];for(const w of TXT.foot.split(' ')){if(meas(line+' '+w,ff)>560&&line){rows.push(line);line=w}else line=line?line+' '+w:w}if(line)rows.push(line);
  rows.forEach((t,i)=>{const L=mkLane([[52,y+i*16],[PW-52,y+i*16]]);fill([L],()=>ff,t);lanes.push(L)});const P=mkLane([[980,PH-24],[1040,PH-24]]);fill([P],()=>SAN(19.6),'17');lanes.push(P)}
// the reference spread: two-column head, wide serif, narrow serif beside a right-ranged sans block
function bookLayout(){const lanes=[];const rowsAt=(x,y,w)=>mkLane([[x,y],[x+w,y]]);
  const put=(paras,font,lh,y0,widthAt,xAt,indent=0)=>{let y=y0,li=0;paras.forEach((p,pi)=>{const words=p.split(' ');let line=[],first=true;
    const flush=()=>{const s=line.join(' '),ind=first&&pi>0?indent:0,w=meas(s,font),x=xAt(li,w)+ind;const L=rowsAt(0,y,PW);fill([L],()=>font,s,0);L.g.forEach(o=>{o.s+=x;o.hs=o.s});lanes.push(L);y+=lh;li++;line=[];first=false};
    for(const w of words){const ind=first&&pi>0?indent:0;if(line.length&&meas([...line,w].join(' '),font)>widthAt(li)-ind)flush();line.push(w)}if(line.length)flush()});return y};
  TXT.hl.forEach((t,i)=>put([t],SER(26),29,56+i*29,()=>999,()=>52));TXT.hr.forEach((t,i)=>put([t],SAN(25),29,56+i*29,()=>999,()=>400));
  let y=put(TXT.s1,SER(26),30.5,176,()=>660,()=>52,50);const yN=y;put(TXT.s2,SER(26),30.5,y,()=>350,()=>52,50);put(TXT.en,SAN(23),30.5,yN,i=>Math.min(588,500+i*8),(i,w)=>1008-w);
  // rows on the same baseline share one lane
  const M=[];for(const L of lanes){const y0=L.P[0][1];let m=M.find(o=>Math.abs(o.P[0][1]-y0)<3);if(!m){M.push(L);continue}m.g.push(...L.g)}M.forEach(m=>m.g.sort((a,b)=>a.hs-b.hs));return M}
const LAYOUTS={
 'Book':()=>({lanes:bookLayout(),font:null}),
 'Rings':(sz,R)=>{const c=[PW/2+(R()-.5)*160,640+(R()-.5)*200],o=[];for(let r=PW*.75;r>40;r-=sz*1.3)o.push(...clip(sampleArc(c[0],c[1],r,-Math.PI/2,Math.PI*1.5)));return{lanes:o}},
 'Spiral':(sz,R)=>{const c=[PW/2,620],b=sz*1.32/(2*Math.PI),pts=[];const t0=(760-40)/b;for(let t=t0;t>40/b;t-=5/(b*t)){const r=b*t;pts.push([c[0]+r*Math.cos(t),c[1]+r*Math.sin(t)])}return{lanes:clip(pts,40)}},
 'Waves':(sz,R)=>{const o=[],A=28+R()*60,lam=110+R()*220,ph=R()*6,sh=.25+R()*.6;for(let y=70,i=0;y<PH-90;y+=sz*1.3,i++){const pts=[];for(let x=BOX[0];x<=BOX[2];x+=5)pts.push([x,y+A*Math.sin(x/lam+ph+i*sh)]);o.push(...clip(pts))}return{lanes:o}},
 'Diagonal':(sz,R)=>{const ang=(R()<.5?-1:1)*(.35+R()*.6),u=[Math.cos(ang),Math.sin(ang)],n=[-u[1],u[0]],o=[],D=1800;for(let k=-1400;k<1400;k+=sz*1.3){const c=[PW/2+n[0]*k,PH/2+n[1]*k];o.push(...clip(sampleLine(c[0]-u[0]*D,c[1]-u[1]*D,c[0]+u[0]*D,c[1]+u[1]*D)))}return{lanes:o}},
 'Vertical':(sz,R)=>{const o=[],up=R()<.5;for(let x=BOX[0]+sz;x<BOX[2];x+=sz*1.3){o.push(...clip(up?sampleLine(x,BOX[3],x,BOX[1]):sampleLine(x,BOX[1],x,BOX[3])))}if(!up)o.reverse();return{lanes:o}},
 'Fan':(sz,R)=>{const c=[PW*(.2+R()*.6),PH+120+R()*300],o=[];for(let r=260;r<2400;r+=sz*1.3)o.push(...clip(sampleArc(c[0],c[1],r,-Math.PI,0)));o.reverse();return{lanes:o}},
 'Orbits':(sz,R)=>{const o=[],n=3+Math.floor(R()*3),cs=[];for(let i=0;i<n;i++)cs.push([BOX[0]+120+R()*(BOX[2]-BOX[0]-240),BOX[1]+150+R()*(BOX[3]-BOX[1]-300),110+R()*230]);
   cs.forEach(([x,y,rm])=>{for(let r=rm;r>30;r-=sz*1.3)o.push(...clip(sampleArc(x,y,r,-Math.PI/2,Math.PI*1.5),40))});
   for(let y=BOX[1]+sz;y<BOX[3];y+=sz*1.3){const pts=sampleLine(BOX[0],y,BOX[2],y);let cur=[];for(const p of pts){if(cs.some(([x,yy,rm])=>Math.hypot(p[0]-x,p[1]-yy)<rm+sz*.9)){if(cur.length>1)o.push(...clip(cur));cur=[]}else cur.push(p)}if(cur.length>1)o.push(...clip(cur))}return{lanes:o}},
 'Zigzag':(sz,R)=>{const o=[],A=20+R()*70,per=80+R()*200;for(let y=70;y<PH-90;y+=sz*1.3){const pts=[];for(let x=BOX[0];x<=BOX[2];x+=4){const t=((x/per)%1+1)%1;pts.push([x,y+A*(t<.5?t*4-1:3-t*4)])}o.push(...clip(pts))}return{lanes:o}},
 'Columns':(sz,R)=>{const o=[],cols=12,cw=(BOX[2]-BOX[0])/cols;let left=[];let c=0;while(c<cols){const span=2+Math.floor(R()*4);if(c+span>cols)break;left.push([c,span]);c+=span+(R()<.4?1:0)}
   left.forEach(([c0,span],i)=>{const x0=BOX[0]+c0*cw,x1=x0+span*cw-14,y0=BOX[1]+R()*500;for(let y=y0+sz;y<BOX[3];y+=sz*1.3)o.push(...clip(sampleLine(x0,y,x1,y,8),30))});return{lanes:o}},
 'Steps':(sz,R)=>{const o=[];let y=BOX[1]+sz,x=BOX[0],w=380+R()*200,dir=1;while(y<BOX[3]){o.push(...clip(sampleLine(x,y,x+w,y,8),30));y+=sz*1.3;x+=dir*(10+R()*26);if(x+w>BOX[2]||x<BOX[0]){dir*=-1;x=Math.max(BOX[0],Math.min(BOX[2]-w,x))}}return{lanes:o}}};
function build(name,seed){const R=rng(seed);let lanes;
  if(name==='Book'){lanes=LAYOUTS.Book().lanes}
  else{const style=Math.floor(R()*3);let sz=40;for(;sz>=13;sz-=2){const r2=rng(seed+sz);const {lanes:ls}=LAYOUTS[name](sz,r2);ls.forEach(l=>l.g=[]);
      const ok=fill(ls,(li,L)=>style===0?SER(sz):style===1?SAN(sz*.92):(li%5<2?SER(sz):SAN(sz*.92)),STREAM,6);lanes=ls;if(ok)break}
    lanes=lanes.filter(l=>l.g.length)}
  footer(lanes);LANES=lanes;LNAME=name;document.getElementById('lname').textContent=name.toUpperCase();dirty=true}
let SEED=1;function shuffle(){const names=Object.keys(LAYOUTS).filter(n=>n!==LNAME&&n!=='Book');SEED=(Math.random()*1e9)|0;build(names[Math.floor(Math.random()*names.length)],SEED)}
/* ---------- card ---------- */
const CL=262,CS=165;
let card={x:PW*.74,y:PH*.36,a:-0.35,down:false};
function toPage(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/scale,(e.clientY-r.top)/scale]}
const GAP=.9;
function sweep(px,py,ux,uy){const cu=Math.cos(card.a),su=Math.sin(card.a),hd=CS/2,hl=CL/2,R=Math.hypot(hd,hl)+4;
  const inside=(x,y)=>{const rx=x-px,ry=y-py,a=rx*cu+ry*su,b=-rx*su+ry*cu;return a>-hd&&a<hd+2&&b>-hl&&b<hl};
  for(const L of LANES){const bb=L.bb;if(px+R<bb[0]-40||px-R>bb[2]+40||py+R<bb[1]-40||py-R>bb[3]+40)continue;const g=L.g;let hit=false;
    for(let i=0;i<g.length;i++){const o=g[i],m=o.s+o.w/2,[x,y,an]=at(L,m),nx=Math.sin(an),ny=-Math.cos(an),qx=x+nx*o.sz*.32,qy=y+ny*o.sz*.32;if(!inside(qx,qy))continue;hit=true;
      const d=ux*Math.cos(an)+uy*Math.sin(an);let sF=m,sB=m;while(sF<L.len){sF+=4;const [a1,b1,c1]=at(L,sF);if(!inside(a1+Math.sin(c1)*o.sz*.32,b1-Math.cos(c1)*o.sz*.32))break}
      while(sB>0){sB-=4;const [a1,b1,c1]=at(L,sB);if(!inside(a1+Math.sin(c1)*o.sz*.32,b1-Math.cos(c1)*o.sz*.32))break}
      const fwd=d>.35?true:d<-.35?false:(sF-m)<(m-sB);o.s=fwd?sF:sB-o.w;o.side=fwd?1:-1}
    if(!hit)continue;
    for(let i=0;i<g.length-1;i++){const mn=g[i].s+g[i].w*GAP;if(g[i+1].s<mn)g[i+1].s=mn}
    for(let i=g.length-1;i>0;i--){const mn=g[i].s-g[i-1].w*GAP;if(g[i-1].s>mn)g[i-1].s=mn}
    const last=g[g.length-1];if(last.s+last.w>L.len){last.s=L.len-last.w;for(let i=g.length-2;i>=0;i--){const mx=g[i+1].s-g[i].w*.62;if(g[i].s>mx)g[i].s=mx;else break}}
    if(g[0].s<0){g[0].s=0;for(let i=1;i<g.length;i++){const mn=g[i-1].s+g[i-1].w*.62;if(g[i].s<mn)g[i].s=mn;else break}}}}
function step(nx,ny){const dx=nx-card.x,dy=ny-card.y,L=Math.hypot(dx,dy);if(L<.01)return;
  const n=Math.ceil(L/8);for(let i=1;i<=n;i++){const px=card.x+dx*i/n,py=card.y+dy*i/n,target=Math.atan2(dy,dx);let da=target-card.a;while(da>Math.PI)da-=2*Math.PI;while(da<-Math.PI)da+=2*Math.PI;card.a+=da*.2;sweep(px,py,dx/L,dy/L)}
  card.x=nx;card.y=ny;dirty=true}
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);const [x,y]=toPage(e);card.x=x;card.y=y;card.down=true;hideHint();dirty=true});
cv.addEventListener('pointermove',e=>{const [x,y]=toPage(e);if(card.down)step(x,y);else{card.x=x;card.y=y;dirty=true}});
const up=()=>{card.down=false;dirty=true};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',e=>{e.preventDefault();card.a+=e.deltaY*.004;dirty=true},{passive:false});
let hinted=false;function hideHint(){if(hinted)return;hinted=true;const h=document.getElementById('hint');h.style.transition='opacity .6s';h.style.opacity=0}
function reset(){const from=LANES.map(L=>L.g.map(o=>o.s)),t0=performance.now();const f=t=>{const k=Math.min(1,(t-t0)/900),e=1-Math.pow(1-k,3);LANES.forEach((L,li)=>L.g.forEach((o,i)=>o.s=from[li][i]+(o.hs-from[li][i])*e));dirty=true;if(k<1)requestAnimationFrame(f)};requestAnimationFrame(f)}
document.getElementById('reset').onclick=reset;document.getElementById('shuffle').onclick=shuffle;document.getElementById('book').onclick=()=>build('Book',1);
addEventListener('keydown',e=>{if(e.key==='r'||e.key==='R')reset();if(e.key==='s'||e.key==='S')shuffle()});
/* ---------- render ---------- */
function roundRect(x,y,w,h,r){cx.beginPath();cx.moveTo(x+r,y);cx.arcTo(x+w,y,x+w,y+h,r);cx.arcTo(x+w,y+h,x,y+h,r);cx.arcTo(x,y+h,x,y,r);cx.arcTo(x,y,x+w,y,r);cx.closePath()}
function drawCard(){const lift=card.down?0:1;cx.save();cx.translate(card.x,card.y);cx.rotate(card.a+Math.PI/2);
  cx.save();cx.translate(lift?10:3,lift?14:4);cx.fillStyle='rgba(40,50,30,'+(lift?.16:.22)+')';cx.filter=`blur(${lift?10:4}px)`;roundRect(-CL/2,-CS/2,CL,CS,12);cx.fill();cx.restore();
  cx.fillStyle=INK;roundRect(-CL/2,-CS/2,CL,CS,12);cx.fill();
  cx.fillStyle='#d9d8c2';roundRect(-CL/2+26,-CS/2+50,38,30,5);cx.fill();cx.strokeStyle=INK;cx.lineWidth=1.2;cx.beginPath();cx.moveTo(-CL/2+26,-CS/2+65);cx.lineTo(-CL/2+64,-CS/2+65);cx.moveTo(-CL/2+45,-CS/2+50);cx.lineTo(-CL/2+45,-CS/2+80);cx.stroke();
  cx.fillStyle=PAPER;cx.font=`15px ${SANS}`;cx.fillText('0000  0000  0000  0000',-CL/2+26,-CS/2+112);
  cx.font=`10px ${SANS}`;cx.fillText('VALID THRU  12/30',-CL/2+26,-CS/2+134);cx.font=`italic 17px ${SERIF}`;cx.fillText('Scrape',CL/2-74,-CS/2+30);
  cx.strokeStyle=PAPER;cx.lineWidth=1.4;for(let i=0;i<3;i++){cx.beginPath();cx.arc(CL/2-34,-CS/2+66,6+i*5,-0.7,0.7);cx.stroke()}
  cx.restore()}
function render(){
  if(dirty){dirty=false;
    cx.setTransform(dpr*scale,0,0,dpr*scale,0,0);cx.fillStyle=PAPER;cx.fillRect(0,0,PW,PH);
    cx.fillStyle=INK;cx.textBaseline='alphabetic';let f='';
    for(const L of LANES){const flat=Math.abs(L.P[0][1]-L.P[L.P.length-1][1])<.01&&L.P.length<=2;
      for(const o of L.g){if(o.sp)continue;if(o.f!==f){cx.font=o.f;f=o.f}
        if(flat){cx.fillText(o.ch,L.P[0][0]+o.s,L.P[0][1])}else{const [x,y,an]=at(L,o.s+o.w/2);cx.save();cx.translate(x,y);cx.rotate(an);cx.fillText(o.ch,-o.w/2,0);cx.restore()}}}
    drawCard()}
  requestAnimationFrame(render)}
function fit(){const vw=innerWidth,vh=innerHeight-44;scale=Math.min(vw/PW,vh/PH);dpr=Math.min(2,devicePixelRatio||1);
  cv.width=Math.round(PW*scale*dpr);cv.height=Math.round(PH*scale*dpr);cv.style.width=PW*scale+'px';cv.style.height=PH*scale+'px';dirty=true}
addEventListener('resize',fit);
Promise.all([document.fonts.load(`22px "NR"`),document.fonts.load(`22px "IT"`)]).catch(()=>{}).then(()=>{fit();
  const m=location.hash.match(/layout=(\w+)/);build(m&&LAYOUTS[m[1]]?m[1]:'Book',+(location.hash.match(/seed=(\d+)/)||[0,7])[1]);
  if(location.hash.includes('demo')){card.down=true;let x=470,y=110;card.x=x;card.y=y;card.a=Math.PI/2;for(let i=0;i<120;i++){x=470+Math.sin(i/14)*120;y+=7.5;step(x,y)}card.down=false;card.x=x+260;card.y=y-500}
  render()});
</script></body></html>
