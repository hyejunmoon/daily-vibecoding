<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teru Teru Bozu</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;color:#cfc8b8;font:13px/1.4 -apple-system,"Apple SD Gothic Neo",system-ui,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;display:block}
#drop{position:fixed;inset:0;display:none;place-items:center;background:rgba(0,0,0,.55);color:#f2ead8;font-size:15px;letter-spacing:.04em;border:2px dashed #6b6556;margin:18px;border-radius:14px}
body.over #drop{display:grid}
#up{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:none;border:1px solid #3a372f;color:#9d968a;border-radius:20px;padding:8px 18px;font:inherit;cursor:pointer;transition:.2s}
body.sun #up{background:rgba(255,255,255,.75);border-color:#fff;color:#2c5f9e}
#up:hover{color:#f2ead8;border-color:#7a7362}
</style></head><body>
<canvas id="gl"></canvas><canvas id="rain"></canvas>
<button id="up">얼굴 사진 올리기</button><input type="file" id="file" accept="image/*" hidden>
<div id="drop">여기에 놓으면 얼굴이 돼요</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

const PIX = 3; // render at 1/3 size, then scale up with hard pixels
const glC = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas: glC, antialias: false, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.setClearColor(0x000000, 1);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, 1, .1, 100);
camera.position.set(0, .35, 9.6); camera.lookAt(0, -.7, 0);

let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const jitter = (g, a) => { const p = g.attributes.position; for (let i = 0; i < p.count; i++) p.setXYZ(i, p.getX(i) + (rnd() - .5) * a, p.getY(i) + (rnd() - .5) * a, p.getZ(i) + (rnd() - .5) * a); };
function faceShade(g, amt) { const n = g.attributes.position.count, c = new Float32Array(n * 3);
  for (let f = 0; f < n; f += 3) { const v = 1 - rnd() * amt; for (let k = 0; k < 3; k++) c.set([v, v, v * .98], (f + k) * 3); }
  g.setAttribute('color', new THREE.BufferAttribute(c, 3)); }

/* paper: off-white with coarse grain (it survives the pixel upscale) */
function paperCanvas() { const c = document.createElement('canvas'); c.width = c.height = 256; const x = c.getContext('2d');
  x.fillStyle = '#f4efe4'; x.fillRect(0, 0, 256, 256); const im = x.getImageData(0, 0, 256, 256), d = im.data;
  for (let i = 0; i < d.length; i += 4) { const n = (Math.random() - .5) * 34; d[i] += n; d[i + 1] += n; d[i + 2] += n * .9; }
  x.putImageData(im, 0, 0); return c; }
const paper = paperCanvas();
const paperTex = new THREE.CanvasTexture(paper); paperTex.colorSpace = THREE.SRGBColorSpace; paperTex.magFilter = THREE.NearestFilter;
const mat = new THREE.MeshStandardMaterial({ map: paperTex, roughness: .95, flatShading: true, vertexColors: true });

/* head: chunky lat-long sphere (10 x 7). widthSegments is even, so a ring of edges
   lies exactly on z = 0 and the head splits into a true front half and back half */
let hg = new THREE.SphereGeometry(1, 10, 7); hg.deleteAttribute('uv'); hg.deleteAttribute('normal');
hg = mergeVertices(hg);
{ const p = hg.attributes.position; for (let i = 0; i < p.count; i++) { const k = 1 + (rnd() - .5) * .09; p.setXYZ(i, p.getX(i) * k, p.getY(i) * k, p.getZ(i) * k); } } // radial only: z = 0 stays z = 0
hg = hg.toNonIndexed();
{ // spherical (Rhino-style) mapping per half: longitude -90..90 and latitude -90..90 fill the whole image
  const p = hg.attributes.position, uv = new Float32Array(p.count * 2);
  const lonLat = (x, y, z, back) => [back ? Math.atan2(-x, -z) : Math.atan2(x, z), Math.asin(Math.max(-1, Math.min(1, y / Math.hypot(x, y, z))))];
  for (let f = 0; f < p.count; f += 3) {
    let cx = 0, cy = 0, cz = 0; for (let k = 0; k < 3; k++) { cx += p.getX(f + k); cy += p.getY(f + k); cz += p.getZ(f + k); }
    const back = cz < 0, [clon] = lonLat(cx, cy, cz, back);
    for (let k = 0; k < 3; k++) { const x = p.getX(f + k), y = p.getY(f + k), z = p.getZ(f + k);
      let [lon, lat] = lonLat(x, y, z, back);
      if (Math.hypot(x, z) < 1e-4) lon = clon;                      // pole vertex: borrow the face's longitude
      if (Math.abs(z) < 1e-4) lon = Math.sign(clon || 1) * Math.PI / 2; // seam vertex: pin to the edge of this half
      uv[(f + k) * 2] = .5 + lon / Math.PI; uv[(f + k) * 2 + 1] = .5 + lat / Math.PI; } }
  hg.setAttribute('uv', new THREE.BufferAttribute(uv, 2)); hg.computeVertexNormals(); faceShade(hg, .12); }
const faceC = document.createElement('canvas'); faceC.width = faceC.height = 1024;
const faceTex = new THREE.CanvasTexture(faceC); faceTex.colorSpace = THREE.SRGBColorSpace; faceTex.anisotropy = 4;
const faceMat = new THREE.MeshStandardMaterial({ map: faceTex, roughness: .95, flatShading: true, vertexColors: true });
const head = new THREE.Mesh(hg, faceMat);

/* cloth: 8-sided skirt, 3 rings, zig-zag hem */
const prof = [[.3, -.9], [.52, -1.4], [.92, -2.0], [1.3, -2.5]].map(([r, y]) => new THREE.Vector2(r, y));
let cg = new THREE.LatheGeometry(prof, 10);
{ const p = cg.attributes.position; for (let i = 0; i < p.count; i++) { const x = p.getX(i), y = p.getY(i), z = p.getZ(i), th = Math.atan2(z, x);
    const k = Math.round(((th + Math.PI) / (Math.PI * 2)) * 10) % 2; if (y < -2.45) p.setY(i, y + (k ? .34 : 0)); } }
cg.deleteAttribute("uv"); cg.deleteAttribute("normal"); cg = mergeVertices(cg); jitter(cg, .06); cg = cg.toNonIndexed(); cg.computeVertexNormals(); faceShade(cg, .18);
const cmat = mat.clone(); cmat.side = THREE.DoubleSide; const cloth = new THREE.Mesh(cg, cmat); cloth.rotation.y = Math.PI / 10;

const red = new THREE.MeshStandardMaterial({ color: '#d2473a', roughness: .9, flatShading: true });
const tie = new THREE.Mesh(new THREE.TorusGeometry(.34, .075, 3, 8), red); tie.rotation.x = Math.PI / 2; tie.position.y = -1.0;
const bowL = new THREE.Mesh(new THREE.ConeGeometry(.14, .32, 3), red); bowL.position.set(-.2, -1.0, .36); bowL.rotation.z = Math.PI / 2;
const bowR = bowL.clone(); bowR.position.x = .18; bowR.rotation.z = -Math.PI / 2;
const str = new THREE.Mesh(new THREE.CylinderGeometry(.025, .025, 4, 3), new THREE.MeshStandardMaterial({ color: '#b9b09c', flatShading: true })); str.position.y = 2.9;

const doll = new THREE.Group(); doll.add(head, cloth, tie, bowL, bowR, str); scene.add(doll);

/* lights like the apple: warm key from upper left, red-orange bounce, dark everywhere else */
const amb = new THREE.AmbientLight('#2a1d1a', 1); scene.add(amb);
const key = new THREE.DirectionalLight('#ffe2b5', 3.2); key.position.set(-4, 5, 5); scene.add(key);
const bounce = new THREE.PointLight('#ff6a3a', 9, 8, 1.6); bounce.position.set(2.6, -1.4, 2.4); scene.add(bounce);
const rim = new THREE.DirectionalLight('#8aa6ff', 1.4); rim.position.set(3, 2, -4); scene.add(rim);

/* sunny world: low-poly sky, sun, clouds and a rainbow behind the doll, faded in when the rain stops */
const sunny = new THREE.Group(); sunny.visible = false; scene.add(sunny);
const fadeMats = [];
const basic = (opts) => { const m = new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, ...opts }); fadeMats.push(m); return m; };
{ let sky = new THREE.PlaneGeometry(44, 26, 11, 7); const p = sky.attributes.position;
  for (let i = 0; i < p.count; i++) { const x = p.getX(i), y = p.getY(i); if (Math.abs(x) < 21.9 && Math.abs(y) < 12.9) p.setXY(i, x + (rnd() - .5) * 2.4, y + (rnd() - .5) * 2.2); }
  sky = sky.toNonIndexed(); const q = sky.attributes.position, col = new Float32Array(q.count * 3), top = new THREE.Color('#2f86f2'), low = new THREE.Color('#a9dcff'), c = new THREE.Color();
  for (let f = 0; f < q.count; f += 3) { const y = (q.getY(f) + q.getY(f + 1) + q.getY(f + 2)) / 3; c.copy(low).lerp(top, Math.min(1, Math.max(0, (y + 6) / 16))).offsetHSL(0, 0, (rnd() - .5) * .06);
    for (let k = 0; k < 3; k++) col.set([c.r, c.g, c.b], (f + k) * 3); }
  sky.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const m = new THREE.Mesh(sky, basic({ vertexColors: true })); m.position.z = -9; sunny.add(m); }
const sun = new THREE.Mesh(new THREE.IcosahedronGeometry(1.1, 0), basic({ color: '#ffd23f' })); sun.position.set(-4.1, 2.5, -6.5); sunny.add(sun);
const sunRing = new THREE.Mesh(new THREE.RingGeometry(1.5, 1.85, 8), basic({ color: '#ffe78a' })); sunRing.position.copy(sun.position); sunny.add(sunRing);
const rainbow = [];
['#e8463c', '#f28a2e', '#f6cf3a', '#5cc45a', '#3f8fe0', '#4b5bc9', '#8a55c4'].forEach((col, i) => {
  const r = 5.6 - i * .32, g = new THREE.RingGeometry(r - .32, r, 12, 1, 0, Math.PI); const m = new THREE.Mesh(g, basic({ color: col, side: THREE.DoubleSide }));
  m.position.set(1.2, -3.2, -7.5); m.userData.full = g.index.count; g.setDrawRange(0, 0); sunny.add(m); rainbow.push(m); });
const cloudMat = new THREE.MeshLambertMaterial({ color: '#ffffff', flatShading: true, transparent: true, opacity: 0 }); fadeMats.push(cloudMat);
[[3.8, 2.6, -6], [-6.4, .4, -7], [5.6, -.4, -7.2]].forEach(([x, y, z], i) => { const g = new THREE.Group();
  [[0, 0, .75], [.8, -.1, .55], [-.75, -.15, .5], [.3, .35, .5]].forEach(([dx, dy, r]) => { const b = new THREE.Mesh(new THREE.IcosahedronGeometry(r, 0), cloudMat); b.position.set(dx, dy, 0); b.rotation.set(rnd() * 3, rnd() * 3, 0); g.add(b); });
  g.position.set(x, y, z); g.scale.setScalar(1 - i * .12); sunny.add(g); });
let sunT = -1; // seconds since the rain stopped; -1 = still raining
function clearUp() { if (sunT >= 0) return; sunT = 0; sunny.visible = true; raining = false; document.body.classList.add('sun'); }
function sunnyStep(dt) {
  if (sunT < 0) return; sunT += dt; const a = Math.min(1, sunT / 2.2);
  fadeMats.forEach(m => m.opacity = a);
  rainbow.forEach((m, i) => { const t = Math.min(1, Math.max(0, (sunT - 1.2 - i * .08) / 1.6)); m.geometry.setDrawRange(0, Math.floor(m.userData.full * t / 6) * 6); });
  sun.rotation.y += dt * .4; sun.rotation.x += dt * .25; sunRing.rotation.z -= dt * .3;
  amb.color.lerpColors(new THREE.Color('#2a1d1a'), new THREE.Color('#bcd6ff'), a); amb.intensity = 1 + a * .15;
  key.color.lerpColors(new THREE.Color('#ffe2b5'), new THREE.Color('#fff6dc'), a); key.intensity = 3.2 - a * .7;
  bounce.color.lerpColors(new THREE.Color('#ff6a3a'), new THREE.Color('#ffd27a'), a);
}

/* face: cut the subject out of its background, crop to it, stretch it over each half */
let photo = null;
function cutout(img) {
  const M = 640, sc = Math.min(1, M / Math.max(img.width, img.height)), w = Math.round(img.width * sc), h = Math.round(img.height * sc);
  const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'); x.drawImage(img, 0, 0, w, h);
  const im = x.getImageData(0, 0, w, h), d = im.data, N = w * h, fg = new Uint8Array(N).fill(1);
  const border = []; for (let i = 0; i < w; i++) border.push(i, (h - 1) * w + i); for (let j = 0; j < h; j++) border.push(j * w, j * w + w - 1);
  const hasAlpha = border.some(i => d[i * 4 + 3] < 200);
  if (hasAlpha) { for (let i = 0; i < N; i++) fg[i] = d[i * 4 + 3] > 40 ? 1 : 0; }
  else { // flood the background in from the edges: neighbours that look like the edge colour
    let r = 0, g = 0, b = 0; for (const i of border) { r += d[i * 4]; g += d[i * 4 + 1]; b += d[i * 4 + 2]; } r /= border.length; g /= border.length; b /= border.length;
    const dist = (i, j) => { const dr = d[i * 4] - d[j * 4], dg = d[i * 4 + 1] - d[j * 4 + 1], db = d[i * 4 + 2] - d[j * 4 + 2]; return dr * dr + dg * dg + db * db; };
    const near = (i, from) => { const dr = d[i * 4] - r, dg = d[i * 4 + 1] - g, db = d[i * 4 + 2] - b, far = dr * dr + dg * dg + db * db; return from < 0 ? far < 40 * 40 : (dist(i, from) < 12 * 12 && far < 95 * 95) || far < 30 * 30; };
    const q = new Int32Array(N); let qh = 0, qt = 0;
    for (const i of border) if (fg[i] && near(i, -1)) { fg[i] = 0; q[qt++] = i; }
    while (qh < qt) { const i = q[qh++], px = i % w, py = (i / w) | 0;
      for (const n of [px > 0 ? i - 1 : -1, px < w - 1 ? i + 1 : -1, py > 0 ? i - w : -1, py < h - 1 ? i + w : -1])
        if (n >= 0 && fg[n] && near(n, i)) { fg[n] = 0; q[qt++] = n; } } }
  let x0 = w, y0 = h, x1 = 0, y1 = 0;
  for (let i = 0; i < N; i++) { d[i * 4 + 3] = fg[i] ? d[i * 4 + 3] : 0; if (fg[i]) { const px = i % w, py = (i / w) | 0; if (px < x0) x0 = px; if (px > x1) x1 = px; if (py < y0) y0 = py; if (py > y1) y1 = py; } }
  x.putImageData(im, 0, 0);
  if (x1 <= x0 || y1 <= y0) return c;                     // nothing found: use it whole
  const o = document.createElement('canvas'); o.width = x1 - x0 + 1; o.height = y1 - y0 + 1;
  o.getContext('2d').drawImage(c, x0, y0, o.width, o.height, 0, 0, o.width, o.height); return o;
}
function drawFace() { const x = faceC.getContext('2d'), S = 1024; x.drawImage(paper, 0, 0, S, S);
  if (photo) { x.drawImage(photo, 0, 0, S, S);             // fill the whole texture: each half is covered edge to edge
    x.globalCompositeOperation = 'multiply'; x.drawImage(paper, 0, 0, S, S); x.globalCompositeOperation = 'source-over'; }
  faceTex.needsUpdate = true; }
drawFace();
/* people: MediaPipe multiclass selfie segmenter keeps hair + face skin (+ glasses), drops body, clothes, background */
let segP = null;
function segmenter() {
  if (!segP) segP = (async () => {
    const v = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14');
    const fs = await v.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
    return v.ImageSegmenter.createFromOptions(fs, { baseOptions: { modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_multiclass_256x256/float32/1/selfie_multiclass_256x256.tflite', delegate: 'CPU' }, runningMode: 'IMAGE', outputCategoryMask: true, outputConfidenceMasks: false });
  })();
  return segP;
}
async function faceCut(img) {
  const M = 640, sc = Math.min(1, M / Math.max(img.width, img.height)), w = Math.round(img.width * sc), h = Math.round(img.height * sc);
  const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'); x.drawImage(img, 0, 0, w, h);
  const seg = await segmenter(); const res = seg.segment(c); const mask = res.categoryMask.getAsUint8Array(); res.close && res.close();
  let face = 0; for (let i = 0; i < mask.length; i++) if (mask[i] === 3) face++;
  if (face < mask.length * .01) return null;                       // no face here: not a person photo
  const im = x.getImageData(0, 0, w, h), d = im.data; let x0 = w, y0 = h, x1 = 0, y1 = 0;
  for (let i = 0; i < mask.length; i++) { const k = mask[i], keep = k === 1 || k === 3 || k === 5; d[i * 4 + 3] = keep ? 255 : 0;
    if (keep) { const px = i % w, py = (i / w) | 0; if (px < x0) x0 = px; if (px > x1) x1 = px; if (py < y0) y0 = py; if (py > y1) y1 = py; } }
  x.putImageData(im, 0, 0);
  const o = document.createElement('canvas'); o.width = x1 - x0 + 1; o.height = y1 - y0 + 1; const ox = o.getContext('2d');
  ox.filter = 'blur(.6px)'; ox.drawImage(c, x0, y0, o.width, o.height, 0, 0, o.width, o.height); return o;
}
const upBtn = document.getElementById('up');
async function setPhoto(im) {
  upBtn.textContent = '얼굴 찾는 중…'; upBtn.disabled = true;
  let cut = null; try { cut = await faceCut(im); } catch (e) { console.warn('segmenter unavailable', e); }
  photo = cut || cutout(im); drawFace(); clearUp();
  upBtn.textContent = '다른 사진 올리기'; upBtn.disabled = false;
}
function load(f) { if (!f || !f.type.startsWith('image/')) return; const u = URL.createObjectURL(f), im = new Image(); im.onload = () => setPhoto(im); im.src = u; }
const file = document.getElementById('file'); document.getElementById('up').onclick = () => file.click(); file.onchange = () => load(file.files[0]);
addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('over'); });
addEventListener('dragleave', e => { if (!e.relatedTarget) document.body.classList.remove('over'); });
addEventListener('drop', e => { e.preventDefault(); document.body.classList.remove('over'); load(e.dataTransfer.files[0]); });

/* rain at 30 degrees, drawn on the same coarse pixel grid */
const rC = document.getElementById('rain'), rx = rC.getContext('2d'); let drops = [], raining = true;
const SL = Math.tan(30 * Math.PI / 180);
function rain() { const w = rC.width, h = rC.height; rx.clearRect(0, 0, w, h);
  while (raining && drops.length < w * h / 900) drops.push({ x: Math.random() * (w + h * SL), y: Math.random() * h, v: 3 + Math.random() * 2.5, l: 4 + Math.random() * 5 | 0 });
  rx.fillStyle = 'rgba(150,170,210,.45)';
  for (const d of drops) { d.y += d.v; d.x -= d.v * SL; if (d.y > h) { if (raining) { d.y = -10; d.x = Math.random() * (w + h * SL); } else d.dead = 1; }
    for (let i = 0; i < d.l; i++) rx.fillRect(Math.round(d.x + i * SL), Math.round(d.y - i), 1, 1); } }

function size() { const w = Math.ceil(innerWidth / PIX), h = Math.ceil(innerHeight / PIX); renderer.setSize(w, h, false); camera.aspect = w / h; camera.position.z = 9.6 / Math.min(1, camera.aspect * 1.25); camera.updateProjectionMatrix(); rC.width = w; rC.height = h; }
addEventListener('resize', size); size();
let last = performance.now(); const STILL = location.hash.includes('still');
renderer.setAnimationLoop(now => { const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (!STILL) doll.rotation.y += dt * (Math.PI * 2 / 24);            // one turn every 24 s
  doll.rotation.z = Math.sin(now / 1400) * .03;          // a little sway on the string
  sunnyStep(dt); renderer.render(scene, camera); rain(); drops = drops.filter(d => !d.dead); });

if (location.hash.includes('sunny')) { clearUp(); sunT = 10; }
if (location.hash.includes('demo')) { const im = new Image(); im.onload = () => setPhoto(im); im.src = window.DEMO_FACE; }
const m = location.hash.match(/rot=(-?[\d.]+)/); if (m) { doll.rotation.y = +m[1] * Math.PI / 180; }
</script>
</body></html>
