body{display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:Felipa,"Apple SD Gothic Neo",serif}

</style></head><body>
<svg id="s" viewBox="0 0 520 760" font-family="Felipa, Apple SD Gothic Neo, serif">
  <rect width="520" height="760" fill="#ffffff"/>
  <g id="grid"></g><g id="hdr"></g><g id="con"></g><g id="guide"></g><g id="art"></g><g id="pen"></g><g id="hud" font-family="DM Mono, Menlo, monospace"></g><g id="ui"></g><g id="txt"></g>
</svg>
<script>
const INK='#161616',CON="#b4b4b4",YOLK="#d4d4d4",RED="#8c8c8c",GRIDC="#ededed";
const q=Math.SQRT2,TAU=Math.PI*2,NS='http://www.w3.org/2000/svg';
const EGGS=[
 {k:"Ostrich",en:'OSTRICH EGG',r:128,fill:"#ffffff",pat:"pore",pc:"#9a9a9a",time:9,tol:16},
 {k:"Duck",en:'DUCK EGG',r:104,fill:"#e4e4e4",pat:null,time:7.5,tol:14},
 {k:"Chicken",en:'CHICKEN EGG',r:84,fill:"#bdbdbd",pat:null,time:6,tol:12},
 {k:"Quail",en:'QUAIL EGG',r:64,fill:"#ffffff",pat:"blot",pc:"#161616",time:5,tol:10}];
const N=EGGS.length;
const $=id=>document.getElementById(id),S=$('s');
const el=(t,a={},p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e};
const html=(g,s)=>{g.innerHTML=s};
(()=>{let s='';for(let x=0;x<=520;x+=26)s+=`<line x1="${x}" y1="0" x2="${x}" y2="760" stroke="${GRIDC}"/>`;for(let y=0;y<=760;y+=26)s+=`<line x1="0" y1="${y}" x2="520" y2="${y}" stroke="${GRIDC}"/>`;html($('grid'),s)})();

function geo(i){const r=EGGS[i].r,cx=260,cy=600-r;return{r,cx,cy}}
function eggPath(r,cx,cy){const p1x=cx+(q-1)*r,p2x=cx-(q-1)*r,py=cy-q*r,rc=(2-q)*r;
  return `M${cx-r} ${cy}A${r} ${r} 0 0 0 ${cx+r} ${cy}A${2*r} ${2*r} 0 0 0 ${p1x} ${py}A${rc} ${rc} 0 0 0 ${p2x} ${py}A${2*r} ${2*r} 0 0 0 ${cx-r} ${cy}Z`}
// outline samples, starting at the bottom point, going counter‑clockwise on screen
function samples(g){const {r,cx,cy}=g,P=[];g.segs=[];const arc=(c,R,a0,a1,n,nm)=>{g.segs.push({nm,c,R,s:P.length,e:P.length+n});for(let i=0;i<n;i++){const a=a0+(a1-a0)*i/n;P.push([c[0]+R*Math.cos(a),c[1]+R*Math.sin(a)])}};
  const L1=Math.PI/2*r,L2=Math.PI/4*2*r,L3=Math.PI/2*(2-q)*r,k=.5;
  arc([cx,cy],r,Math.PI/2,0,Math.round(L1*k),'ARC O');            // bottom → B
  arc([cx-r,cy],2*r,0,-Math.PI/4,Math.round(L2*k),'ARC A');        // B → P1
  arc([cx,cy-r],(2-q)*r,-Math.PI/4,-Math.PI*.75,Math.round(L3*k),'ARC C'); // top
  arc([cx+r,cy],2*r,-Math.PI*.75,-Math.PI,Math.round(L2*k),'ARC B'); // P2 → A
  arc([cx,cy],r,Math.PI,Math.PI/2,Math.round(L1*k),'ARC O');       // A → bottom
  g.len=2*L1+2*L2+L3;return P}
function construction(g){const {r,cx,cy}=g,A=[cx-r,cy],B=[cx+r,cy],C=[cx,cy-r],e=r*.9;
  const ln=(a,b,c,d)=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}"/>`;
  let s=`<g stroke="${CON}" stroke-width="1" fill="none"><circle cx="${cx}" cy="${cy}" r="${r}"/>${ln(A[0]-16,cy,B[0]+16,cy)}${ln(cx,cy+r+18,cx,cy-2*r-16)}
  ${ln(A[0]-12,cy+12,C[0]+e,C[1]-e)}${ln(B[0]+12,cy+12,C[0]-e,C[1]-e)}</g>`;
  [['A',A,-20,-8],['B',B,10,-8],['C',C,10,-8],['O',[cx,cy],8,18]].forEach(([t,p,dx,dy])=>s+=`<circle cx="${p[0]}" cy="${p[1]}" r="2.5" fill="${CON}"/><text x="${p[0]+dx}" y="${p[1]+dy}" font-size="15" fill="${CON}">${t}</text><text x="${p[0]+dx}" y="${p[1]+dy+13}" font-size="8.5" fill="${CON}" font-family="DM Mono, Menlo, monospace">(${(p[0]-cx).toFixed(1)}, ${(cy-p[1]).toFixed(1)})</text>`);
  return s}

let st={};
function header(){let s=`<text x="28" y="50" font-size="30" fill="${INK}">Eggshka</text>
  <text x="492" y="46" font-size="16" text-anchor="end" fill="${INK}">${String(Math.min(st.ei+1,N)).padStart(2,'0')} / ${String(N).padStart(2,'0')}</text>`;
  let x=30;EGGS.forEach((E,i)=>{const r=7+(N-1-i)*2.4,cx=x+r,cy=84,done=i<st.ei||st.phase==='final';
    s+=`<path d="${eggPath(r,cx,cy+r*.45)}" fill="${done?E.fill:'none'}" stroke="${INK}" stroke-width="${i===st.ei&&st.phase!=='final'?2:1}" ${(!done&&i!==st.ei)?'stroke-dasharray="2 2"':''}/>`;
    if(i<N-1)s+=`<line x1="${cx+r+6}" y1="${cy}" x2="${cx+r+18}" y2="${cy}" stroke="${CON}"/>`;x+=r*2+26});
  html($('hdr'),s)}
function text(a,b,c){html($('txt'),`<text x="28" y="668" font-size="15" fill="#8a8a8a" letter-spacing="2">${a}</text>
  <text x="28" y="698" font-size="22" fill="${INK}">${b}</text><text x="28" y="724" font-size="15" fill="${INK}">${c||''}</text>`)}
function timer(left,tot){const w=464*Math.max(0,left/tot),c=left/tot<.3?RED:INK;
  html($('ui'),`<text x="492" y="90" font-size="20" text-anchor="end" fill="${c}" font-variant-numeric="tabular-nums">${Math.max(0,left).toFixed(1)}s</text>
  <rect x="28" y="738" width="464" height="4" fill="none" stroke="${INK}"/><rect x="28" y="738" width="${w}" height="4" fill="${c}"/>
  <rect x="28" y="746" width="464" height="2" fill="#e8e8e8"/><rect x="28" y="746" width="${464*st.pos/st.P.length}" height="2" fill="${YOLK}"/>`)}

function startEgg(i){Object.assign(st,{ei:i,g:geo(i),phase:'ready',pos:0,dir:0,drawing:false,t0:0,stroke:[]});
  st.P=samples(st.g);const E=EGGS[i];
  ['art','pen','ui'].forEach(k=>html($(k),''));$('con').style.opacity=1;$('guide').style.opacity=1;
  html($('con'),construction(st.g));
  html($('guide'),`<path d="${eggPath(st.g.r,st.g.cx,st.g.cy)}" fill="none" stroke="${YOLK}" stroke-opacity=".25" stroke-width="${E.tol*2}" stroke-linejoin="round"/>
   <path d="${eggPath(st.g.r,st.g.cx,st.g.cy)}" fill="none" stroke="${INK}" stroke-width="1.2" stroke-dasharray="3 5"/>
   <circle class="pulse" cx="${st.P[0][0]}" cy="${st.P[0][1]}" r="13" fill="${YOLK}"/><circle cx="${st.P[0][0]}" cy="${st.P[0][1]}" r="4" fill="${INK}"/>`);
  header();timer(E.time,E.time);
  text(`EGG ${st.ei+1} · ${E.en}`,"Press the dot and trace the egg.",`${E.time} seconds. Stay inside the grey band.`)}

const f2=v=>(v>=0?' ':'-')+Math.abs(v).toFixed(2).padStart(7,'0');
function hud(p){const g=st.g,E=EGGS[st.ei];if(!g||!p||!['ready','trace'].includes(st.phase)){html($('hud'),'');return}
  let bi=0,bd=1e9;st.P.forEach((s,i)=>{const d=(s[0]-p[0])**2+(s[1]-p[1])**2;if(d<bd){bd=d;bi=i}});const dv=Math.sqrt(bd);
  const sg=g.segs.find(o=>bi>=o.s&&bi<o.e)||g.segs[0],th=(Math.atan2(sg.c[1]-p[1],p[0]-sg.c[0])*180/Math.PI+360)%360;
  const x=p[0]-g.cx,y=g.cy-p[1],near=st.P[bi],warn=dv>E.tol*.75?INK:'#8a8a8a';
  const rows=[['X',f2(x)],['Y',f2(y)],['Δ',dv.toFixed(2).padStart(6,'0')+' / '+E.tol.toFixed(2)],['θ',th.toFixed(2).padStart(6,'0')+'°'],
    [sg.nm,'R '+sg.R.toFixed(2)],['LEN',(g.len*st.pos/st.P.length).toFixed(1).padStart(6,'0')+' / '+g.len.toFixed(1)],['T',(st.phase==='trace'?((performance.now()-st.t0)/1000):0).toFixed(3)]];
  let s=`<line x1="0" y1="${p[1]}" x2="520" y2="${p[1]}" stroke="#cfcfcf" stroke-width=".6" stroke-dasharray="2 3"/><line x1="${p[0]}" y1="0" x2="${p[0]}" y2="760" stroke="#cfcfcf" stroke-width=".6" stroke-dasharray="2 3"/>
   <text x="6" y="${p[1]-3}" font-size="8" fill="#9a9a9a">${y.toFixed(1)}</text><text x="${p[0]+3}" y="12" font-size="8" fill="#9a9a9a">${x.toFixed(1)}</text>
   <line x1="${p[0]}" y1="${p[1]}" x2="${near[0]}" y2="${near[1]}" stroke="${INK}" stroke-width=".8"/><circle cx="${near[0]}" cy="${near[1]}" r="2.2" fill="#fff" stroke="${INK}" stroke-width=".8"/>
   <line x1="${sg.c[0]}" y1="${sg.c[1]}" x2="${near[0]}" y2="${near[1]}" stroke="#bdbdbd" stroke-width=".6"/>
   <text x="${p[0]+12}" y="${p[1]+20}" font-size="9" fill="${INK}">${x.toFixed(2)}, ${y.toFixed(2)}</text><text x="${p[0]+12}" y="${p[1]+31}" font-size="8" fill="${warn}">Δ ${dv.toFixed(2)}</text>`;
  rows.forEach(([k,v],i)=>s+=`<text x="376" y="${120+i*13}" font-size="9" fill="#9a9a9a">${k}</text><text x="492" y="${120+i*13}" font-size="9" text-anchor="end" fill="${k==='Δ'?warn:INK}" xml:space="preserve">${v}</text>`);
  html($('hud'),s)}
let lastP=null;
function nearestAll(p){let best=1e9;for(const s of st.P){const d=(s[0]-p[0])**2+(s[1]-p[1])**2;if(d<best)best=d}return Math.sqrt(best)}
function advance(p){const M=st.P.length,at=k=>st.P[((k%M)+M)%M];
  const lo=st.dir?-12:-25,hi=25;let bo=0,bd=1e9;
  for(let o=lo;o<=hi;o++){const idx=st.dir?st.dir*(st.pos+o):(o),s=at(idx),d=(s[0]-p[0])**2+(s[1]-p[1])**2;if(d<bd){bd=d;bo=o}}
  if(!st.dir){if(Math.abs(bo)>=4){st.dir=Math.sign(bo);st.pos=Math.abs(bo)}return}
  if(bo>0)st.pos=Math.min(M,st.pos+bo)}

function penPath(){html($('pen'),`<polyline points="${st.stroke.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}" fill="none" stroke="${INK}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>`)}

let raf;function tick(){if(st.phase!=='trace')return;const E=EGGS[st.ei],left=E.time-(performance.now()-st.t0)/1000;timer(left,E.time);hud(lastP);
  if(left<=0){fail("Time's up!",`Finish the loop within ${E.time} seconds.`);return}raf=requestAnimationFrame(tick)}

async function fail(t,sub){st.phase='fail';html($('hud'),'');st.drawing=false;cancelAnimationFrame(raf);
  const pl=$('pen').querySelector('polyline');if(pl)pl.setAttribute('stroke',RED);
  failSound();
  await anim(300,k=>$('pen').setAttribute('transform',`translate(${Math.sin(k*Math.PI*6)*6*(1-k)} 0)`));
  text('FAIL',t,sub);
  const b=el('g',{style:'cursor:pointer'},$('txt'));b.innerHTML=`<rect x="392" y="676" width="100" height="34" fill="${INK}"/><text x="442" y="698" text-anchor="middle" font-size="14" fill="#fff">Try again</text>`;
  b.addEventListener('pointerdown',e=>{e.stopPropagation();startEgg(st.ei)})}

// ----- art -----
let uid=0;function rng(seed){let x=seed;return()=>(x=(x*9301+49297)%233280)/233280}
function eggArt(i,g){const e=EGGS[i],id='ec'+(++uid),d=eggPath(g.r,g.cx,g.cy);let pat='';const R=rng(7+i*13),r=g.r;
  const at=()=>{const a=R()*TAU,m=Math.sqrt(R());return[g.cx+Math.cos(a)*r*m,g.cy-r*.5+Math.sin(a)*r*m*1.5]};
  if(e.pat==='pore')for(let k=0;k<60;k++){const [x,y]=at();pat+=`<circle cx="${x}" cy="${y}" r="1.5" fill="${e.pc}"/>`}
  if(e.pat==='blot')for(let k=0;k<30;k++){const [x,y]=at(),w=r*(.05+R()*.12);pat+=`<ellipse cx="${x}" cy="${y}" rx="${w}" ry="${w*.6}" transform="rotate(${R()*180} ${x} ${y})" fill="${e.pc}"/>`}
  return `<defs><clipPath id="${id}"><path d="${d}"/></clipPath></defs><g clip-path="url(#${id})"><path d="${d}" fill="${e.fill}"/>${pat}
   </g><path d="${d}" fill="none" stroke="${INK}" stroke-width="2.4"/>`}
function anim(dur,fn){return new Promise(res=>{const t0=performance.now();const f=t=>{const k=Math.min(1,(t-t0)/dur);fn(k);k<1?requestAnimationFrame(f):res()};requestAnimationFrame(f)})}
const ease=k=>1-Math.pow(1-k,3);
let actx;function noise(dur,hp,gain,pow){try{actx=actx||new AudioContext();const n=actx.sampleRate*dur,b=actx.createBuffer(1,n,actx.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,pow);const s=actx.createBufferSource();s.buffer=b;const f=actx.createBiquadFilter();f.type='highpass';f.frequency.value=hp;
  const g=actx.createGain();g.gain.value=gain;s.connect(f).connect(g).connect(actx.destination);s.start()}catch(e){}}
function failSound(){try{actx=actx||new AudioContext();const o=actx.createOscillator(),g=actx.createGain();o.type='square';o.frequency.setValueAtTime(220,actx.currentTime);o.frequency.exponentialRampToValueAtTime(90,actx.currentTime+.35);
  g.gain.setValueAtTime(.08,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+.4);o.connect(g).connect(actx.destination);o.start();o.stop(actx.currentTime+.4)}catch(e){}}

async function success(){st.phase='anim';html($('hud'),'');cancelAnimationFrame(raf);const g=st.g,i=st.ei,left=EGGS[i].time-(performance.now()-st.t0)/1000;
  text(`${EGGS[i].en} · CLEAR`,`Done with ${left.toFixed(1)}s to spare.`,"");
  await anim(450,k=>{$('con').style.opacity=1-k;$('guide').style.opacity=1-k});
  const a=el('g',{},$('art'));a.innerHTML=eggArt(i,g);a.style.opacity=0;
  await anim(380,k=>{a.style.opacity=k;$('pen').style.opacity=1-k});html($('pen'),'');$('pen').style.opacity=1;html($('ui'),'');
  html($('art'),'');await openLid()}

function seamY(g){return g.cy-g.r*.3}
async function openLid(){const g=st.g,i=st.ei,r=g.r,y=seamY(g),id='c'+(++uid),d=eggPath(r,g.cx,g.cy);
  const W=g.cx-r*1.6,E=g.cx+r*1.6;
  const defs=el('defs',{},$('art'));defs.innerHTML=`<clipPath id="${id}t"><rect x="${W}" y="${g.cy-r*2.5}" width="${r*3.2}" height="${y-(g.cy-r*2.5)}"/></clipPath><clipPath id="${id}b"><rect x="${W}" y="${y}" width="${r*3.2}" height="${r*2}"/></clipPath><clipPath id="${id}e"><path d="${d}"/></clipPath>`;
  const last=i===N-1,ng=last?null:geo(i+1);
  const next=el('g',{},$('art'));next.innerHTML=last?quail():eggArt(i+1,ng);
  const B=el('g',{},$('art'));el('g',{'clip-path':`url(#${id}b)`},B).innerHTML=eggArt(i,g);
  const T=el('g',{},$('art'));el('g',{'clip-path':`url(#${id}t)`},T).innerHTML=eggArt(i,g);
  const seam=(par)=>el('line',{x1:W,y1:y,x2:E,y2:y,stroke:INK,'stroke-width':2.4,'clip-path':`url(#${id}e)`},par);
  const s1=seam(T),s2=seam(B);
  // the seam draws across
  await anim(280,k=>{const x=W+(E-W)*k;s1.setAttribute('x2',x);s2.setAttribute('x2',x)});
  next.style.opacity=last?0:1;
  if(last)next.setAttribute('transform',`translate(250 600) scale(.35) translate(-250 -600)`);
  // twist the lid twice
  for(const dir of [1,-1]){noise(.05,2600,.3,6);await anim(170,k=>T.setAttribute('transform',`rotate(${Math.sin(k*Math.PI)*3*dir} ${g.cx} ${y})`))}
  noise(.09,700,.45,3);
  // lift straight up
  await anim(420,k=>{const e=ease(k);T.setAttribute('transform',`translate(0 ${-r*.95*e})`)});
  // swing aside and away
  const cxs=last?250:ng.cx,cys=last?600:ng.cy+ng.r;
  await anim(650,k=>{const e=ease(k);
    T.setAttribute('transform',`translate(${r*1.5*e} ${-r*.95+r*.6*e*e}) rotate(${24*e} ${g.cx} ${y})`);T.style.opacity=1-Math.max(0,(k-.4)/.6);
    if(last){const s=.35+.65*e+Math.sin(k*Math.PI)*.12;next.style.opacity=Math.min(1,k*2);next.setAttribute('transform',`translate(${cxs} ${cys+40*(1-e)}) scale(${s}) translate(${-cxs} ${-cys})`)}});
  await anim(380,k=>{B.style.opacity=1-k});
  if(last){finale();return}
  text("OPEN!",`A ${EGGS[i+1].k.toLowerCase()} egg was inside the ${EGGS[i].k.toLowerCase()} egg.`,"Smaller. Faster.");
  st.ei=i+1;header();await anim(650,()=>{});await anim(300,k=>next.style.opacity=1-k);startEgg(i+1)}

// ----- CAD quail: local units, y up, ground = 0 -----
const QO=[250,600],QS=1.72,Q=(x,y)=>[QO[0]+x*QS,QO[1]-y*QS],QJ=(x,y)=>Q(x,y).map(v=>v.toFixed(1)).join(' ');
const QG={Cb:[0,84],Rb:60,Hc:[44,148],Rh:22,eye:[50,152],T:[-78,94]};
const pol=(c,R,deg)=>[c[0]+R*Math.cos(deg*Math.PI/180),c[1]+R*Math.sin(deg*Math.PI/180)];
function quail(){const {Cb,Rb,Hc,Rh,eye,T}=QG,hb=pol(Hc,Rh,150),hr=pol(Hc,Rh,-70),th=pol(Cb,Rb,40),bl=pol(Cb,Rb,-160);
  const rb=Rb*QS,rh=Rh*QS,b1=pol(Hc,Rh,15),b2=pol(Hc,Rh,-12),bt=[82,147],cr=pol(Hc,Rh,100);
  const W1=[-46,103],W2=[26,128],W3=[18,80],rw=50*QS;
  const ln=(a,b,w=1.6)=>`<line x1="${Q(...a)[0]}" y1="${Q(...a)[1]}" x2="${Q(...b)[0]}" y2="${Q(...b)[1]}" stroke-width="${w}"/>`;
  return `<g fill="#fff" stroke="${INK}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round">
   <path d="M${QJ(...bl)} L${QJ(...T)} L${QJ(...hb)} A${rh} ${rh} 0 1 1 ${QJ(...hr)} L${QJ(...th)} A${rb} ${rb} 0 1 1 ${QJ(...bl)}Z"/>
   <path d="M${QJ(...b1)} L${QJ(...bt)} L${QJ(...b2)}"/>
   <path d="M${QJ(...W1)} L${QJ(...W2)} L${QJ(...W3)} A${rw} ${rw} 0 0 1 ${QJ(...W1)}Z" fill="none"/>
   ${ln([-26,99],[14,86],1)}${ln([-30,92],[4,78],1)}
   ${ln(cr,[50,183])}<circle cx="${Q(52.5,186.5)[0]}" cy="${Q(52.5,186.5)[1]}" r="${3*QS}"/>
   <circle cx="${Q(...eye)[0]}" cy="${Q(...eye)[1]}" r="${2.5*QS}"/>
   ${ln([-12,25],[-16,0])}${ln([-8,24.5],[-12,0])}${ln([10,24.5],[12,0])}${ln([14,25],[16,0])}
   ${ln([-34,0],[-6,0])}${ln([4,0],[32,0])}${ln([-34,0],[-38,4])}${ln([32,0],[36,4])}</g>`}
function quailDims(){const {Cb,Rb,Hc,Rh,eye,T}=QG,G='#7d7d7d',f='font-size="8.5" fill="'+INK+'"';
  const L=(a,b,ex='')=>{const A=Q(...a),B=Q(...b);return `<line x1="${A[0]}" y1="${A[1]}" x2="${B[0]}" y2="${B[1]}" ${ex}/>`};
  const arrow=(a,b)=>{const A=Q(...a),B=Q(...b),an=Math.atan2(B[1]-A[1],B[0]-A[0]),h=6,w=2.2;
    return `<path d="M${B[0]} ${B[1]} L${B[0]-h*Math.cos(an)+w*Math.sin(an)} ${B[1]-h*Math.sin(an)-w*Math.cos(an)} L${B[0]-h*Math.cos(an)-w*Math.sin(an)} ${B[1]-h*Math.sin(an)+w*Math.cos(an)}Z" fill="${INK}" stroke="none"/>`};
  const dim=(a,b)=>L(a,b)+arrow(a,b)+arrow(b,a);
  const T_=(x,y,t,rot=0,anc='middle')=>{const P=Q(x,y);return `<text x="${P[0]}" y="${P[1]}" ${f} text-anchor="${anc}" transform="rotate(${rot} ${P[0]} ${P[1]})" stroke="none">${t}</text>`};
  const cm=(c,n=5)=>L([c[0]-n,c[1]],[c[0]+n,c[1]])+L([c[0],c[1]-n],[c[0],c[1]+n]);
  const arcA=(c,R,d0,d1)=>{const A=Q(...pol(c,R,d0)),B=Q(...pol(c,R,d1));return `<path d="M${A[0]} ${A[1]} A${R*QS} ${R*QS} 0 0 0 ${B[0]} ${B[1]}" fill="none"/>`};
  const blocks=[
   // centre lines
   `<g stroke="${G}" stroke-width=".6" stroke-dasharray="10 2 2 2">${L([-96,84],[74,84])}${L([0,10],[0,158])}${L([22,148],[100,148])}${L([44,120],[44,178])}${L([-120,0],[90,0])}</g>`+
   `<g stroke="${INK}" stroke-width=".7">${cm(Cb)}${cm(Hc)}${cm(eye,3.5)}</g>`,
   // radii
   `<g stroke="${INK}" stroke-width=".7">${L(Cb,pol(Cb,Rb+22,-128))}${arrow(Cb,pol(Cb,Rb,-128))}${L(Hc,pol(Hc,Rh+20,58))}${arrow(Hc,pol(Hc,Rh,58))}
     ${L(eye,[34,176])}${L([34,176],[24,176])}${L([-46,103],[-66,128])}</g>`+
   T_(...pol(Cb,Rb+26,-128),'R60',0)+T_(...pol(Hc,Rh+24,58),'R22',0)+T_(20,178,'Ø5',0,'end')+T_(-70,131,'R50',0),
   // overall dims
   `<g stroke="${INK}" stroke-width=".7">${L([84,190],[108,190])}${L([36,0],[108,0])}${dim([104,0],[104,190])}
     ${L([-78,90],[-78,-22])}${L([82,143],[82,-22])}${dim([-78,-18],[82,-18])}
     ${L([0,165],[0,206])}${L([44,172],[44,206])}${dim([0,202],[44,202])}</g>`+
   T_(108,95,'190',-90)+T_(2,-22,'160')+T_(22,204.5,'44'),
   // angles
   `<g stroke="${INK}" stroke-width=".7">${L(T,[-118,94],'stroke-dasharray="10 2 2 2" stroke="'+G+'"')}${L(T,pol(T,40,212.3))}${arcA(T,34,180,212.3)}
     
     ${L([-16,0],[-24,-10])}${arcA([-16,0],14,98,180)}</g>`+
   T_(...pol(T,42,197),'32°')+T_(-42,3,'98°')+
   `<g stroke="${INK}" stroke-width=".7">${L([-14.5,12],[-30,12])}${arrow([-30,12],[-14.5,12])}${L([-10.5,12],[-2,12])}${arrow([-2,12],[-10.5,12])}</g>`+T_(-32,14,'4',0,'end'),
   // title block
   `<g stroke="${INK}" stroke-width="1.2" fill="#fff"><rect x="392" y="118" width="100" height="62"/><line x1="392" y1="138" x2="492" y2="138"/></g>
    <text x="442" y="132" font-size="9" text-anchor="middle" fill="${INK}" letter-spacing=".4">EGGSHKA · FINAL</text>
    <text x="442" y="168" font-size="26" text-anchor="middle" fill="${INK}" font-family="Felipa, serif">Quail</text>`];
  return blocks}

function finale(){st.phase='final';header();html($('ui'),'');html($('hud'),'');html($('guide'),'');html($('con'),'');$('con').style.opacity=1;
  text(`${String(N).padStart(2,'0')} / ${String(N).padStart(2,'0')} · COMPLETE`,"A quail is born!","Ostrich, duck, chicken, quail. All four eggs drawn.");
  const b=el('g',{style:'cursor:pointer'},$('txt'));b.innerHTML=`<rect x="392" y="676" width="100" height="34" fill="${INK}"/><text x="442" y="698" text-anchor="middle" font-size="14" fill="#fff">Restart</text>`;
  b.addEventListener('pointerdown',e=>{e.stopPropagation();html($('art'),'');html($('con'),'');startEgg(0)});
  html($('pen'),'');const dg=el('g',{'font-family':'DM Mono, Menlo, monospace'},$('pen'));
  quailDims().forEach((blk,i)=>{const g=el('g',{},dg);g.innerHTML=blk;g.style.opacity=0;g.style.transition='opacity .5s';setTimeout(()=>g.style.opacity=1,250+i*380)})}

// ----- input -----
function sp(e){const p=S.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const r=p.matrixTransform(S.getScreenCTM().inverse());return[r.x,r.y]}
S.addEventListener('pointerdown',e=>{const p=sp(e),E=EGGS[st.ei];
  if(st.phase==='ready'){const s0=st.P[0];if(Math.hypot(p[0]-s0[0],p[1]-s0[1])<E.tol+12){st.phase='trace';st.drawing=true;st.t0=performance.now();st.stroke=[p];S.setPointerCapture(e.pointerId);
      $('guide').querySelector('.pulse').remove();text(`EGG ${st.ei+1} · ${E.en}`,"Trace it all the way round!","Stay inside the grey band.");tick()}return}
  if(st.phase==='trace'&&!st.drawing){const M=st.P.length,end=st.stroke[st.stroke.length-1];if(Math.hypot(p[0]-end[0],p[1]-end[1])<E.tol+10){st.drawing=true;S.setPointerCapture(e.pointerId)}}});
S.addEventListener('pointermove',e=>{lastP=sp(e);hud(lastP);if(st.phase!=='trace'||!st.drawing)return;const p=lastP,E=EGGS[st.ei];
  st.stroke.push(p);penPath();
  if(nearestAll(p)>E.tol){fail("Off the line!","Keep your stroke inside the grey band.");return}
  advance(p);if(st.pos>=st.P.length-3)success()});
const up=()=>{if(st.phase==='trace')st.drawing=false};
S.addEventListener('pointerup',up);S.addEventListener('pointercancel',up);

// test hooks: #egg=n  #final
window.autoTrace=(frac=1,off=0)=>{const r=S.getBoundingClientRect(),k=r.height/760;const f=(t,p)=>S.dispatchEvent(new PointerEvent(t,{clientX:r.left+p[0]*k,clientY:r.top+p[1]*k,pointerId:1,bubbles:true}));
  const P=st.P,M=P.length;f('pointerdown',P[0]);for(let i=1;i<=Math.round(M*frac);i++){const s=P[i%M];f('pointermove',[s[0]+off,s[1]])}f('pointerup',P[Math.round(M*frac)%M])};
const H=new URLSearchParams(location.hash.slice(1));
if(H.has('final')){st.ei=N-1;finale();const n=el('g',{},$('art'));n.innerHTML=quail()}else startEgg(+H.get('egg')||0);
</script></body></html>
