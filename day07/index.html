<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Bon Appétit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,500&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  /* A dark room like Remy's tasting scene: each bite lights its own shapes somewhere in the dark. */
  :root {
    --night: #0b0908;
    --ink: #f6efe6;
    --muted: #8f857c;
    --display: "Fraunces", Georgia, serif;
    --body: "Gowun Dodum", "Apple SD Gothic Neo", system-ui, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--night); color: var(--ink); }
  body { font-family: var(--body); -webkit-font-smoothing: antialiased; }
  canvas { display: block; }
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; }
  .plate { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); cursor: pointer; touch-action: manipulation; }
  .plate canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #glow { mix-blend-mode: screen; opacity: 0; transition: opacity .25s; filter: blur(1.5px); pointer-events: none; }
  #glow.on { opacity: 1; }
  .plate.bump { animation: bump .45s cubic-bezier(.3,1.6,.5,1); }
  @keyframes bump { 0% { transform: translate(-50%, -50%) scale(1); } 35% { transform: translate(-50%, -50%) scale(1.025); } 100% { transform: translate(-50%, -50%) scale(1); } }
  h1 { position: fixed; left: max(24px, env(safe-area-inset-left, 0px)); top: calc(20px + env(safe-area-inset-top, 0px)); margin: 0;
    font: italic 500 clamp(26px, 3.2vw, 40px)/1 var(--display); letter-spacing: -.01em; pointer-events: none; z-index: 2; }
  .hint { position: fixed; right: max(24px, env(safe-area-inset-right, 0px)); top: calc(28px + env(safe-area-inset-top, 0px)); font-size: 13px; color: var(--muted); pointer-events: none; text-align: right; z-index: 2; }
  .tip { position: fixed; pointer-events: none; padding: 6px 10px; border-radius: 999px; background: rgba(24,20,18,.88); color: var(--ink);
    font-size: 13px; white-space: nowrap; box-shadow: 0 2px 12px rgba(0,0,0,.4); transform: translate(14px, -50%); opacity: 0; transition: opacity .15s; z-index: 3; }
  .tip.on { opacity: 1; }
  .tip i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
  .remy { position: absolute; left: 50%; top: -2%; width: 40%; aspect-ratio: 473 / 394; margin-left: -20%; pointer-events: none;
    transform: translateY(108%); opacity: 1;
    -webkit-mask-image: linear-gradient(to bottom, #000 76%, transparent 100%); mask-image: linear-gradient(to bottom, #000 76%, transparent 100%); }
  .remy.up { transform: translateY(0); transition: transform 1s cubic-bezier(.2,.9,.25,1); }
  .remy.up.gone { opacity: 0; transition: opacity 1.2s ease; }
  .remy img { width: 100%; height: 100%; display: block; filter: drop-shadow(0 0 14px rgba(255, 196, 150, .26)); }
  .recipe { position: fixed; left: 50%; bottom: calc(26px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 2;
    display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 18px; width: max-content; max-width: calc(100vw - 32px);
    margin: 0; padding: 0; list-style: none; font-size: 14px; pointer-events: none; }
  .recipe li { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); transition: color .3s; }
  .recipe li i { width: 10px; height: 10px; border-radius: 50%; box-sizing: border-box; border: 1.5px solid var(--c); background: transparent; transition: background .3s; }
  .recipe li.on { color: var(--ink); }
  .recipe li.on i { background: var(--c); }
  @media (prefers-reduced-motion: reduce) { .plate.bump { animation: none; } }
</style>

    if (ss < .14 && vv > .8) return null;
    const ex = (X - 560) / 330, ey = (Y - 620) / 335, inside = ex * ex + ey * ey < 1;
    if (hd >= 60 && hd < 170 && ss > .2) {
      if (segd(X, Y, CH[0], CH[1]) < 12) return 'chive';
      if (!inside || PARS.some(([cx, cy, cr]) => Math.hypot(X - cx, Y - cy) < cr)) return 'parsley';
      return 'zucchini';
    }
    const intom = TOM.some(([cx, cy, cr]) => Math.hypot(X - cx, Y - cy) < cr);
    if (hd >= 260 && hd < 345) return 'onion';
    if (intom && (hd >= 330 || hd < 40)) return 'tomato';
    if ((hd >= 330 || hd < 24) && inside) return (ss < .8 && vv < .93) ? 'onion' : 'pepper';
    if (hd < 32 && ss < .8 && inside) return 'onion';
    if (hd >= 20 && hd < 70) return inside ? 'squash' : 'sauce';
    if (hd < 20) return inside ? 'onion' : 'sauce';
    return null;
  }

  const ready = new Promise(res => {
    const im = new Image();
    im.onload = () => {
      dctx.drawImage(im, 0, 0);
      const data = dctx.getImageData(0, 0, NW, NH), d = data.data;
      for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++) {
        const i = ((y * GS + 1) * NW + (x * GS + 1)) * 4;
        const k = classify(d[i], d[i + 1], d[i + 2], x * GS, y * GS);
        grid[y * GW + x] = k ? KEYS.indexOf(k) + 1 : 0;
      }
      // colour-to-alpha against white so the blooms show around the plate
      for (let i = 0; i < d.length; i += 4) {
        const m = Math.max(255 - d[i], 255 - d[i + 1], 255 - d[i + 2]);
        const a = Math.max(0, Math.min(1, (m - 8) / 42));
        if (a < 1) {
          if (a <= 0) { d[i + 3] = 0; continue; }
          d[i] = 255 - (255 - d[i]) / a; d[i + 1] = 255 - (255 - d[i + 1]) / a; d[i + 2] = 255 - (255 - d[i + 2]) / a;
          d[i + 3] = a * 255;
        }
      }
      dctx.putImageData(data, 0, 0);
      KEYS.forEach((k, ki) => {
        const c = document.createElement('canvas'); c.width = GW; c.height = GH;
        const cx = c.getContext('2d'), id = cx.createImageData(GW, GH);
        for (let i = 0; i < grid.length; i++) if (grid[i] === ki + 1) { id.data[i * 4] = id.data[i * 4 + 1] = id.data[i * 4 + 2] = 255; id.data[i * 4 + 3] = 120; }
        cx.putImageData(id, 0, 0); masks[k] = c;
      });
      res();
    };
    im.src = IMG;
  });

  // ---------- layout ----------
  const fx = document.getElementById('fx'), fctx = fx.getContext('2d');
  let VW, VH, PW, PH, DPR;
  function layout() {
    DPR = Math.min(2, devicePixelRatio || 1); VW = innerWidth; VH = innerHeight;
    fx.width = VW * DPR; fx.height = VH * DPR; fctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    PH = Math.min(VH * .74, VW * .78 * NH / NW); PW = PH * NW / NH;
    plate.style.width = PW + 'px'; plate.style.height = PH + 'px';
  }
  layout(); addEventListener('resize', layout);

  function at(cx, cy) {
    const r = plate.getBoundingClientRect();
    const X = (cx - r.left) / r.width * NW, Y = (cy - r.top) / r.height * NH;
    if (X < 0 || Y < 0 || X >= NW || Y >= NH) return null;
    const v = grid[Math.floor(Y / GS) * GW + Math.floor(X / GS)];
    return v ? KEYS[v - 1] : null;
  }

  // ---------- hover ----------
  let hoverK = null;
  plate.addEventListener('pointermove', e => {
    const k = at(e.clientX, e.clientY);
    if (k !== hoverK) {
      hoverK = k;
      if (k) {
        gctx.clearRect(0, 0, NW, NH); gctx.imageSmoothingEnabled = true; gctx.drawImage(masks[k], 0, 0, NW, NH);
        glow.classList.add('on');
      } else glow.classList.remove('on');
    }
    plate.style.cursor = k ? 'pointer' : 'default';
  });
  plate.addEventListener('pointerleave', () => { hoverK = null; glow.classList.remove('on'); });

  // ---------- shapes: each bite places a handful of different shapes anywhere in the dark ----------
  const shapes = [];
  const rnd = (a, b) => a + Math.random() * (b - a);
  const ease = t => 1 - Math.pow(1 - t, 3);
  function tint(hex, w) { const n = parseInt(hex.slice(1), 16); const r = n >> 16, g = n >> 8 & 255, b = n & 255;
    return `rgb(${Math.round(r + (255 - r) * w)},${Math.round(g + (255 - g) * w)},${Math.round(b + (255 - b) * w)})`; }
  function rgba(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${n >> 8 & 255},${n & 255},${a})`; }
  // draw a polyline progressively: pts is [[x,y],...], f is 0..1
  function trace(c, pts, f) { const n = Math.max(2, Math.ceil(pts.length * f)); c.beginPath(); for (let i = 0; i < n; i++) i ? c.lineTo(pts[i][0], pts[i][1]) : c.moveTo(pts[i][0], pts[i][1]); c.stroke(); }

  const STYLES = {
    // soft out-of-focus light, like the bokeh behind Remy
    bokeh(c, g, p, e) { const r = g.s * 1.5 * (.8 + .2 * e); const gr = c.createRadialGradient(0, 0, 0, 0, 0, r);
      gr.addColorStop(0, rgba(g.col, .75)); gr.addColorStop(.55, rgba(g.col, .45)); gr.addColorStop(1, rgba(g.col, 0));
      c.globalCompositeOperation = 'lighter'; c.fillStyle = gr; c.beginPath(); c.arc(0, 0, r, 0, 7); c.fill(); },
    // flat solid disc
    disc(c, g, p, e) { c.fillStyle = g.col; c.shadowColor = g.col; c.shadowBlur = g.s * .4; c.beginPath(); c.arc(0, 0, g.s * .55 * e, 0, 7); c.fill(); },
    // outlined ring that opens up
    ring(c, g, p, e) { c.strokeStyle = g.light; c.lineWidth = g.s * .12; c.beginPath(); c.arc(0, 0, g.s * (.4 + .45 * e), 0, 7); c.stroke(); },
    // a spiral drawn in one stroke
    spiral(c, g, p) { if (!g.pts) { g.pts = []; for (let i = 0; i <= 120; i++) { const a = i / 120 * Math.PI * 5, r = g.s * .08 + i / 120 * g.s * .7; g.pts.push([Math.cos(a) * r, Math.sin(a) * r]); } }
      c.strokeStyle = g.pale; c.lineWidth = Math.max(2, g.s * .05); c.lineCap = 'round'; trace(c, g.pts, Math.min(1, p / .45)); },
    // thick brush hook with a gradient along it
    brush(c, g, p) { if (!g.pts) { g.pts = []; const s = g.s; for (let i = 0; i <= 60; i++) { const t = i / 60; const a = Math.PI * (.2 + t * 1.25);
        g.pts.push([Math.cos(a) * s * (1 - t * .35) + t * s * .4, -s + t * s * 2.1 + Math.sin(a) * s * .3]); } }
      const gr = c.createLinearGradient(0, -g.s, 0, g.s); gr.addColorStop(0, g.pale); gr.addColorStop(1, g.col);
      c.strokeStyle = gr; c.lineWidth = g.s * .32; c.lineCap = 'round'; c.lineJoin = 'round'; trace(c, g.pts, Math.min(1, p / .4)); },
    // three or four thin parallel swooshes
    swoosh(c, g, p) { if (!g.lines) { g.lines = []; const n = 3 + (Math.random() < .5); for (let j = 0; j < n; j++) { const pts = [], R = g.s * (.7 + j * .14);
        for (let i = 0; i <= 40; i++) { const a = -Math.PI * .1 - i / 40 * Math.PI * .75; pts.push([Math.cos(a) * R, Math.sin(a) * R]); } g.lines.push(pts); } }
      c.strokeStyle = g.pale; c.lineWidth = Math.max(1.6, g.s * .035); c.lineCap = 'round'; g.lines.forEach((pts, j) => trace(c, pts, Math.min(1, Math.max(0, (p - j * .04) / .4)))); },
    // a wavy line
    squiggle(c, g, p) { if (!g.pts) { g.pts = []; for (let i = 0; i <= 80; i++) { const t = i / 80; g.pts.push([(t - .5) * g.s * 3, Math.sin(t * Math.PI * 4) * g.s * .3]); } }
      c.strokeStyle = g.light; c.lineWidth = Math.max(2.5, g.s * .08); c.lineCap = 'round'; trace(c, g.pts, Math.min(1, p / .5)); },
    // a glowing band ring
    halo(c, g, p, e) { const r = g.s * (.7 + .5 * e); const gr = c.createRadialGradient(0, 0, r * .55, 0, 0, r);
      gr.addColorStop(0, rgba(g.col, 0)); gr.addColorStop(.6, rgba(g.col, .7)); gr.addColorStop(1, rgba(g.col, 0));
      c.globalCompositeOperation = 'lighter'; c.fillStyle = gr; c.beginPath(); c.arc(0, 0, r, 0, 7); c.fill(); },
    // a little cluster of dots popping one after another
    cluster(c, g, p) { if (!g.dots) g.dots = Array.from({ length: 9 }, (_, i) => [rnd(-1, 1) * g.s, rnd(-1, 1) * g.s, rnd(.06, .16) * g.s, i * .03]);
      c.fillStyle = g.light; g.dots.forEach(([x, y, r, d]) => { const q = Math.max(0, Math.min(1, (p - d) / .15)); if (q) { c.beginPath(); c.arc(x, y, r * ease(q), 0, 7); c.fill(); } }); },
    // four-point glints that twinkle
    sparkle(c, g, p) { if (!g.st) g.st = Array.from({ length: 4 }, () => [rnd(-1, 1) * g.s, rnd(-1, 1) * g.s, rnd(.15, .35) * g.s, rnd(0, 6)]);
      c.fillStyle = g.pale; c.globalCompositeOperation = 'lighter';
      g.st.forEach(([x, y, r, ph]) => { const k = r * (.6 + .4 * Math.sin(p * 18 + ph)); c.beginPath(); c.moveTo(x, y - k); c.quadraticCurveTo(x, y, x + k, y); c.quadraticCurveTo(x, y, x, y + k); c.quadraticCurveTo(x, y, x - k, y); c.quadraticCurveTo(x, y, x, y - k); c.fill(); }); },
    // a solid crescent stroke with a gradient
    crescent(c, g, p, e) { const gr = c.createLinearGradient(-g.s, 0, g.s, 0); gr.addColorStop(0, g.col); gr.addColorStop(1, g.dark);
      c.strokeStyle = gr; c.lineWidth = g.s * .38; c.lineCap = 'round'; c.beginPath(); c.arc(0, 0, g.s * .75, Math.PI * .15, Math.PI * (.15 + 1.1 * e)); c.stroke(); },
    // an organic watercolour blob
    blob(c, g, p, e) { if (!g.k8) g.k8 = Array.from({ length: 9 }, () => rnd(.75, 1.15));
      const gr = c.createRadialGradient(-g.s * .2, -g.s * .2, 0, 0, 0, g.s); gr.addColorStop(0, g.light); gr.addColorStop(1, rgba(g.col, .85));
      c.fillStyle = gr; c.beginPath(); for (let i = 0; i <= 9; i++) { const a = i / 9 * Math.PI * 2, r = g.s * .7 * e * g.k8[i % 9];
        const x = Math.cos(a) * r, y = Math.sin(a) * r; i ? c.quadraticCurveTo(Math.cos(a - .35) * r * 1.08, Math.sin(a - .35) * r * 1.08, x, y) : c.moveTo(x, y); } c.fill(); },
    // a gradient stripe that sweeps
    stripe(c, g, p, e) { const w = g.s * 2.6 * e, h = g.s * .22; const gr = c.createLinearGradient(-w / 2, 0, w / 2, 0);
      gr.addColorStop(0, rgba(g.col, 0)); gr.addColorStop(.5, g.light); gr.addColorStop(1, rgba(g.col, 0));
      c.fillStyle = gr; c.beginPath(); c.roundRect ? c.roundRect(-w / 2, -h / 2, w, h, h / 2) : c.rect(-w / 2, -h / 2, w, h); c.fill(); },
  };
  const STYLE_KEYS = Object.keys(STYLES);

  function spawn(k) {
    const ing = ING[k], unit = Math.min(VW, VH) / 800;
    const pick = STYLE_KEYS.slice().sort(() => Math.random() - .5).slice(0, 7);
    pick.forEach((style, i) => {
      const col = ing.col[Math.floor(Math.random() * 3)];
      shapes.push({
        style, col, light: tint(col, .25), pale: tint(col, .6), dark: ing.col[2],
        x: rnd(.04, .96) * VW, y: rnd(.06, .94) * VH,
        s: rnd(30, style === 'bokeh' || style === 'halo' ? 110 : 70) * unit,
        rot: rnd(0, Math.PI * 2), vr: rnd(-.15, .15), vx: rnd(-14, 14) * unit, vy: rnd(-14, 6) * unit,
        born: performance.now() + i * 70, dur: rnd(2800, 4800), kill: 0, fade: false,
      });
    });
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    fctx.clearRect(0, 0, VW, VH);
    for (let i = shapes.length - 1; i >= 0; i--) {
      const g = shapes[i];
      const p = (now - g.born) / g.dur;
      if (p < 0) continue;
      if (g.fade) g.kill += dt / .45;
      if (p >= 1 || g.kill >= 1) { shapes.splice(i, 1); continue; }
      g.x += g.vx * dt; g.y += g.vy * dt; g.rot += g.vr * dt;
      const e = ease(Math.min(1, p / .22));
      const alpha = (p < .12 ? p / .12 : p > .62 ? 1 - (p - .62) / .38 : 1) * (1 - g.kill);
      fctx.save(); fctx.translate(g.x, g.y); fctx.rotate(g.rot); fctx.globalAlpha = Math.max(0, alpha);
      STYLES[g.style](fctx, g, p, e);
      fctx.restore();
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ---------- sound ----------
  let ac = null, out, verb;
  function audio() {
    if (ac) return ac;
    ac = new (window.AudioContext || window.webkitAudioContext)();
    out = ac.createGain(); out.gain.value = .7;
    const comp = ac.createDynamicsCompressor(); out.connect(comp); comp.connect(ac.destination);
    verb = ac.createConvolver();
    const len = ac.sampleRate * 2.6, ir = ac.createBuffer(2, len, ac.sampleRate);
    for (let ch = 0; ch < 2; ch++) { const b = ir.getChannelData(ch); for (let i = 0; i < len; i++) b[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3); }
    verb.buffer = ir; const wet = ac.createGain(); wet.gain.value = .32; verb.connect(wet); wet.connect(comp);
    return ac;
  }
  function voice(t, peak, attack, decay, hold = 0) {
    const g = ac.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(peak, t + attack);
    if (hold) g.gain.setValueAtTime(peak, t + attack + hold);
    g.gain.exponentialRampToValueAtTime(.0001, t + attack + hold + decay);
    g.connect(out); g.connect(verb); return g;
  }
  function osc(type, f, t, end, dest, detune = 0) { const o = ac.createOscillator(); o.type = type; o.frequency.value = f; o.detune.value = detune; o.connect(dest); o.start(t); o.stop(end); return o; }
  function vibrato(o, t, end, rate, depth) { const l = ac.createOscillator(), lg = ac.createGain(); l.frequency.value = rate; lg.gain.value = depth; l.connect(lg); lg.connect(o.frequency); l.start(t); l.stop(end); }
  const BAR = 60 / 72 * 4;
  const INST = {
    piano(f, t) { const g = voice(t, .32, .005, 1.8); osc('triangle', f, t, t + 2, g); const g2 = voice(t, .1, .003, .7); osc('sine', f * 2, t, t + 1, g2); osc('sine', f * 3.01, t, t + .6, voice(t, .04, .002, .4)); },
    marimba(f, t) { osc('sine', f, t, t + 1, voice(t, .38, .003, .75)); osc('sine', f * 3.99, t, t + .3, voice(t, .12, .002, .18)); },
    glock(f, t) { osc('sine', f, t, t + 2.4, voice(t, .18, .002, 2.2)); osc('sine', f * 2.76, t, t + 1, voice(t, .06, .002, .8)); osc('sine', f * 5.4, t, t + .5, voice(t, .03, .001, .35)); },
    flute(f, t) { const g = voice(t, .2, .09, .5, .45); const o = osc('sine', f, t, t + 1.2, g); vibrato(o, t, t + 1.2, 5.2, 4); osc('triangle', f * 2, t, t + 1.2, voice(t, .025, .09, .4, .45));
      const n = ac.createBufferSource(), nb = ac.createBuffer(1, ac.sampleRate, ac.sampleRate), nd = nb.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
      n.buffer = nb; const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = f * 2; bp.Q.value = 3; n.connect(bp); bp.connect(voice(t, .05, .05, .3, .3)); n.start(t); n.stop(t + 1); },
    cello(f, t) { const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 900; lp.connect(voice(t, .2, .14, 1.4, .8)); const o = osc('sawtooth', f, t, t + 2.6, lp); vibrato(o, t + .2, t + 2.6, 5, 2.2); },
    accordion(f, t) { const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1400; lp.connect(voice(t, .09, .2, 1.2, .8));
      [[f, -7], [f, 7], [f * 1.5, 0], [f * 2, -4]].forEach(([fr, dt]) => osc('sawtooth', fr, t, t + 2.4, lp, dt)); },
    pizz(f, t) { const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.setValueAtTime(2600, t); lp.frequency.exponentialRampToValueAtTime(400, t + .3); lp.connect(voice(t, .4, .003, .38)); osc('triangle', f, t, t + .5, lp); osc('sawtooth', f, t, t + .5, lp); },
    harp(f, t) { [f, f * 1.189, f * 1.335].forEach((fr, i) => { const tt = t + i * .06; osc('triangle', fr, tt, tt + 2.2, voice(tt, .16, .002, 2)); osc('sine', fr * 2, tt, tt + 1, voice(tt, .05, .002, .8)); }); },
  };
  function play(k, t) { audio(); INST[ING[k].inst](ING[k].f, t); }

  // ---------- one bite: one note, one set of shapes ----------
  const tasted = new Set(), remy = document.getElementById('remy'), recipe = document.getElementById('recipe');
  recipe.innerHTML = KEYS.map(k => `<li data-k="${k}" style="--c:${ING[k].col[0]}"><i></i>${ING[k].ko}</li>`).join('');
  const marks = {}; recipe.querySelectorAll('li').forEach(li => marks[li.dataset.k] = li);
  let remyTimers = [], revealed = false;
  function taste(k) {
    audio(); if (ac.state === 'suspended') ac.resume();
    play(k, ac.currentTime + .01);
    spawn(k);
    plate.classList.remove('bump'); void plate.offsetWidth; plate.classList.add('bump');
    tasted.add(k); marks[k].classList.add('on');
    if (tasted.size === KEYS.length && !revealed) { revealed = true; setTimeout(reveal, 450); }
  }
  // every ingredient tasted: Remy pops up from behind the plate, with a little flourish
  function reveal() {
    remyTimers.forEach(clearTimeout);
    remy.classList.remove('gone'); remy.classList.add('up');
    remyTimers = [setTimeout(() => remy.classList.add('gone'), 6000), setTimeout(() => remy.classList.remove('up', 'gone'), 7300)];
    const t = ac.currentTime + .05;
    ['onion', 'tomato', 'pepper', 'zucchini', 'parsley', 'squash', 'chive'].forEach((k, i) => play(k, t + i * .09));
    play('sauce', t);
    KEYS.forEach((k, i) => setTimeout(() => spawn(k), 120 + i * 90));
  }
  function reset() {
    shapes.forEach(g => g.fade = true);
    revealed = false; tasted.clear(); Object.values(marks).forEach(li => li.classList.remove('on'));
    remyTimers.forEach(clearTimeout); if (remy.classList.contains('up')) { remy.classList.add('gone'); remyTimers = [setTimeout(() => remy.classList.remove('up', 'gone'), 1300)]; }
  }
  plate.addEventListener('click', e => { const k = at(e.clientX, e.clientY); if (k) taste(k); });
  addEventListener('keydown', e => { if (e.key === 'r' || e.key === 'R') reset(); });

  ready.then(() => { window.__toc = { taste, at, grid, KEYS, shapes, reveal, reset }; });
})();
</script>
